### YamlMime:TSType
name: OfficeRuntime.Storage
uid: office-runtime!OfficeRuntime.Storage:interface
package: office-runtime!
fullName: OfficeRuntime.Storage
summary: 非同期、グローバル、および永続的なキー値ストレージ。
remarks: >-
  \[[API セット: SharedRuntime 1.1、メールボックス 1.10](/office/dev/add-ins/reference/javascript-api-for-office) \]


  **重要**: Outlookサポートは、イベント ベースのライセンス認証 [でのみ利用できます。](https://docs.microsoft.com/office/dev/add-ins/outlook/autolaunch)<!-- -->.


  Storage制限はドメインごとに 10 MB で、複数のアドインで共有できます。
isPreview: false
isDeprecated: false
type: interface
methods:
- name: getItem(key)
  uid: office-runtime!OfficeRuntime.Storage#getItem:member(1)
  package: office-runtime!
  fullName: getItem(key)
  summary: キーに基づいてストレージからアイテムを取得します。 Promise を返します。 Promise が解決しない場合は、null を返します。
  remarks: >-
    \[[API セット: SharedRuntime 1.1、メールボックス 1.10](/office/dev/add-ins/reference/javascript-api-for-office) \]


    **重要**: Outlookサポートは、イベント ベースのライセンス認証 [でのみ利用できます。](https://docs.microsoft.com/office/dev/add-ins/outlook/autolaunch)<!-- -->.
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItem(key: string): Promise<string | null>;'
    parameters:
    - id: key
      description: 取得するアイテムのキー。 文字列である必要があります。
      type: string
    return:
      type: Promise&lt;string | null&gt;
      description: ''
- name: getItems(keys)
  uid: office-runtime!OfficeRuntime.Storage#getItems:member(1)
  package: office-runtime!
