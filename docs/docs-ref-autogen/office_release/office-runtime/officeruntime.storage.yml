  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItems(keys: string[]): Promise<{ [key: string]: string | null }>;'
    parameters:
    - id: keys
      description: 削除するアイテムのキー。 文字列の配列である必要があります。
      type: string[]
    return:
      type: 'Promise&lt;{ [key: string]: string | null }&gt;'
      description: ''
