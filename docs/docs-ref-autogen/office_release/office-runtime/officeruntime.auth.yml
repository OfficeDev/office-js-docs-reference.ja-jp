### YamlMime:TSType
name: OfficeRuntime.Auth
uid: office-runtime!OfficeRuntime.Auth:interface
package: office-runtime!
fullName: OfficeRuntime.Auth
summary: 承認関連 API を含むインターフェイス。
remarks: このインターフェイスのメソッドは、インターフェイス内のメソッドと同 `Office.auth` じです。 将来新しい認証の種類が追加された場合、その認証の種類はインターフェイスにのみ追加 `Office.auth` されます。 わかりやすくするために、ドキュメントの使用全体のコード例 `Office.auth`<!-- -->.
isPreview: false
isDeprecated: false
type: interface
methods:
- name: getAccessToken(options)
  uid: office-runtime!OfficeRuntime.Auth#getAccessToken:member(1)
  package: office-runtime!
  fullName: getAccessToken(options)
  summary: >-
    Azure Active Directory V 2.0 のエンドポイントを呼び出して、アドインの Web アプリケーションへのアクセス トークンを取得します。 アドインがユーザーを識別できます。 サーバー側のコードは、このトークンを使用して、"代理" OAuth フローを使用してアドインの web アプリケーションGraph Microsoft Graph に[アクセスできます。](https://docs.microsoft.com/azure/active-directory/develop/active-directory-v2-protocols-oauth-on-behalf-of)<!-- -->. この API では、アドインを Azure アプリケーションにブリッジするシングル サインオン構成が必要です。 Office ユーザーは、組織アカウントと Microsoft アカウントを使用してサインインします。 Microsoft Azure では、Microsoft Graph のリソースにアクセスするために、両方のユーザー アカウントの種類を対象にしたトークンを返します。


    **重要**: Outlook、アドインが Outlook.com または Gmail メールボックスに読み込まれている場合、この API はサポートされません。
  remarks: '**ホスト**: Excel、Outlook、PowerPoint、Word'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getAccessToken(options?: AuthOptions): Promise<string>;'
    parameters:
    - id: options
      description: 省略可能。 サインオン動作 `AuthOptions` を定義するオブジェクトを受け入れる。
      type: <xref uid="office-runtime!OfficeRuntime.AuthOptions:interface" />
    return:
      type: Promise&lt;string&gt;
      description: アクセス トークンを約束します。
