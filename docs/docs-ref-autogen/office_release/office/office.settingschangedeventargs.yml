### YamlMime:TSType
name: Office.SettingsChangedEventArgs
uid: office!Office.SettingsChangedEventArgs:interface
package: office!
fullName: Office.SettingsChangedEventArgs
summary: >-
  settingsChanged イベントが発生した設定についての情報を提供します。


  settingsChanged イベントのイベント ハンドラーを追加するには、Office.設定 オブジェクトの addHandlerAsync[メソッドを使用](xref:office!Office.Settings:interface)します。


  settingsChanged イベントは、アドインのスクリプトが 設定.saveAsync メソッドを呼び出して、設定のメモリ内コピーをドキュメント ファイルに保持する場合にのみ発生します。 settingsChanged イベントは、Settings.set または Settings.remove メソッドが呼び出された場合にはトリガーされません。


  settingsChanged イベントは、複数のユーザーが共有 (共同編集) ドキュメントでアドインを使用するときに同時に設定を保存しようとするときに、潜在的な競合を処理するように設計されています。


  **重要**: アドインのコードは、アドインが Excel クライアントで実行されている場合に settingsChanged イベントのハンドラーを登録できますが、Excel on the web で開かれているスプレッドシートがアドインに読み込まれ、複数のユーザーがスプレッドシートを編集している (共同編集) 場合にのみイベントが発生します。 したがって、実際には、settingsChanged イベントは、共同編集のシナリオExcel on the webでのみサポートされます。
remarks: ''
