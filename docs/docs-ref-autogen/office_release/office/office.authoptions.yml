### YamlMime:TSType
name: Office.AuthOptions
uid: office!Office.AuthOptions:interface
package: office!
fullName: Office.AuthOptions
summary: Office v からアドインへのアクセス トークンを取得するときに、ユーザー エクスペリエンスのAADします。 `getAccessToken` メソッドを使用して AAD v. 2.0 からアドインに対するアクセス トークンを取得する場合用のユーザー エクスペリエンス用のオプションがあります。
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: allowConsentPrompt
  uid: office!Office.AuthOptions#allowConsentPrompt:member
  package: office!
  fullName: allowConsentPrompt
  summary: 必要Officeアクセス トークンをサイレントモードまたは対話型の同意によって取得できます。 既定値は `false` です。<!-- -->. に設定されている場合 `false`<!-- -->、Officeアクセス トークンの取得をサイレント モードで試みる必要があります。 この操作に失敗した場合、Officeエラーが返されます。 に設定されている場合 `true`<!-- -->をOfficeアクセス トークンをサイレント モードで取得できない場合、対話型の同意 UI が表示されます。 このプロンプトでは、Microsoft のスコープではなく、AADスコープに対する同意Graphされます。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'allowConsentPrompt?: boolean;'
    return:
      type: boolean
- name: allowSignInPrompt
  uid: office!Office.AuthOptions#allowSignInPrompt:member
  package: office!
  fullName: allowSignInPrompt
  summary: ユーザー Officeサインインするための対話型 UI を表示したり、同意がある場合にアクセス トークンをサイレント モードで取得したりできます。 既定値は `false` です。<!-- -->. に設定されている場合 `false`<!-- -->、Officeアクセス トークンの取得をサイレント モードで試みる必要があります。 この操作に失敗した場合、Officeエラーが返されます。 に設定されている場合 `true`<!-- -->をOfficeアクセス トークンをサイレント モードで取得できない場合、対話型サインイン UI が表示されます。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'allowSignInPrompt?: boolean;'
    return:
      type: boolean
- name: asyncContext
  uid: office!Office.AuthOptions#asyncContext:member
  package: office!
  fullName: asyncContext
  summary: コールバックに渡されるオブジェクトのプロパティで、変更されずに返される任意の型のユーザー定義 `asyncContext` `AsyncResult` アイテム。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'asyncContext?: any;'
    return:
      type: any
- name: authChallenge
  uid: office!Office.AuthOptions#authChallenge:member
  package: office!
  fullName: authChallenge
  summary: Microsoft Officeを対象とするテナントが多要素認証を必要とする場合に、ユーザーに追加のGraphを求めるメッセージが表示されます。 文字列値は、必要な追加要因の種類を識別します。 ほとんどの場合、ユーザーのテナントに追加の要素が必要かどうか、または文字列が必要かどうかは開発時にはわかりません。 したがって、このオプションは、Microsoft Graph が追加要素を要求し、オプションで使用する文字列を含むエラーを送信した後の "2 回目の試み" 呼び出しで使用 `getAccessToken` `authChallenge` されます。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'authChallenge?: string;'
    return:
      type: string
- name: forceAddAccount
  uid: office!Office.AuthOptions#forceAddAccount:member
  package: office!
  fullName: forceAddAccount
  summary: >-
    ユーザーに自分のアカウントを追加Office (既に追加されている場合は、アカウントに切り替える) を求めるメッセージが表示されます。 既定値は `false` です。<!-- -->.


    **警告**: `forceAddAccount` 廃止されました。 代 `allowSignInPrompt` わりに使用します。
  remarks: ''
  isPreview: false
  isDeprecated: true
  customDeprecatedMessage: Use `allowSignInPrompt` instead.
  syntax:
    content: 'forceAddAccount?: boolean;'
    return:
      type: boolean
- name: forceConsent
  uid: office!Office.AuthOptions#forceConsent:member
  package: office!
  fullName: forceConsent
  summary: >-
    Office によりアドインの同意エクスペリエンスが表示されます。 アドインの Azure アクセス許可が変更された場合や、ユーザーの同意が取り消された場合に役立ちます。 既定値は `false` です。<!-- -->.


    **警告**: `forceConsent` 廃止されました。 代 `allowConsentPrompt` わりに使用します。
  remarks: ''
  isPreview: false
  isDeprecated: true
  customDeprecatedMessage: Use `allowConsentPrompt` instead.
  syntax:
    content: 'forceConsent?: boolean;'
    return:
      type: boolean
- name: forMSGraphAccess
  uid: office!Office.AuthOptions#forMSGraphAccess:member
  package: office!
  fullName: forMSGraphAccess
  summary: アドインOffice Microsoft Graph にアクセスする必要がある場合に、ユーザー/管理者がスコープに対する同意を与えGraphします。 既定値は `false` です。<!-- -->. Officeは、テナント管理者Graph展開されている場合にのみ、スコープに対する同意をサポートします。この情報は開発中は利用できません。 このオプションを設定すると、Officeアクセスが失敗した場合に、(説明的なエラーを返して) アドインに事前に通知Graph `true` 表示されます。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'forMSGraphAccess?: boolean;'
    return:
      type: boolean
