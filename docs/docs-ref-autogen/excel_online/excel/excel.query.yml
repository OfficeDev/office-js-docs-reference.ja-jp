name: Excel.Query
uid: excel!Excel.Query:class
package: excel!
fullName: Excel.Query
summary: Power Query クエリを表します。
remarks: '\[[API セット: ExcelApi 1.14](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: false
isDeprecated: false
type: class
properties:
- name: context
  uid: excel!Excel.Query#context:member
  package: excel!
  fullName: context
  summary: オブジェクトに関連付けられた要求コンテキスト。 これにより、アドインのプロセスがホスト アプリケーションのプロセスOfficeに接続されます。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'context: RequestContext;'
    return:
      type: <xref uid="excel!Excel.RequestContext:class" />
- name: error
  uid: excel!Excel.Query#error:member
  package: excel!
  fullName: error
  summary: クエリが最後に更新された場合のクエリ エラー メッセージを取得します。
  remarks: '\[[API セット: ExcelApi 1.14](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly error: Excel.QueryError | "Unknown" | "None" | "FailedLoadToWorksheet" | "FailedLoadToDataModel" | "FailedDownload" | "FailedToCompleteDownload";'
    return:
      type: <xref uid="excel!Excel.QueryError:enum" /> | "Unknown" | "None" | "FailedLoadToWorksheet" | "FailedLoadToDataModel" | "FailedDownload" | "FailedToCompleteDownload"
- name: loadedTo
  uid: excel!Excel.Query#loadedTo:member
  package: excel!
  fullName: loadedTo
  summary: オブジェクトの種類に読み込まれたクエリを取得します。
  remarks: '\[[API セット: ExcelApi 1.14](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly loadedTo: Excel.LoadToType | "ConnectionOnly" | "Table" | "PivotTable" | "PivotChart";'
    return:
      type: <xref uid="excel!Excel.LoadToType:enum" /> | "ConnectionOnly" | "Table" | "PivotTable" | "PivotChart"
- name: loadedToDataModel
  uid: excel!Excel.Query#loadedToDataModel:member
  package: excel!
  fullName: loadedToDataModel
  summary: データ モデルに読み込まれたクエリを指定します。
  remarks: '\[[API セット: ExcelApi 1.14](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly loadedToDataModel: boolean;'
    return:
      type: boolean
- name: name
  uid: excel!Excel.Query#name:member
  package: excel!
  fullName: name
  summary: クエリの名前を取得します。 クエリ名にピリオドや二重引用符を含めすることはできません。
  remarks: '\[[API セット: ExcelApi 1.14](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly name: string;'
    return:
      type: string
- name: refreshDate
  uid: excel!Excel.Query#refreshDate:member
  package: excel!
  fullName: refreshDate
  summary: クエリが最後に更新された日時を取得します。
  remarks: '\[[API セット: ExcelApi 1.14](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly refreshDate: Date;'
    return:
      type: Date
- name: rowsLoadedCount
  uid: excel!Excel.Query#rowsLoadedCount:member
  package: excel!
  fullName: rowsLoadedCount
  summary: クエリが最後に更新されたときに読み込まれた行の数を取得します。 最後の更新でエラーが発生した場合、値は -1 になります。
  remarks: '\[[API セット: ExcelApi 1.14](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly rowsLoadedCount: number;'
    return:
      type: number
methods:
- name: load(options)
  uid: excel!Excel.Query#load:member(1)
  package: excel!
  fullName: load(options)
  summary: オブジェクトの指定されたプロパティを読み込むコマンドを待ち行列に入れます。 プロパティを読み取る前に、`context.sync()` を呼び出す必要があります。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'load(options?: Excel.Interfaces.QueryLoadOptions): Excel.Query;'
    parameters:
    - id: options
      description: 読み込むオブジェクトのプロパティのオプションを提供します。
      type: <xref uid="excel!Excel.Interfaces.QueryLoadOptions:interface" />
    return:
      type: <xref uid="excel!Excel.Query:class" />
      description: ''
- name: load(propertyNames)
  uid: excel!Excel.Query#load:member(2)
  package: excel!
  fullName: load(propertyNames)
  summary: オブジェクトの指定されたプロパティを読み込むコマンドを待ち行列に入れます。 プロパティを読み取る前に、`context.sync()` を呼び出す必要があります。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'load(propertyNames?: string | string[]): Excel.Query;'
    parameters:
    - id: propertyNames
      description: 読み込むプロパティを指定するコンマ区切り文字列または文字列の配列。
      type: string | string[]
    return:
      type: <xref uid="excel!Excel.Query:class" />
      description: ''
- name: load(propertyNamesAndPaths)
  uid: excel!Excel.Query#load:member(3)
  package: excel!
  fullName: load(propertyNamesAndPaths)
  summary: オブジェクトの指定されたプロパティを読み込むコマンドを待ち行列に入れます。 プロパティを読み取る前に、`context.sync()` を呼び出す必要があります。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: >-
      load(propertyNamesAndPaths?: {
                  select?: string;
                  expand?: string;
              }): Excel.Query;
    parameters:
    - id: propertyNamesAndPaths
      description: '`propertyNamesAndPaths.select` は、読み込むプロパティを指定するコンマ区切りの文字列で、読み込むナビゲーション プロパティを指定するコンマ区切 `propertyNamesAndPaths.expand` りの文字列です。'
      type: >-
        {
                    select?: string;
                    expand?: string;
                }
    return:
      type: <xref uid="excel!Excel.Query:class" />
      description: ''
- name: toJSON()
  uid: excel!Excel.Query#toJSON:member(1)
  package: excel!
  fullName: toJSON()
  summary: API オブジェクトを渡す際に、より有用な出力を提供するために `toJSON()` JavaScript メソッドをオーバーライドします。 `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->、順番に、渡 `toJSON` されるオブジェクトのメソッドを呼び出します。一方、元のExcel。クエリ オブジェクトは API オブジェクトで、 `toJSON` メソッドはプレーンな JavaScript オブジェクト (次のように入力) を返します。`Excel.Interfaces.QueryData`<!-- -->) は、元のオブジェクトから読み込まれた子プロパティの浅いコピーを含む。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'toJSON(): Excel.Interfaces.QueryData;'
    return:
      type: <xref uid="excel!Excel.Interfaces.QueryData:interface" />
      description: ''
