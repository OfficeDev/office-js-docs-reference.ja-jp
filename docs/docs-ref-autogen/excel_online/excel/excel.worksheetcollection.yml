- name: add(name)
  uid: excel!Excel.WorksheetCollection#add:member(1)
  package: excel!
  fullName: add(name)
  summary: 新しいワークシートをブックに追加します。 ワークシートは、既存のワークシートの末尾に追加されます。 新しく追加したワークシートをアクティブ化する場合は、そのワークシートを呼び `.activate()` 出します。
  remarks: "\\[[API セット: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\nawait Excel.run(async (context) => { \n    var wSheetName = 'Sample Name';\n    var worksheet = context.workbook.worksheets.add(wSheetName);\n    worksheet.load('name');\n    await context.sync();\n    \n    console.log(worksheet.name);\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'add(name?: string): Excel.Worksheet;'
    parameters:
    - id: name
      description: 省略可能。 追加するワークシートの名前。 指定した場合、名前は一意である必要があります。 指定されていない場合は、Excel が新しいワークシートの名前を決定します。
      type: string
    return:
      type: <xref uid="excel!Excel.Worksheet:class" />
      description: ''
