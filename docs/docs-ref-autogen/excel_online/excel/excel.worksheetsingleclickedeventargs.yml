      type: number
- name: offsetY
  uid: excel!Excel.WorksheetSingleClickedEventArgs#offsetY:member
  package: excel!
  fullName: offsetY
  summary: 左クリック/タップされたポイントから、左クリック/タップされたセルの上側の目盛線までの距離を、ポイント単位で表します。
  remarks: '\[[API セット: ExcelApi 1.10](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
