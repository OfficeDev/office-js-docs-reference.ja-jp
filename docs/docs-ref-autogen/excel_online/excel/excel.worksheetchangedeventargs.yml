  isPreview: false
  isDeprecated: false
  syntax:
    content: 'address: string;'
    return:
      type: string
- name: changeDirectionState
  uid: excel!Excel.WorksheetChangedEventArgs#changeDirectionState:member
  package: excel!
  fullName: changeDirectionState
  summary: セルまたはセルを削除または挿入するときに、ワークシート内のセルが移動する方向への変更を表します。 これには、次の 2 つのシナリオが含まれます。 1. 新しいセルまたはセルをワークシートに挿入するときに、既存のセルが移動する方向 (下方向または右方向など)。 2. セルまたはセルがワークシートから削除された場合に残りのセルが移動する方向 (上または左など)。
  remarks: '\[[API セット: ExcelApi 1.14](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'changeDirectionState: Excel.ChangeDirectionState;'
    return:
      type: <xref uid="excel!Excel.ChangeDirectionState:interface" />
- name: changeType
  uid: excel!Excel.WorksheetChangedEventArgs#changeType:member
  package: excel!
  fullName: changeType
  summary: 変更されたイベントのトリガー方法を表す変更の種類を取得します。 詳細は「`Excel.DataChangeType`」をご覧ください。
  remarks: '\[[API セット: ExcelApi 1.7](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'changeType: Excel.DataChangeType | "Unknown" | "RangeEdited" | "RowInserted" | "RowDeleted" | "ColumnInserted" | "ColumnDeleted" | "CellInserted" | "CellDeleted";'
    return:
      type: <xref uid="excel!Excel.DataChangeType:enum" /> | "Unknown" | "RangeEdited" | "RowInserted" | "RowDeleted" | "ColumnInserted" | "ColumnDeleted" | "CellInserted" | "CellDeleted"
- name: details
  uid: excel!Excel.WorksheetChangedEventArgs#details:member
  package: excel!
  fullName: details
  summary: 変更の詳細に関する情報を表します。 このプロパティは、変更されたイベントが 1 つのセルでトリガーされた場合に取得できます。 変更されたイベントが複数のセルでトリガーされる場合、このプロパティを取得できません。
  remarks: >-
    \[[API セット: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```javascript

    // This function would be used as an event handler for the Worksheet.onChanged event.

    function onWorksheetChanged(eventArgs) {
        Excel.run(function (context) {
            var details = eventArgs.details;
            var address = eventArgs.address;

            // Print the before and after types and values to the console.
            console.log(`Change at ${address}: was ${details.valueBefore}(${details.valueTypeBefore}),`
                + ` now is ${details.valueAfter}(${details.valueTypeAfter})`);
            return context.sync();
        });
    }

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'details: Excel.ChangedEventDetail;'
    return:
      type: <xref uid="excel!Excel.ChangedEventDetail:interface" />
