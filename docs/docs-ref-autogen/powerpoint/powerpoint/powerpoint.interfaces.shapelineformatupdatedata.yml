name: PowerPoint.Interfaces.ShapeLineFormatUpdateData
uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatUpdateData:interface
package: powerpoint!
fullName: PowerPoint.Interfaces.ShapeLineFormatUpdateData
summary: ShapeLineFormat オブジェクト上のデータを更新するためのインターフェイスです。 `shapeLineFormat.set({ ... })`<!-- -->.
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: color
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatUpdateData#color:member
  package: powerpoint!
  fullName: color
  summary: 行の色を HTML \#カラー形式、RRGGBB 形式 ("FFA500" など) または名前付き HTML 色 ("オレンジ色" など) として表します。
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'color?: string;'
    return:
      type: string
- name: dashStyle
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatUpdateData#dashStyle:member
  package: powerpoint!
  fullName: dashStyle
  summary: 線のダッシュ スタイルを表します。 線が非表示の場合、または破線のスタイルが一定ではない場合は、null を返します。 詳細については、「PowerPoint」を参照してください。詳細については、ShapeLineDashStyle を参照してください。
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'dashStyle?: PowerPoint.ShapeLineDashStyle | "Dash" | "DashDot" | "DashDotDot" | "LongDash" | "LongDashDot" | "RoundDot" | "Solid" | "SquareDot" | "LongDashDotDot" | "SystemDash" | "SystemDot" | "SystemDashDot";'
    return:
      type: <xref uid="powerpoint!PowerPoint.ShapeLineDashStyle:enum" /> | "Dash" | "DashDot" | "DashDotDot" | "LongDash" | "LongDashDot" | "RoundDot" | "Solid" | "SquareDot" | "LongDashDotDot" | "SystemDash" | "SystemDot" | "SystemDashDot"
- name: style
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatUpdateData#style:member
  package: powerpoint!
  fullName: style
  summary: 図形の線スタイルを表します。 線が非表示の場合、またはスタイルが一定ではない場合は、null を返します。 詳細については、「PowerPoint」を参照してください。詳細については、ShapeLineStyle を使用します。
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'style?: PowerPoint.ShapeLineStyle | "Single" | "ThickBetweenThin" | "ThickThin" | "ThinThick" | "ThinThin";'
    return:
      type: <xref uid="powerpoint!PowerPoint.ShapeLineStyle:enum" /> | "Single" | "ThickBetweenThin" | "ThickThin" | "ThinThick" | "ThinThin"
- name: transparency
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatUpdateData#transparency:member
  package: powerpoint!
  fullName: transparency
  summary: 行の透明度のパーセンテージを 0.0 (不透明) から 1.0 (クリア) の値として指定します。 図形の透明度が一定ではない場合は、null を返します。
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'transparency?: number;'
    return:
      type: number
- name: visible
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatUpdateData#visible:member
  package: powerpoint!
  fullName: visible
  summary: 図形要素の線の書式設定が表示される場合に指定します。 図形の表示 `null` が一貫性のない場合に返します。
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'visible?: boolean;'
    return:
      type: boolean
- name: weight
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatUpdateData#weight:member
  package: powerpoint!
  fullName: weight
  summary: 線の太さ (ポイント数) を表します。 線が `null` 表示されない場合、または線の太さがない場合に返します。
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'weight?: number;'
    return:
      type: number
