- name: addTextBox(text, options)
  uid: powerpoint!PowerPoint.ShapeCollection#addTextBox:member(1)
  package: powerpoint!
  fullName: addTextBox(text, options)
  summary: 指定したテキストをコンテンツとしてスライドにテキスト ボックスを追加します。 新しいテキスト `Shape` ボックスを表すオブジェクトを返します。
  remarks: "\\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\n// Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/powerpoint/preview-apis/shapes.yaml\nawait PowerPoint.run(async (context) => {\n  var shapes = context.presentation.slides.getItemAt(0).shapes;\n  var textbox = shapes.addTextBox(\"Hello!\", \n      { \n        left: 100, \n        top: 300, \n        height: 300, \n        width: 450 \n      });\n  textbox.name = \"Textbox\";\n\n  return context.sync();\n});\n```"
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'addTextBox(text: string, options?: PowerPoint.ShapeAddOptions): PowerPoint.Shape;'
    parameters:
    - id: text
      description: 作成したテキスト ボックスに表示されるテキストを指定します。
      type: string
    - id: options
      description: テキスト ボックスの位置などの追加オプションを指定するオプションのパラメーター。
      type: <xref uid="powerpoint!PowerPoint.ShapeAddOptions:interface" />
    return:
      type: <xref uid="powerpoint!PowerPoint.Shape:class" />
      description: 新しく挿入された図形。
