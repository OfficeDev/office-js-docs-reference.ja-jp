- name: addGeometricShape(geometricShapeType, options)
  uid: powerpoint!PowerPoint.ShapeCollection#addGeometricShape:member(1)
  package: powerpoint!
  fullName: addGeometricShape(geometricShapeType, options)
  summary: スライドに幾何学的な図形を追加します。 新しい図形 `Shape` を表すオブジェクトを返します。
  remarks: "\\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\n// Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/powerpoint/preview-apis/shapes.yaml\nawait PowerPoint.run(async (context) => {\n  var shapes = context.presentation.slides.getItemAt(0).shapes;\n  var hexagon = shapes.addGeometricShape(PowerPoint.GeometricShapeType.hexagon, \n      {\n        left: 100,\n        top: 100,\n        height: 150,\n        width: 150\n      });\n  hexagon.name = \"Hexagon\";\n\n  await context.sync();\n});\n```"
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'addGeometricShape(geometricShapeType: PowerPoint.GeometricShapeType, options?: PowerPoint.ShapeAddOptions): PowerPoint.Shape;'
    parameters:
    - id: geometricShapeType
      description: 幾何学的図形の種類を指定します。 [「PowerPoint」を参照してください。詳細については、GeometricShapeType。](xref:powerpoint!PowerPoint.GeometricShapeType:enum)
      type: <xref uid="powerpoint!PowerPoint.GeometricShapeType:enum" />
    - id: options
      description: 図形の位置などの追加オプションを指定するオプションのパラメーター。
      type: <xref uid="powerpoint!PowerPoint.ShapeAddOptions:interface" />
    return:
      type: <xref uid="powerpoint!PowerPoint.Shape:class" />
      description: 新しく挿入された図形。
