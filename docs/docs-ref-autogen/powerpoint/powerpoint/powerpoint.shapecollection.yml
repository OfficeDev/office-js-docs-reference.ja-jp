- name: addLine(connectorType, options)
  uid: powerpoint!PowerPoint.ShapeCollection#addLine:member(1)
  package: powerpoint!
  fullName: addLine(connectorType, options)
  summary: スライドに線を追加します。 新しい行 `Shape` を表すオブジェクトを返します。
  remarks: "\\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\n// Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/powerpoint/preview-apis/shapes.yaml\nawait PowerPoint.run(async (context) => {\n  var shapes = context.presentation.slides.getItemAt(0).shapes;\n\n  // For a line, left and top are the coordinates of the start point,\n  // while height and width are the coordinates of the end point.\n  var line = shapes.addLine(PowerPoint.ConnectorType.straight, \n      { \n        left: 400, \n        top: 200, \n        height: 20, \n        width: 150 \n      });\n  line.name = \"StraightLine\";\n\n  await context.sync();\n});\n```"
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'addLine(connectorType?: PowerPoint.ConnectorType, options?: PowerPoint.ShapeAddOptions): PowerPoint.Shape;'
    parameters:
    - id: connectorType
      description: 線のコネクタの種類を指定します。 指定しない場合は、 `straight` コネクタの種類が使用されます。 [「PowerPoint」を参照してください。ConnectorType 詳細については、「ConnectorType」](xref:powerpoint!PowerPoint.ConnectorType:enum)を参照してください。
      type: <xref uid="powerpoint!PowerPoint.ConnectorType:enum" />
    - id: options
      description: 線を含む図形オブジェクトの位置などの追加オプションを指定するオプションのパラメーターです。
      type: <xref uid="powerpoint!PowerPoint.ShapeAddOptions:interface" />
    return:
      type: <xref uid="powerpoint!PowerPoint.Shape:class" />
      description: 新しく挿入された図形。
