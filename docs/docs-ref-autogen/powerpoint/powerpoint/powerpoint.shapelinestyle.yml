name: PowerPoint.ShapeLineStyle
uid: powerpoint!PowerPoint.ShapeLineStyle:enum
package: powerpoint!
fullName: PowerPoint.ShapeLineStyle
summary: >-
  線のスタイルを指定します。


  \[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
remarks: ''
isPreview: true
isDeprecated: false
fields:
- name: single
  uid: powerpoint!PowerPoint.ShapeLineStyle.single:member
  package: powerpoint!
  summary: 一重線を指定します。
  value: "\"Single\""
- name: thickBetweenThin
  uid: powerpoint!PowerPoint.ShapeLineStyle.thickBetweenThin:member
  package: powerpoint!
  summary: 両側を細い線にはさまれた太い線。
  value: "\"ThickBetweenThin\""
- name: thickThin
  uid: powerpoint!PowerPoint.ShapeLineStyle.thickThin:member
  package: powerpoint!
  summary: 細い線の横に太い線。 水平線の場合、太い線は細線の上になります。 垂直線の場合、太い線は細線の左側になります。
  value: "\"ThickThin\""
- name: thinThick
  uid: powerpoint!PowerPoint.ShapeLineStyle.thinThick:member
  package: powerpoint!
  summary: 細い線の横に太い線。 水平線の場合、太線は細線の下になります。 垂直線の場合、太い線は細線の右側になります。
  value: "\"ThinThick\""
- name: thinThin
  uid: powerpoint!PowerPoint.ShapeLineStyle.thinThin:member
  package: powerpoint!
  summary: 2 本の細い線。
  value: "\"ThinThin\""
