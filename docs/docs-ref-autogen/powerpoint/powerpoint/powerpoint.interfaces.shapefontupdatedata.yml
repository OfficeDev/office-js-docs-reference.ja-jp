### YamlMime:TSType
name: PowerPoint.Interfaces.ShapeFontUpdateData
uid: powerpoint!PowerPoint.Interfaces.ShapeFontUpdateData:interface
package: powerpoint!
fullName: PowerPoint.Interfaces.ShapeFontUpdateData
summary: ShapeFont オブジェクトのデータを更新するためのインターフェイスです。 `shapeFont.set({ ... })`<!-- -->.
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: bold
  uid: powerpoint!PowerPoint.Interfaces.ShapeFontUpdateData#bold:member
  package: powerpoint!
  fullName: bold
  summary: >-
    フォントの太字の状態を表します。 太字と `null` 太字以外 `TextRange` のテキスト フラグメントの両方が含まれる場合に返します。


    \[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'bold?: boolean;'
    return:
      type: boolean
- name: color
  uid: powerpoint!PowerPoint.Interfaces.ShapeFontUpdateData#color:member
  package: powerpoint!
  fullName: color
  summary: >-
    テキストの色の HTML カラー コード表現 (例: \# "FF0000" は赤を表します)。 色が `null` 異なるテキスト `TextRange` フラグメントが含まれる場合に返します。


    \[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'color?: string;'
    return:
      type: string
- name: italic
  uid: powerpoint!PowerPoint.Interfaces.ShapeFontUpdateData#italic:member
  package: powerpoint!
  fullName: italic
  summary: >-
    フォントの斜体の状態を表します。 'TextRange' に、italic テキスト フラグメントと非 italic テキスト フラグメントの両方が含まれる場合は、'null' を返します。


    \[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'italic?: boolean;'
    return:
      type: boolean
- name: name
  uid: powerpoint!PowerPoint.Interfaces.ShapeFontUpdateData#name:member
  package: powerpoint!
  fullName: name
  summary: >-
    フォント名 ("Calibri" など) を表します。 テキストが複合スクリプトまたは東アジア言語の場合、これは対応するフォント名です。それ以外の場合は、ラテン文字のフォント名です。


    \[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'name?: string;'
    return:
      type: string
- name: size
  uid: powerpoint!PowerPoint.Interfaces.ShapeFontUpdateData#size:member
  package: powerpoint!
  fullName: size
  summary: >-
    フォント サイズをポイント (11 など) で表します。 TextRange にサイズの異なるテキストが含まれている場合、null を返します。


    \[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'size?: number;'
    return:
      type: number
- name: underline
  uid: powerpoint!PowerPoint.Interfaces.ShapeFontUpdateData#underline:member
  package: powerpoint!
  fullName: underline
  summary: >-
    フォントに適用する下線の種類。 異なる `null` 下線スタイルの `TextRange` テキスト フラグメントが含まれる場合に返します。 [「PowerPoint」を参照してください。詳細については、ShapeFontUnderlineStyle](xref:powerpoint!PowerPoint.ShapeFontUnderlineStyle:enum)を参照してください。


    \[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'underline?: PowerPoint.ShapeFontUnderlineStyle | "None" | "Single" | "Double" | "Heavy" | "Dotted" | "DottedHeavy" | "Dash" | "DashHeavy" | "DashLong" | "DashLongHeavy" | "DotDash" | "DotDashHeavy" | "DotDotDash" | "DotDotDashHeavy" | "Wavy" | "WavyHeavy" | "WavyDouble";'
    return:
      type: <xref uid="powerpoint!PowerPoint.ShapeFontUnderlineStyle:enum" /> | "None" | "Single" | "Double" | "Heavy" | "Dotted" | "DottedHeavy" | "Dash" | "DashHeavy" | "DashLong" | "DashLongHeavy" | "DotDash" | "DotDashHeavy" | "DotDotDash" | "DotDotDashHeavy" | "Wavy" | "WavyHeavy" | "WavyDouble"
