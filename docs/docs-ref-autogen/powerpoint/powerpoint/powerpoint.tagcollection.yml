methods:
- name: add(key, value)
  uid: powerpoint!PowerPoint.TagCollection#add:member(1)
  package: powerpoint!
  fullName: add(key, value)
  summary: コレクションの末尾に新しいタグを追加します。 コレクションに `key` 既に存在する場合は、既存のタグの値が指定のタグに置き換えられる `value`<!-- -->.
  remarks: >-
    \[[API セット: PowerPointApi 1.3](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/powerpoint/tags/tags.yaml

    await PowerPoint.run(async function(context) {
      const slide = context.presentation.slides.getItemAt(0);
      slide.tags.add("OCEAN", "Indian");
      slide.tags.add("PLANET", "Jupiter");
      slide.tags.add("CONTINENT", "Antarctica");

      await context.sync();

      slide.tags.load("key, value");

      await context.sync();

      for (let i = 0; i < slide.tags.items.length; i++) {
        console.log("Added key " + JSON.stringify(slide.tags.items[i].key) + " with value " +        JSON.stringify(slide.tags.items[i].value));
      }
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'add(key: string, value: string): void;'
    parameters:
    - id: key
      description: タグの一意の ID は、このタグ内で一意です。 `TagCollection`<!-- -->. 'key' パラメーターは大文字と小文字を区別しませんが、ドキュメントに保存すると常に大文字にされます。
      type: string
    - id: value
      description: タグの値を指定します。
      type: string
    return:
      type: void
      description: ''
- name: delete(key)
  uid: powerpoint!PowerPoint.TagCollection#delete:member(1)
  package: powerpoint!
  fullName: delete(key)
  summary: このコレクション内の指定されたタグ `key` を削除します。 存在しない場合は `key` 何もしません。
  remarks: >-
    \[[API セット: PowerPointApi 1.3](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/powerpoint/tags/tags.yaml

    await PowerPoint.run(async function (context) {
      let presentationTags = context.presentation.tags;

      presentationTags.delete("COLOR");

      await context.sync();

      console.log(JSON.stringify(presentationTags));
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'delete(key: string): void;'
    parameters:
    - id: key
      description: タグの一意の ID は、このタグ内で一意です。 `TagCollection`<!-- -->. `key` パラメーターは大文字と小文字を区別しません。
      type: string
    return:
      type: void
      description: ''
