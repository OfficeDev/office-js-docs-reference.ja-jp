name: PowerPoint.ShapeFill
uid: powerpoint!PowerPoint.ShapeFill:class
package: powerpoint!
fullName: PowerPoint.ShapeFill
summary: 図形オブジェクトの塗りつぶしの書式設定を表します。
remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
type: class
properties:
- name: context
  uid: powerpoint!PowerPoint.ShapeFill#context:member
  package: powerpoint!
  fullName: context
  summary: オブジェクトに関連付けられた要求コンテキスト。 これにより、アドインのプロセスがホスト アプリケーションのプロセスOfficeに接続されます。
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'context: RequestContext;'
    return:
      type: <xref uid="powerpoint!PowerPoint.RequestContext:class" />
- name: foregroundColor
  uid: powerpoint!PowerPoint.ShapeFill#foregroundColor:member
  package: powerpoint!
  fullName: foregroundColor
  summary: 図形塗りつぶし前景色を HTML カラー形式 \# 、RRGGBB 形式 ("FFA500" など) で表します。または名前付き HTML 色 ("オレンジ色" など) として表します。
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'foregroundColor: string;'
    return:
      type: string
- name: transparency
  uid: powerpoint!PowerPoint.ShapeFill#transparency:member
  package: powerpoint!
  fullName: transparency
  summary: 塗りつぶしの透明度の割合を 0.0 (不透明) から 1.0 (クリア) の値として指定します。 図形の種類が透明度をサポートしていない場合、またはグラデーション塗りつぶしの種類など、図形の塗りつぶしの透明度が矛盾している `null` 場合に返します。
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'transparency: number;'
    return:
      type: number
- name: type
  uid: powerpoint!PowerPoint.ShapeFill#type:member
  package: powerpoint!
  fullName: type
  summary: 図形の塗りつぶしの種類を返します。 [「PowerPoint」を参照してください。詳細については、ShapeFillType](xref:powerpoint!PowerPoint.ShapeFillType:enum)を指定します。
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'readonly type: PowerPoint.ShapeFillType | "NoFill" | "Solid" | "Gradient" | "Pattern" | "PictureAndTexture" | "SlideBackground";'
    return:
      type: <xref uid="powerpoint!PowerPoint.ShapeFillType:enum" /> | "NoFill" | "Solid" | "Gradient" | "Pattern" | "PictureAndTexture" | "SlideBackground"
