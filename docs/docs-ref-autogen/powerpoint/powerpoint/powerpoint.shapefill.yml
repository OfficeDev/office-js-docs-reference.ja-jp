- name: setSolidColor(color)
  uid: powerpoint!PowerPoint.ShapeFill#setSolidColor:member(1)
  package: powerpoint!
  fullName: setSolidColor(color)
  summary: 図形の塗りつぶしの書式設定を均一な色に設定します。 これにより、塗りつぶしの種類が次の値に変更されます。 `Solid`<!-- -->.
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'setSolidColor(color: string): void;'
    parameters:
    - id: color
      description: '\#RRGGBB 形式 ("FFA500" など) または名前付き HTML 色 ("オレンジ色" など) で塗りつぶしの色を指定する文字列。'
      type: string
    return:
      type: void
      description: ''
- name: toJSON()
  uid: powerpoint!PowerPoint.ShapeFill#toJSON:member(1)
  package: powerpoint!
  fullName: toJSON()
  summary: API オブジェクトを渡す際に、より有用な出力を提供するために `toJSON()` JavaScript メソッドをオーバーライドします。 `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->、順番に、渡 `toJSON` されるオブジェクトのメソッドを呼び出します。一方、元のPowerPoint。ShapeFill オブジェクトは API オブジェクトで、メソッドはプレーンな JavaScript オブジェクト (次のように入力) `toJSON` を返します。`PowerPoint.Interfaces.ShapeFillData`<!-- -->) は、元のオブジェクトから読み込まれた子プロパティの浅いコピーを含む。
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
