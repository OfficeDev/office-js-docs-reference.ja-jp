### YamlMime:TSType
name: PowerPoint.Interfaces.ShapeLineFormatLoadOptions
uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatLoadOptions:interface
package: powerpoint!
fullName: PowerPoint.Interfaces.ShapeLineFormatLoadOptions
summary: 図形オブジェクトの線の書式設定を表します。 画像と幾何学的図形の場合、線の書式設定は図形の境界線を表します。
remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
type: interface
properties:
- name: $all
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatLoadOptions#$all:member
  package: powerpoint!
  fullName: $all
  summary: '`$all`LoadOptions を指定すると、すべてのスカラー プロパティが読み込まれます (例:`Range.address`<!-- -->) ではなく、ナビゲーション プロパティ (例: `Range.format.fill.color`<!-- -->).'
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: '$all?: boolean;'
    return:
      type: boolean
- name: color
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatLoadOptions#color:member
  package: powerpoint!
  fullName: color
  summary: 行の色を HTML カラー形式 \# 、RRGGBB 形式 ("FFA500" など) または名前付き HTML 色 ("オレンジ色" など) として表します。
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'color?: boolean;'
    return:
      type: boolean
- name: dashStyle
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatLoadOptions#dashStyle:member
  package: powerpoint!
  fullName: dashStyle
  summary: 線のダッシュ スタイルを表します。 線が非表示の場合、または破線のスタイルが一定ではない場合は、null を返します。 詳細については、「PowerPoint」を参照してください。詳細については、ShapeLineDashStyle を参照してください。
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'dashStyle?: boolean;'
    return:
      type: boolean
- name: style
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatLoadOptions#style:member
  package: powerpoint!
  fullName: style
  summary: 図形の線スタイルを表します。 線が非表示の場合、またはスタイルが一定ではない場合は、null を返します。 詳細については、「PowerPoint」を参照してください。詳細については、ShapeLineStyle を使用します。
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'style?: boolean;'
    return:
      type: boolean
- name: transparency
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatLoadOptions#transparency:member
  package: powerpoint!
  fullName: transparency
  summary: 行の透明度のパーセンテージを 0.0 (不透明) から 1.0 (クリア) の値として指定します。 図形の透明度が一定ではない場合は、null を返します。
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'transparency?: boolean;'
    return:
      type: boolean
- name: visible
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatLoadOptions#visible:member
  package: powerpoint!
  fullName: visible
  summary: 図形要素の線の書式設定が表示される場合に指定します。 図形の `null` 表示が一貫性のない場合に返します。
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'visible?: boolean;'
    return:
      type: boolean
- name: weight
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatLoadOptions#weight:member
  package: powerpoint!
  fullName: weight
  summary: 線の太さ (ポイント数) を表します。 線が `null` 表示されない場合、または線の太さがない場合に返します。
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'weight?: boolean;'
    return:
      type: boolean
