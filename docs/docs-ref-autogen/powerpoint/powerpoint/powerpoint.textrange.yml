name: PowerPoint.TextRange
uid: powerpoint!PowerPoint.TextRange:class
package: powerpoint!
fullName: PowerPoint.TextRange
summary: 図形に結合するテキストや、テキストを操作するためのプロパティおよびメソッドが含まれます。
remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
type: class
properties:
- name: context
  uid: powerpoint!PowerPoint.TextRange#context:member
  package: powerpoint!
  fullName: context
  summary: オブジェクトに関連付けられた要求コンテキスト。 これにより、アドインのプロセスがホスト アプリケーションのプロセスOfficeに接続されます。
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'context: RequestContext;'
    return:
      type: <xref uid="powerpoint!PowerPoint.RequestContext:class" />
- name: font
  uid: powerpoint!PowerPoint.TextRange#font:member
  package: powerpoint!
  fullName: font
  summary: テキスト範囲の `ShapeFont` フォント属性を表すオブジェクトを返します。
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'readonly font: PowerPoint.ShapeFont;'
    return:
      type: <xref uid="powerpoint!PowerPoint.ShapeFont:class" />
- name: paragraphFormat
  uid: powerpoint!PowerPoint.TextRange#paragraphFormat:member
  package: powerpoint!
  fullName: paragraphFormat
  summary: テキスト範囲の段落形式を表します。 [「PowerPoint」を参照してください。ParagraphFormat](xref:powerpoint!PowerPoint.ParagraphFormat:class)詳細については、次の情報を参照してください。
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'readonly paragraphFormat: PowerPoint.ParagraphFormat;'
    return:
      type: <xref uid="powerpoint!PowerPoint.ParagraphFormat:class" />
- name: text
  uid: powerpoint!PowerPoint.TextRange#text:member
  package: powerpoint!
  fullName: text
  summary: テキスト範囲のプレーン テキスト コンテンツを表します。
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'text: string;'
    return:
      type: string
methods:
- name: getSubstring(start, length)
  uid: powerpoint!PowerPoint.TextRange#getSubstring:member(1)
  package: powerpoint!
  fullName: getSubstring(start, length)
  summary: 指定した範囲 `TextRange` の部分文字列のオブジェクトを返します。
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'getSubstring(start: number, length?: number): PowerPoint.TextRange;'
    parameters:
    - id: start
      description: テキスト範囲から取得する最初の文字の 0 から始るインデックス。
      type: number
    - id: length
      description: 省略可能。 新しいテキスト範囲で返される文字数。 length を省略すると、テキスト範囲の最後の段落の最初から最後までのすべての文字が返されます。
      type: number
    return:
      type: <xref uid="powerpoint!PowerPoint.TextRange:class" />
      description: ''
- name: load(options)
  uid: powerpoint!PowerPoint.TextRange#load:member(1)
  package: powerpoint!
  fullName: load(options)
  summary: オブジェクトの指定されたプロパティを読み込むコマンドを待ち行列に入れます。 プロパティを読み取る前に、`context.sync()` を呼び出す必要があります。
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'load(options?: PowerPoint.Interfaces.TextRangeLoadOptions): PowerPoint.TextRange;'
    parameters:
    - id: options
      description: 読み込むオブジェクトのプロパティのオプションを提供します。
      type: <xref uid="powerpoint!PowerPoint.Interfaces.TextRangeLoadOptions:interface" />
    return:
      type: <xref uid="powerpoint!PowerPoint.TextRange:class" />
      description: ''
- name: load(propertyNames)
  uid: powerpoint!PowerPoint.TextRange#load:member(2)
  package: powerpoint!
  fullName: load(propertyNames)
  summary: オブジェクトの指定されたプロパティを読み込むコマンドを待ち行列に入れます。 プロパティを読み取る前に、`context.sync()` を呼び出す必要があります。
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'load(propertyNames?: string | string[]): PowerPoint.TextRange;'
    parameters:
    - id: propertyNames
      description: 読み込むプロパティを指定するコンマ区切り文字列または文字列の配列。
      type: string | string[]
    return:
      type: <xref uid="powerpoint!PowerPoint.TextRange:class" />
      description: ''
- name: load(propertyNamesAndPaths)
  uid: powerpoint!PowerPoint.TextRange#load:member(3)
  package: powerpoint!
  fullName: load(propertyNamesAndPaths)
  summary: オブジェクトの指定されたプロパティを読み込むコマンドを待ち行列に入れます。 プロパティを読み取る前に、`context.sync()` を呼び出す必要があります。
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: >-
      load(propertyNamesAndPaths?: {
                  select?: string;
                  expand?: string;
              }): PowerPoint.TextRange;
    parameters:
    - id: propertyNamesAndPaths
      description: '`propertyNamesAndPaths.select` は、読み込むプロパティを指定するコンマ区切りの文字列で、読み込むナビゲーション プロパティを指定するコンマ区切 `propertyNamesAndPaths.expand` りの文字列です。'
      type: >-
        {
                    select?: string;
                    expand?: string;
                }
    return:
      type: <xref uid="powerpoint!PowerPoint.TextRange:class" />
      description: ''
- name: toJSON()
  uid: powerpoint!PowerPoint.TextRange#toJSON:member(1)
  package: powerpoint!
  fullName: toJSON()
  summary: API オブジェクトを渡す際に、より有用な出力を提供するために `toJSON()` JavaScript メソッドをオーバーライドします。 `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->、順番に、渡 `toJSON` されるオブジェクトのメソッドを呼び出します。一方、元のPowerPoint。TextRange オブジェクトは API オブジェクトで、 `toJSON` メソッドはプレーンな JavaScript オブジェクト (次のように入力) を返します。`PowerPoint.Interfaces.TextRangeData`<!-- -->) は、元のオブジェクトから読み込まれた子プロパティの浅いコピーを含む。
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'toJSON(): PowerPoint.Interfaces.TextRangeData;'
    return:
      type: <xref uid="powerpoint!PowerPoint.Interfaces.TextRangeData:interface" />
      description: ''
