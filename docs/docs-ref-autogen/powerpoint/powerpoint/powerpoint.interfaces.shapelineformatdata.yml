properties:
- name: color
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatData#color:member
  package: powerpoint!
  fullName: color
  summary: >-
    行の色を HTML カラー形式 \# 、RRGGBB 形式 ("FFA500" など) または名前付き HTML 色 ("オレンジ色" など) として表します。


    \[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
