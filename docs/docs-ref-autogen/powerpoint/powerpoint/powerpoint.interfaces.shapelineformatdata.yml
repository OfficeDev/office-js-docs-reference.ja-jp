    content: 'color?: string;'
    return:
      type: string
- name: dashStyle
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatData#dashStyle:member
  package: powerpoint!
  fullName: dashStyle
  summary: >-
    線のダッシュ スタイルを表します。 線が非表示の場合、または破線のスタイルが一定ではない場合は、null を返します。 詳細については、「PowerPoint」を参照してください。詳細については、ShapeLineDashStyle を参照してください。


    \[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'dashStyle?: PowerPoint.ShapeLineDashStyle | "Dash" | "DashDot" | "DashDotDot" | "LongDash" | "LongDashDot" | "RoundDot" | "Solid" | "SquareDot" | "LongDashDotDot" | "SystemDash" | "SystemDot" | "SystemDashDot";'
    return:
      type: <xref uid="powerpoint!PowerPoint.ShapeLineDashStyle:enum" /> | "Dash" | "DashDot" | "DashDotDot" | "LongDash" | "LongDashDot" | "RoundDot" | "Solid" | "SquareDot" | "LongDashDotDot" | "SystemDash" | "SystemDot" | "SystemDashDot"
- name: style
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatData#style:member
  package: powerpoint!
  fullName: style
  summary: >-
    図形の線スタイルを表します。 線が非表示の場合、またはスタイルが一定ではない場合は、null を返します。 詳細については、「PowerPoint」を参照してください。詳細については、ShapeLineStyle を使用します。


    \[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'style?: PowerPoint.ShapeLineStyle | "Single" | "ThickBetweenThin" | "ThickThin" | "ThinThick" | "ThinThin";'
    return:
      type: <xref uid="powerpoint!PowerPoint.ShapeLineStyle:enum" /> | "Single" | "ThickBetweenThin" | "ThickThin" | "ThinThick" | "ThinThin"
- name: transparency
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatData#transparency:member
  package: powerpoint!
  fullName: transparency
  summary: >-
    行の透明度のパーセンテージを 0.0 (不透明) から 1.0 (クリア) の値として指定します。 図形の透明度が一定ではない場合は、null を返します。


    \[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'transparency?: number;'
    return:
      type: number
- name: visible
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatData#visible:member
  package: powerpoint!
  fullName: visible
  summary: >-
    図形要素の線の書式設定が表示される場合に指定します。 図形の `null` 表示が一貫性のない場合に返します。


    \[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'visible?: boolean;'
    return:
      type: boolean
- name: weight
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatData#weight:member
  package: powerpoint!
  fullName: weight
  summary: >-
    線の太さ (ポイント数) を表します。 線が `null` 表示されない場合、または線の太さがない場合に返します。


    \[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
