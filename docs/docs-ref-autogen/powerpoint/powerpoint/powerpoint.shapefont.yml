### YamlMime:TSType
name: PowerPoint.ShapeFont
uid: powerpoint!PowerPoint.ShapeFont:class
package: powerpoint!
fullName: PowerPoint.ShapeFont
summary: 図形の TextRange オブジェクトのフォント名、フォント サイズ、色などのフォント属性を表します。
remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
type: class
properties:
- name: bold
  uid: powerpoint!PowerPoint.ShapeFont#bold:member
  package: powerpoint!
  fullName: bold
  summary: フォントの太字の状態を表します。 太字と `null` 太字以外 `TextRange` のテキスト フラグメントの両方が含まれる場合に返します。
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'bold: boolean;'
    return:
      type: boolean
- name: color
  uid: powerpoint!PowerPoint.ShapeFont#color:member
  package: powerpoint!
  fullName: color
  summary: 'テキストの色の HTML カラー コード表現 (例: \# "FF0000" は赤を表します)。 色が `null` 異なるテキスト `TextRange` フラグメントが含まれる場合に返します。'
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'color: string;'
    return:
      type: string
- name: context
  uid: powerpoint!PowerPoint.ShapeFont#context:member
  package: powerpoint!
  fullName: context
  summary: オブジェクトに関連付けられた要求コンテキスト。 これにより、アドインのプロセスがホスト アプリケーションのプロセスOfficeに接続されます。
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'context: RequestContext;'
    return:
      type: <xref uid="powerpoint!PowerPoint.RequestContext:class" />
- name: italic
  uid: powerpoint!PowerPoint.ShapeFont#italic:member
  package: powerpoint!
  fullName: italic
  summary: フォントの斜体の状態を表します。 'TextRange' に、italic テキスト フラグメントと非 italic テキスト フラグメントの両方が含まれる場合は、'null' を返します。
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'italic: boolean;'
    return:
      type: boolean
- name: name
  uid: powerpoint!PowerPoint.ShapeFont#name:member
  package: powerpoint!
  fullName: name
  summary: フォント名 ("Calibri" など) を表します。 テキストが複合スクリプトまたは東アジア言語の場合、これは対応するフォント名です。それ以外の場合は、ラテン文字のフォント名です。
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'name: string;'
    return:
      type: string
- name: size
  uid: powerpoint!PowerPoint.ShapeFont#size:member
  package: powerpoint!
  fullName: size
  summary: フォント サイズをポイント (11 など) で表します。 TextRange にサイズの異なるテキストが含まれている場合、null を返します。
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'size: number;'
    return:
      type: number
- name: underline
  uid: powerpoint!PowerPoint.ShapeFont#underline:member
  package: powerpoint!
  fullName: underline
  summary: フォントに適用する下線の種類。 異なる `null` 下線スタイルの `TextRange` テキスト フラグメントが含まれる場合に返します。 [「PowerPoint」を参照してください。詳細については、ShapeFontUnderlineStyle](xref:powerpoint!PowerPoint.ShapeFontUnderlineStyle:enum)を参照してください。
  remarks: '\[[API セット: PowerPointApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'underline: PowerPoint.ShapeFontUnderlineStyle | "None" | "Single" | "Double" | "Heavy" | "Dotted" | "DottedHeavy" | "Dash" | "DashHeavy" | "DashLong" | "DashLongHeavy" | "DotDash" | "DotDashHeavy" | "DotDotDash" | "DotDotDashHeavy" | "Wavy" | "WavyHeavy" | "WavyDouble";'
    return:
      type: <xref uid="powerpoint!PowerPoint.ShapeFontUnderlineStyle:enum" /> | "None" | "Single" | "Double" | "Heavy" | "Dotted" | "DottedHeavy" | "Dash" | "DashHeavy" | "DashLong" | "DashLongHeavy" | "DotDash" | "DotDashHeavy" | "DotDotDash" | "DotDotDashHeavy" | "Wavy" | "WavyHeavy" | "WavyDouble"
methods:
- name: load(options)
  uid: powerpoint!PowerPoint.ShapeFont#load:member(1)
  package: powerpoint!
  fullName: load(options)
  summary: オブジェクトの指定されたプロパティを読み込むコマンドを待ち行列に入れます。 プロパティを読み取る前に、`context.sync()` を呼び出す必要があります。
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'load(options?: PowerPoint.Interfaces.ShapeFontLoadOptions): PowerPoint.ShapeFont;'
    parameters:
    - id: options
      description: 読み込むオブジェクトのプロパティのオプションを提供します。
      type: <xref uid="powerpoint!PowerPoint.Interfaces.ShapeFontLoadOptions:interface" />
    return:
      type: <xref uid="powerpoint!PowerPoint.ShapeFont:class" />
      description: ''
- name: load(propertyNames)
  uid: powerpoint!PowerPoint.ShapeFont#load:member(2)
  package: powerpoint!
  fullName: load(propertyNames)
  summary: オブジェクトの指定されたプロパティを読み込むコマンドを待ち行列に入れます。 プロパティを読み取る前に、`context.sync()` を呼び出す必要があります。
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'load(propertyNames?: string | string[]): PowerPoint.ShapeFont;'
    parameters:
    - id: propertyNames
      description: 読み込むプロパティを指定するコンマ区切り文字列または文字列の配列。
      type: string | string[]
    return:
      type: <xref uid="powerpoint!PowerPoint.ShapeFont:class" />
      description: ''
- name: load(propertyNamesAndPaths)
  uid: powerpoint!PowerPoint.ShapeFont#load:member(3)
  package: powerpoint!
  fullName: load(propertyNamesAndPaths)
  summary: オブジェクトの指定されたプロパティを読み込むコマンドを待ち行列に入れます。 プロパティを読み取る前に、`context.sync()` を呼び出す必要があります。
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: >-
      load(propertyNamesAndPaths?: {
                  select?: string;
                  expand?: string;
              }): PowerPoint.ShapeFont;
    parameters:
    - id: propertyNamesAndPaths
      description: '`propertyNamesAndPaths.select` は、読み込むプロパティを指定するコンマ区切りの文字列で、読み込むナビゲーション プロパティを指定するコンマ区切 `propertyNamesAndPaths.expand` りの文字列です。'
      type: >-
        {
                    select?: string;
                    expand?: string;
                }
    return:
      type: <xref uid="powerpoint!PowerPoint.ShapeFont:class" />
      description: ''
- name: toJSON()
  uid: powerpoint!PowerPoint.ShapeFont#toJSON:member(1)
  package: powerpoint!
  fullName: toJSON()
  summary: API オブジェクトを渡す際に、より有用な出力を提供するために `toJSON()` JavaScript メソッドをオーバーライドします。 `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->、順番に、渡 `toJSON` されるオブジェクトのメソッドを呼び出します。一方、元のPowerPoint。ShapeFont オブジェクトは API オブジェクトで、メソッドはプレーンな JavaScript オブジェクト (次のように入力) `toJSON` を返します。`PowerPoint.Interfaces.ShapeFontData`<!-- -->) は、元のオブジェクトから読み込まれた子プロパティの浅いコピーを含む。
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'toJSON(): PowerPoint.Interfaces.ShapeFontData;'
    return:
      type: <xref uid="powerpoint!PowerPoint.Interfaces.ShapeFontData:interface" />
      description: ''
