- name: add(name, index)
  uid: excel!Excel.ChartSeriesCollection#add:member(1)
  package: excel!
  fullName: add(name, index)
  summary: コレクションに新しい系列を追加します。 新しい追加された系列は、値、x 軸の値、またはバブル サイズが設定されるまで表示されません (グラフの種類によって異なります)。
  remarks: '\[[API セット: ExcelApi 1.7](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'add(name?: string, index?: number): Excel.ChartSeries;'
    parameters:
    - id: name
      description: 省略可能。 系列の名前。
      type: string
    - id: index
      description: 省略可能。 追加する系列のインデックス値。 0 を起点とする番号になります。
      type: number
    return:
      type: <xref uid="excel!Excel.ChartSeries:class" />
      description: ''
