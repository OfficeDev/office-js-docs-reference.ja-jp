- name: getItemAt(index)
  uid: excel!Excel.ChartSeriesCollection#getItemAt:member(1)
  package: excel!
  fullName: getItemAt(index)
  summary: コレクション内の位置に基づいてデータ系列を取得します。
  remarks: "\\[[API セット: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\n// Get the name of the first series in the series collection.\nawait Excel.run(async (context) => { \n    var seriesCollection = context.workbook.worksheets.getItem(\"Sheet1\").charts.getItem(\"Chart1\").series;\n    seriesCollection.load('items');\n    await context.sync();\n    \n    console.log(seriesCollection.items[0].name);\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItemAt(index: number): Excel.ChartSeries;'
    parameters:
    - id: index
      description: 取得するオブジェクトのインデックス値。0 を起点とする番号になります。
      type: number
    return:
      type: <xref uid="excel!Excel.ChartSeries:class" />
      description: ''
