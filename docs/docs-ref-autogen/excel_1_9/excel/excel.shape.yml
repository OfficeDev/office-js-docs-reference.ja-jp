- name: incrementLeft(increment)
  uid: excel!Excel.Shape#incrementLeft:member(1)
  package: excel!
  fullName: incrementLeft(increment)
  summary: 指定したポイント数だけ水平方向に図形を移動します。
  remarks: >-
    \[[API セット: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/44-shape/shape-move-and-order.yaml

    await Excel.run(async (context) => {
        const sheet = context.workbook.worksheets.getItem("Shapes");
        const shape = sheet.shapes.getItem("Square")
        shape.incrementLeft(-25);
        await context.sync();
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'incrementLeft(increment: number): void;'
    parameters:
    - id: increment
      description: 増分をポイント単位で指定すると、図形は水平方向に移動されます。 正の値を指定すると、図形は右に移動し、負の値を指定すると左に移動します。 シートが右から左に向いた場合は、正の値を指定すると図形が左に移動し、負の値が右に移動します。
      type: number
    return:
      type: void
      description: ''
- name: incrementRotation(increment)
  uid: excel!Excel.Shape#incrementRotation:member(1)
  package: excel!
  fullName: incrementRotation(increment)
  summary: z 軸を中心に、指定された度数だけ、図形を時計回りに回転します。 プロパティを `rotation` 使用して、図形の絶対回転を設定します。
  remarks: >-
    \[[API セット: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/44-shape/shape-images.yaml

    await Excel.run(async (context) => {
        const sheet = context.workbook.worksheets.getItem("Shapes");
        const shape = sheet.shapes.getItem("Image");
        shape.incrementRotation(180);
        await context.sync();
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'incrementRotation(increment: number): void;'
    parameters:
    - id: increment
      description: 図形を回転する度数。 正の値を指定すると、図形は時計回りに回転し、負の値は反時計回りに回転します。
      type: number
    return:
      type: void
      description: ''
