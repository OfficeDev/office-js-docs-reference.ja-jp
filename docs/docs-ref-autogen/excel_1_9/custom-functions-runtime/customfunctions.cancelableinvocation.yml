  summary: 'カスタム関数が取り消された場合に呼び出されるイベント ハンドラー。 \[[API セット: CustomFunctionsRuntime 1.1](/javascript/api/requirement-sets/excel/custom-functions-requirement-sets) \]'
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'onCanceled: () => void;'
    return:
      type: () =&gt; void
