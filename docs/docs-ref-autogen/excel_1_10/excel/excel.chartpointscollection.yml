  fullName: toJSON()
  summary: API オブジェクトを渡す際に、より有用な出力を提供するために JavaScript `toJSON()` メソッドをオーバーライドします。 `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->、順番に、渡される `toJSON` オブジェクトのメソッドを呼び出します。元のオブジェクトが `Excel.ChartPointsCollection` API `toJSON` オブジェクトであるのに対し、メソッドはプレーンな JavaScript オブジェクト (次のように入力) を返します。 `Excel.Interfaces.ChartPointsCollectionData`<!-- -->) コレクションのアイテムから読み込まれたプロパティのコピーが浅い "items" 配列を含む。
