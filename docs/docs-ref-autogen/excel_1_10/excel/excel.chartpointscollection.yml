- name: getItemAt(index)
  uid: excel!Excel.ChartPointsCollection#getItemAt:member(1)
  package: excel!
  fullName: getItemAt(index)
  summary: データ系列内の位置に基づくポイントを取得します。
  remarks: "\\[[API セット: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\n// Set the border color for the first points in the points collection.\nawait Excel.run(async (context) => { \n    var points = context.workbook.worksheets.getItem(\"Sheet1\").charts.getItem(\"Chart1\").series.getItemAt(0).points;\n    points.getItemAt(0).format.fill.setSolidColor(\"8FBC8F\");\n    await context.sync();\n    \n    console.log(\"Point Border Color Changed\");\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItemAt(index: number): Excel.ChartPoint;'
    parameters:
    - id: index
      description: 取得するオブジェクトのインデックス値。0 を起点とする番号になります。
      type: number
    return:
      type: <xref uid="excel!Excel.ChartPoint:class" />
      description: ''
