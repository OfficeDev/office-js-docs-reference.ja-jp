      description: ''
- name: load(propertyNames)
  uid: excel!Excel.ChartPointsCollection#load:member(2)
  package: excel!
  fullName: load(propertyNames)
  summary: オブジェクトの指定されたプロパティを読み込むコマンドを待ち行列に入れます。 プロパティを読み取る前に、`context.sync()` を呼び出す必要があります。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'load(propertyNames?: string | string[]): Excel.ChartPointsCollection;'
    parameters:
    - id: propertyNames
      description: 読み込むプロパティを指定するコンマ区切り文字列または文字列の配列。
      type: string | string[]
    return:
      type: <xref uid="excel!Excel.ChartPointsCollection:class" />
      description: "\n\n#### <a name=\"examples\"></a>例\n\n```typescript\n// Get the number of points.\nawait Excel.run(async (context) => { \n    var pointsCollection = \n        context.workbook.worksheets.getItem(\"Sheet1\").charts.getItem(\"Chart1\").series.getItemAt(0).points;\n    pointsCollection.load('count');\n    await context.sync();\n    console.log(\"points: Count= \" + pointsCollection.count);\n});\n```"
