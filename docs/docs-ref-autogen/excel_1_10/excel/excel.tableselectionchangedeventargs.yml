  fullName: isInsideTable
  summary: 選択範囲がテーブル内にある場合に指定します。 `IsInsideTable` アドレスを有効 `true` に設定する必要があります。
  remarks: '\[[API セット: ExcelApi 1.7](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'isInsideTable: boolean;'
    return:
      type: boolean
