- name: highlightColor
  uid: word!Word.Font#highlightColor:member
  package: word!
  fullName: highlightColor
  summary: "強調表示の色を取得または設定します。 設定するには、'RRGGBB' 形式\\#または色名のどちらかの値を使用します。 強調表示の色を削除するには、null に設定します。 返される強調表示の色は、'\\#RRGGBB' 形式、混合強調表示色の空の文字列、または強調表示色がない場合は null です。 *Note**: デスクトップで使用できるのは、既定の強調表示OfficeのみWindowsです。 これらは、\"Yellow\"、\"Lime\"、\"ターコイズ\"、\"ピンク\"、\"青\"、\"Red\"、\"DarkBlue\"、\"Teal\"、\"Green\"、\"Purple\"、\"DarkRed\"、\"Olive\"、\"Gray\"、\"LightGray\"、\"Black\"です。 アドインがデスクトップデスクトップのOfficeでWindows場合、フォントに適用すると、他の色は最も近い色に変換されます。"
  remarks: >-
    \[[API セット: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```typescript

    // Highlight selected text

    // Run a batch operation against the Word object model.

    await Word.run(async (context) => {

        // Create a range proxy object for the current selection.
        var selection = context.document.getSelection();

        // Queue a command to highlight the current selection.
        selection.font.highlightColor = '#FFFF00'; // Yellow

        // Synchronize the document state by executing the queued commands,
        // and return a promise to indicate task completion.
        await context.sync();
        console.log('The selection has been highlighted.');
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'highlightColor: string;'
    return:
      type: string
