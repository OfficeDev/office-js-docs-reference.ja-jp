### YamlMime:TSType
name: Office.DelayDeliveryTime
uid: outlook!Office.DelayDeliveryTime:interface
package: outlook!
fullName: Office.DelayDeliveryTime
summary: オブジェクト `DelayDeliveryTime` を使用すると、メッセージの遅延配信日時を管理できます。
remarks: >-
  \[[API セット: メールボックス のプレビュー](/office/dev/add-ins/reference/requirement-sets/outlook-api-requirement-sets) \]


  **[最小アクセス許可レベル](https://docs.microsoft.com/office/dev/add-ins/outlook/understanding-outlook-add-in-permissions) <!-- -->**:`ReadItem`


  **[適用可能なOutlookモード](https://docs.microsoft.com/office/dev/add-ins/outlook/outlook-add-ins-overview#extension-points) <!-- -->**: Compose


  #### <a name="examples"></a>例


  ```javascript

  var date_1 = new Date();

  var date_2 = new Date(date_1.getTime() + 2*60000);  // Sending with 2-minute delay.

  Office.context.mailbox.item.delayDeliveryTime.setAsync(
      date_2,
      function(callback) {
          console.log(callback);
      });
  ```
isPreview: false
isDeprecated: false
type: interface
