### YamlMime:TSType
name: Excel.Interfaces.TableRowCollectionLoadOptions
uid: excel!Excel.Interfaces.TableRowCollectionLoadOptions:interface
package: excel!
fullName: Excel.Interfaces.TableRowCollectionLoadOptions
summary: >-
  表の一部であるすべての行のコレクションを表します。


  範囲や列とは異なり `TableRow` 、新しい行または列が追加される場合は調整されますが、オブジェクトはテーブル行の物理的な場所を表しますが、データは表しません。 つまり、データを並べ替えた場合、または新しい行が追加された場合、テーブル行は作成されたインデックスを引き続きポイントします。
remarks: '\[[API セット: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: false
isDeprecated: false
type: interface
properties:
- name: $all
  uid: excel!Excel.Interfaces.TableRowCollectionLoadOptions#$all:member
  package: excel!
  fullName: $all
  summary: '`$all` LoadOptions を指定すると、すべてのスカラー プロパティが読み込まれます (例:`Range.address`<!-- -->) ではなく、ナビゲーション プロパティ (例: `Range.format.fill.color`<!-- -->).'
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: '$all?: boolean;'
    return:
      type: boolean
- name: index
  uid: excel!Excel.Interfaces.TableRowCollectionLoadOptions#index:member
  package: excel!
  fullName: index
  summary: 'コレクション内の各 ITEM について: テーブルの rows コレクション内の行のインデックス番号を返します。 0 を起点とする番号になります。'
  remarks: '\[[API セット: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'index?: boolean;'
    return:
      type: boolean
- name: values
  uid: excel!Excel.Interfaces.TableRowCollectionLoadOptions#values:member
  package: excel!
  fullName: values
  summary: 'コレクション内の各 ITEM について: 指定した範囲の生の値を表します。 返されるデータには、文字列、数値、またはブール値を指定できます。 エラーが含まれているセルは、エラー文字列を返します。 戻り値がプラス (+")、マイナス ("-")、または等号 ("=") で始まる場合、Excelは、この値を数式として解釈します。'
  remarks: '\[[API セット: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'values?: boolean;'
    return:
      type: boolean
- name: valuesAsJson
  uid: excel!Excel.Interfaces.TableRowCollectionLoadOptions#valuesAsJson:member
  package: excel!
  fullName: valuesAsJson
  summary: 'コレクション内の各 ITEM の場合: この表の行のセル内の値の JSON 表記。 異なり `TableRow.values`<!-- -->は `TableRow.valuesAsJson` 、セル内に含め得るすべてのデータ型をサポートします。 たとえば、標準のブール値、数値、文字列値に加えて、書式設定された数値と Web イメージが含まれます。 この API から返されるデータは、常に en-US ロケールに合わせて配置されます。 ユーザーの表示ロケールのデータを取得するには、 `TableRow.valuesAsJsonLocal`<!-- -->.'
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valuesAsJson?: boolean;'
    return:
      type: boolean
- name: valuesAsJsonLocal
  uid: excel!Excel.Interfaces.TableRowCollectionLoadOptions#valuesAsJsonLocal:member
  package: excel!
  fullName: valuesAsJsonLocal
  summary: 'コレクション内の各 ITEM の場合: この表の行のセル内の値の JSON 表記。 異なり `TableRow.values`<!-- -->は `TableRow.valuesAsJsonLocal` 、セル内に含め得るすべてのデータ型をサポートします。 たとえば、標準のブール値、数値、文字列値に加えて、書式設定された数値と Web イメージが含まれます。 この API から返されるデータは、常にユーザーの表示ロケールに合わせて配置されます。 ロケールに依存しないデータを取得するには、 `TableRow.valuesAsJson`<!-- -->.'
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valuesAsJsonLocal?: boolean;'
    return:
      type: boolean
