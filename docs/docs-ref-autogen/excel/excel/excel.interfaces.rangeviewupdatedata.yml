properties:
- name: formulas
  uid: excel!Excel.Interfaces.RangeViewUpdateData#formulas:member
  package: excel!
  fullName: formulas
  summary: A1 スタイル表記の数式を表します。 セルに数式がない場合は、その値が代わりに返されます。
  remarks: '\[[API セット: ExcelApi 1.3](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'formulas?: any[][];'
    return:
      type: any[][]
- name: formulasLocal
  uid: excel!Excel.Interfaces.RangeViewUpdateData#formulasLocal:member
  package: excel!
  fullName: formulasLocal
  summary: ユーザーの言語と数値書式ロケールで、A1 スタイル表記の数式を表します。 たとえば、英語の数式 "=SUM(A1, 1.5)" は、ドイツ語では "=SUMME(A1; 1,5)" になります。 セルに数式がない場合は、その値が代わりに返されます。
  remarks: '\[[API セット: ExcelApi 1.3](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'formulasLocal?: any[][];'
    return:
      type: any[][]
- name: formulasR1C1
  uid: excel!Excel.Interfaces.RangeViewUpdateData#formulasR1C1:member
  package: excel!
  fullName: formulasR1C1
  summary: R1C1 スタイル表記の数式を表します。 セルに数式がない場合は、その値が代わりに返されます。
  remarks: '\[[API セット: ExcelApi 1.3](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'formulasR1C1?: any[][];'
    return:
      type: any[][]
- name: numberFormat
  uid: excel!Excel.Interfaces.RangeViewUpdateData#numberFormat:member
  package: excel!
  fullName: numberFormat
  summary: 指定したセルの Excel の数値書式コードを表します。
  remarks: '\[[API セット: ExcelApi 1.3](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
