- name: layout
  uid: excel!Excel.PivotTable#layout:member
  package: excel!
  fullName: layout
  summary: ピボットテーブルのレイアウトとビジュアル構造を記述する PivotLayout。
  remarks: >-
    \[[API セット: ExcelApi 1.8](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/38-pivottable/pivottable-create-and-modify.yaml

    await Excel.run(async (context) => {
        const pivotTable = context.workbook.worksheets.getActiveWorksheet().pivotTables.getItem("Farm Sales");
        pivotTable.layout.load("layoutType");
        await context.sync();

        // cycle between the three layout types
        if (pivotTable.layout.layoutType === "Compact") {
            pivotTable.layout.layoutType = "Outline";
        } else if (pivotTable.layout.layoutType === "Outline") {
            pivotTable.layout.layoutType = "Tabular";
        } else {
            pivotTable.layout.layoutType = "Compact";
        }
        await context.sync();
        console.log("Pivot layout is now " + pivotTable.layout.layoutType);
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly layout: Excel.PivotLayout;'
    return:
      type: <xref uid="excel!Excel.PivotLayout:class" />
