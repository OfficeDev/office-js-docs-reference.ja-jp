properties:
- name: writable
  uid: excel!Excel.CellValueExtraProperties#writable:member
  package: excel!
  fullName: writable
  summary: セルの上書きに `CellValue` 使用するかどうかを表します。 false の場合、セルを上書き `CellValue` するためにこれを使用する API は、エラーをスローせずにこの値を無視します。 既定値は true です。
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'writable?: boolean;'
    return:
      type: boolean
- name: writableNote
  uid: excel!Excel.CellValueExtraProperties#writableNote:member
  package: excel!
  fullName: writableNote
  summary: 'false として指定される理由に関 `CellValue.writable` する説明を表します。 注: この文字列は、false として指定 `writable` されている場合にのみ使用できます。'
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
