- name: address
  uid: excel!Excel.Interfaces.AllowEditRangeLoadOptions#address:member
  package: excel!
  fullName: address
  summary: オブジェクトに関連付けられている範囲を指定します。 このメソッドが正しく動作するには、ワークシート保護を無効または一時停止する必要があります。 ワークシートの保護が有効で一時停止されていない場合、このメソッドはエラーをスロー `AccessDenied` し、範囲の設定に失敗します。
