- name: pauseProtection(password)
  uid: excel!Excel.WorksheetProtection#pauseProtection:member(1)
  package: excel!
  fullName: pauseProtection(password)
  summary: 特定のセッションのユーザーに対する、指定されたワークシート オブジェクトのワークシート保護を一時停止します。 パスワードが正しくない場合、このメソッドはエラーを `UnsupportedOperation` スローし、保護の一時停止に失敗します。 ワークシートの保護が有効になっていないか、既に一時停止されている場合、このメソッドは保護状態を変更しません。
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'pauseProtection(password?: string): void;'
    parameters:
    - id: password
      description: 保護されたワークシートに関連付けられているパスワード。
      type: string
    return:
      type: void
      description: ''
- name: protect(options, password)
  uid: excel!Excel.WorksheetProtection#protect:member(1)
  package: excel!
  fullName: protect(options, password)
  summary: ワークシートを保護します。 ワークシートが既に保護されている場合は失敗します。
  remarks: >-
    \[[API セット: オプションの ExcelApi 1.2、パスワードの場合は 1.7](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/50-workbook/data-protection.yaml

    await Excel.run(async (context) => {
        let activeSheet = context.workbook.worksheets.getActiveWorksheet();
        activeSheet.load("protection/protected");

        await context.sync();

        if (!activeSheet.protection.protected) {
            activeSheet.protection.protect();
        }
    });

    ```

    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/50-workbook/data-protection.yaml

    let password = await passwordHandler();

    passwordHelper(password);

    await Excel.run(async (context) => {
        let activeSheet = context.workbook.worksheets.getActiveWorksheet();
        activeSheet.load("protection/protected");

        await context.sync();

        if (!activeSheet.protection.protected) {
            activeSheet.protection.protect(null, password);
        }
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'protect(options?: Excel.WorksheetProtectionOptions, password?: string): void;'
    parameters:
    - id: options
      description: 省略可能。 シートの保護のオプション。
      type: <xref uid="excel!Excel.WorksheetProtectionOptions:interface" />
    - id: password
      description: 省略可能。 シート保護パスワード。
      type: string
    return:
      type: void
      description: ''
- name: resumeProtection()
  uid: excel!Excel.WorksheetProtection#resumeProtection:member(1)
  package: excel!
  fullName: resumeProtection()
  summary: 特定のセッションのユーザーに対する、指定されたワークシート オブジェクトのワークシート保護を再開します。 このメソッドを動作するには、ワークシートの保護を一時停止する必要があります。 ワークシートの保護が一時停止されていない場合、このメソッドはワークシートの保護状態を変更します。
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'resumeProtection(): void;'
    return:
      type: void
      description: ''
- name: setPassword(password)
  uid: excel!Excel.WorksheetProtection#setPassword:member(1)
  package: excel!
  fullName: setPassword(password)
  summary: オブジェクトに関連付けられているパスワードを変更 `WorksheetProtection` します。 パスワードを空の文字列 ("") `null` として設定するか、オブジェクトからパスワード保護を削除 `WorksheetProtection` します。 このメソッドが正しく動作するには、ワークシート保護を有効にし、一時停止する必要があります。 ワークシートの保護が無効になっている場合、このメソッドはエラーをスロー `InvalidOperation` し、パスワードの変更に失敗します。 ワークシート保護が有効で一時停止されていない場合、この `AccessDenied` メソッドはエラーをスローし、パスワードの変更に失敗します。
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'setPassword(password?: string): void;'
    parameters:
    - id: password
      description: オブジェクトに関連付けられているパスワード `WorksheetProtection` 。
      type: string
    return:
      type: void
      description: ''
- name: toJSON()
  uid: excel!Excel.WorksheetProtection#toJSON:member(1)
  package: excel!
  fullName: toJSON()
  summary: API オブジェクトを渡す際に、より有用な出力を提供するために JavaScript `toJSON()` メソッドをオーバーライドします。 `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->、順番に、渡される`toJSON`オブジェクトのメソッドを呼び出します。一方、元のExcel。WorksheetProtection オブジェクトは API オブジェクトで`toJSON`、メソッドはプレーンな JavaScript オブジェクト (次のように入力) を返します。`Excel.Interfaces.WorksheetProtectionData`<!-- -->) は、元のオブジェクトから読み込まれた子プロパティの浅いコピーを含む。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
