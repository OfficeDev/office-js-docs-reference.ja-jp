methods:
- name: getItem(index)
  uid: excel!Excel.RangeBorderCollection#getItem:member(1)
  package: excel!
  fullName: getItem(index)
  summary: オブジェクトの名前を使用して、境界線オブジェクトを取得します。
  remarks: >-
    \[[API セット: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```typescript

    await Excel.run(async (context) => {
        var sheetName = "Sheet1";
        var rangeAddress = "A1:F8";
        var worksheet = context.workbook.worksheets.getItem(sheetName);
        var range = worksheet.getRange(rangeAddress);
        var border = range.format.borders.getItem(Excel.BorderIndex.edgeTop);
        border.load('style');
        await context.sync();

        console.log(border.style);
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItem(index: Excel.BorderIndex): Excel.RangeBorder;'
    parameters:
    - id: index
      description: 取得する罫線オブジェクトのインデックス値。 詳細は「`Excel.BorderIndex`」をご覧ください。
      type: <xref uid="excel!Excel.BorderIndex:enum" />
    return:
      type: <xref uid="excel!Excel.RangeBorder:class" />
      description: ''
- name: getItem(indexString)
  uid: excel!Excel.RangeBorderCollection#getItem:member(2)
  package: excel!
  fullName: getItem(indexString)
  summary: オブジェクトの名前を使用して、境界線オブジェクトを取得します。
  remarks: '\[[API セット: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItem(indexString: "EdgeTop" | "EdgeBottom" | "EdgeLeft" | "EdgeRight" | "InsideVertical" | "InsideHorizontal" | "DiagonalDown" | "DiagonalUp"): Excel.RangeBorder;'
    parameters:
    - id: indexString
      description: 取得する罫線オブジェクトのインデックス値。 詳細は「`Excel.BorderIndex`」をご覧ください。
      type: "\"EdgeTop\" | \"EdgeBottom\" | \"EdgeLeft\" | \"EdgeRight\" | \"InsideVertical\" | \"InsideHorizontal\" | \"DiagonalDown\" | \"DiagonalUp\""
    return:
      type: <xref uid="excel!Excel.RangeBorder:class" />
      description: ''
- name: getItemAt(index)
  uid: excel!Excel.RangeBorderCollection#getItemAt:member(1)
  package: excel!
  fullName: getItemAt(index)
  summary: オブジェクトのインデックスを使用して、境界線オブジェクトを取得します。
  remarks: "\\[[API セット: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\nawait Excel.run(async (context) => { \n    var sheetName = \"Sheet1\";\n    var rangeAddress = \"A1:F8\";\n    var worksheet = context.workbook.worksheets.getItem(sheetName);\n    var range = worksheet.getRange(rangeAddress);\n    var border = range.format.borders.getItemAt(0);\n    border.load('sideIndex');\n    await context.sync();\n    \n    console.log(border.sideIndex);\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItemAt(index: number): Excel.RangeBorder;'
    parameters:
    - id: index
      description: 取得するオブジェクトのインデックス値。0 を起点とする番号になります。
      type: number
    return:
      type: <xref uid="excel!Excel.RangeBorder:class" />
      description: ''
