name: Excel.FormattedNumberCellValue
uid: excel!Excel.FormattedNumberCellValue:interface
package: excel!
fullName: Excel.FormattedNumberCellValue
summary: >-
  書式文字列を持つ数値を含むセルの値を表します。 数値書式指定文字列は、ガイドラインExcel必要があります。 詳細については、「番号形式を [カスタマイズするためのガイドラインの確認」を参照してください。](https://support.microsoft.com/office/review-guidelines-for-customizing-a-number-format-c0a1d1fa-d3f4-4018-96b7-9c9354dd99f5)<!-- -->. このシナリオでは、セルではなく値に書式が適用されます。したがって、値は計算を通じて書式文字列を保持します。


  \[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]
remarks: ''
isPreview: false
isDeprecated: false
type: interface
