type: interface
properties:
- name: index
  uid: excel!Excel.Interfaces.TableRowData#index:member
  package: excel!
  fullName: index
  summary: テーブルの行コレクション内の行のインデックス番号を返します。 0 を起点とする番号になります。
  remarks: '\[[API セット: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'index?: number;'
    return:
      type: number
- name: values
  uid: excel!Excel.Interfaces.TableRowData#values:member
  package: excel!
  fullName: values
  summary: 指定した範囲の Raw 値を表します。 返されるデータには、文字列、数値、またはブール値を指定できます。 エラーが含まれているセルは、エラー文字列を返します。 戻り値がプラス (+")、マイナス ("-")、または等号 ("=") で始まる場合、Excelは、この値を数式として解釈します。
  remarks: '\[[API セット: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'values?: any[][];'
    return:
      type: any[][]
- name: valuesAsJson
  uid: excel!Excel.Interfaces.TableRowData#valuesAsJson:member
  package: excel!
  fullName: valuesAsJson
  summary: この表の行のセル内の値の JSON 表記。 異なり `TableRow.values`<!-- -->は `TableRow.valuesAsJson` 、セル内に含め得るすべてのデータ型をサポートします。 たとえば、標準のブール値、数値、文字列値に加えて、書式設定された数値と Web イメージが含まれます。 この API から返されるデータは、常に en-US ロケールに合わせて配置されます。 ユーザーの表示ロケールのデータを取得するには、 `TableRow.valuesAsJsonLocal`<!-- -->.
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valuesAsJson?: CellValue[][];'
    return:
      type: <xref uid="excel!Excel.CellValue:type" />[][]
- name: valuesAsJsonLocal
  uid: excel!Excel.Interfaces.TableRowData#valuesAsJsonLocal:member
  package: excel!
  fullName: valuesAsJsonLocal
  summary: この表の行のセル内の値の JSON 表記。 異なり `TableRow.values`<!-- -->は `TableRow.valuesAsJsonLocal` 、セル内に含め得るすべてのデータ型をサポートします。 たとえば、標準のブール値、数値、文字列値に加えて、書式設定された数値と Web イメージが含まれます。 この API から返されるデータは、常にユーザーの表示ロケールに合わせて配置されます。 ロケールに依存しないデータを取得するには、 `TableRow.valuesAsJson`<!-- -->.
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valuesAsJsonLocal?: CellValue[][];'
    return:
      type: <xref uid="excel!Excel.CellValue:type" />[][]
