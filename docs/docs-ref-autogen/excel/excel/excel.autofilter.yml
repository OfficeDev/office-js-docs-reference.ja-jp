- name: reapply()
  uid: excel!Excel.AutoFilter#reapply:member(1)
  package: excel!
  fullName: reapply()
  summary: 指定した AutoFilter オブジェクトを現在範囲に適用します。
  remarks: >-
    \[[API セット: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/54-worksheet/worksheet-auto-filter.yaml

    await Excel.run(async (context) => {
        // This method refreshes the AutoFilter to ensure that changes are captured.

        // Retrieve the active worksheet.
        const sheet = context.workbook.worksheets.getActiveWorksheet();

        // Reapply the filter to capture changes.
        sheet.autoFilter.reapply();
        await context.sync();
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'reapply(): void;'
    return:
      type: void
      description: ''
- name: remove()
  uid: excel!Excel.AutoFilter#remove:member(1)
  package: excel!
  fullName: remove()
  summary: 範囲の AutoFilter を削除します。
  remarks: >-
    \[[API セット: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/54-worksheet/worksheet-auto-filter.yaml

    await Excel.run(async (context) => {
        // This method removes all AutoFilters from the active worksheet.

        // Retrieve the active worksheet.
        const sheet = context.workbook.worksheets.getActiveWorksheet();

        // Remove all filters.
        sheet.autoFilter.remove();
        await context.sync();
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'remove(): void;'
    return:
      type: void
      description: ''
