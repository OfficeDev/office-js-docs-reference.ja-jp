methods:
- name: apply(range, columnIndex, criteria)
  uid: excel!Excel.AutoFilter#apply:member(1)
  package: excel!
  fullName: apply(range, columnIndex, criteria)
  summary: 範囲にオートフィルターを適用します。 列インデックスやフィルター条件が指定されている場合、列にフィルターを適用します。
  remarks: "\\[[API セット: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\n// Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/54-worksheet/worksheet-auto-filter.yaml\nawait Excel.run(async (context) => {\n    // This method adds a percentage AutoFilter to the active worksheet \n    // and applies the filter to a column of the used range.\n\n    // Retrieve the active worksheet and the used range on that worksheet.\n    const sheet = context.workbook.worksheets.getActiveWorksheet();\n    const farmData = sheet.getUsedRange();\n\n    // Add a filter that will only show the rows with the top 50% of values in column 3.\n    sheet.autoFilter.apply(farmData, 3, {\n        criterion1: \"50\",\n        filterOn: Excel.FilterOn.topPercent\n    });\n\n    await context.sync();\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'apply(range: Range | string, columnIndex?: number, criteria?: Excel.FilterCriteria): void;'
    parameters:
    - id: range
      description: オートフィルターが適用される範囲。
      type: <xref uid="excel!Excel.Range:class" /> | string
    - id: columnIndex
      description: オートフィルターが適用される 0 から始る列インデックス。
      type: number
    - id: criteria
      description: フィルター条件。
      type: <xref uid="excel!Excel.FilterCriteria:interface" />
    return:
      type: void
      description: ''
- name: clearColumnCriteria(columnIndex)
  uid: excel!Excel.AutoFilter#clearColumnCriteria:member(1)
  package: excel!
  fullName: clearColumnCriteria(columnIndex)
  summary: オートフィルターの列フィルター条件をクリアします。
  remarks: >-
    \[[API セット: ExcelApi 1.14](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/54-worksheet/worksheet-auto-filter.yaml

    await Excel.run(async (context) => {
        // This method clears the AutoFilter setting from one column.

        // Retrieve the active worksheet.
        const sheet = context.workbook.worksheets.getActiveWorksheet();

        // Clear the filter from only column 3.
        sheet.autoFilter.clearColumnCriteria(3);
        await context.sync();
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'clearColumnCriteria(columnIndex: number): void;'
    parameters:
    - id: columnIndex
      description: ゼロベースの列インデックス 。これは、クリアする必要がある列フィルターを表します。 インデックス値がサポートされていない場合 (たとえば、値が負の数値の場合、または値が範囲の使用可能な列数より大きい場合)、例外が `InvalidArgument` スローされます。
      type: number
    return:
      type: void
      description: ''
