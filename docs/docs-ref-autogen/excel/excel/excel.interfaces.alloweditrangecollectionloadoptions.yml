### YamlMime:TSType
name: Excel.Interfaces.AllowEditRangeCollectionLoadOptions
uid: excel!Excel.Interfaces.AllowEditRangeCollectionLoadOptions:interface
package: excel!
fullName: Excel.Interfaces.AllowEditRangeCollectionLoadOptions
summary: ワークシートで見つかったオブジェクト `AllowEditRange` のセットを表します。 `AllowEditRange` オブジェクトはワークシート保護プロパティを使用します。 ワークシートの保護を有効にすると、オブジェクトを使用して特定の範囲の編集を許可し、ワークシートの残りの部分の保護 `AllowEditRange` を維持できます。
remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
type: interface
properties:
- name: $all
  uid: excel!Excel.Interfaces.AllowEditRangeCollectionLoadOptions#$all:member
  package: excel!
  fullName: $all
  summary: '`$all`LoadOptions を指定すると、すべてのスカラー プロパティが読み込まれます (例:`Range.address`<!-- -->) ではなく、ナビゲーション プロパティ (例: `Range.format.fill.color`<!-- -->).'
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: '$all?: boolean;'
    return:
      type: boolean
- name: address
  uid: excel!Excel.Interfaces.AllowEditRangeCollectionLoadOptions#address:member
  package: excel!
  fullName: address
  summary: コレクション内の各 ITEM について:オブジェクトに関連付けられている範囲を指定します。 このメソッドが正しく動作するには、ワークシート保護を無効または一時停止する必要があります。 ワークシートの保護が有効で一時停止されていない場合、このメソッドはエラーをスロー `AccessDenied` し、範囲の設定に失敗します。
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'address?: boolean;'
    return:
      type: boolean
- name: isPasswordProtected
  uid: excel!Excel.Interfaces.AllowEditRangeCollectionLoadOptions#isPasswordProtected:member
  package: excel!
  fullName: isPasswordProtected
  summary: コレクション内の各アイテムについて:パスワードが保護 `AllowEditRange` されている場合に指定します。
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'isPasswordProtected?: boolean;'
    return:
      type: boolean
- name: title
  uid: excel!Excel.Interfaces.AllowEditRangeCollectionLoadOptions#title:member
  package: excel!
  fullName: title
  summary: 'コレクション内の各 ITEM: オブジェクトのタイトルを指定します。 このメソッドが正しく動作するには、ワークシート保護を無効または一時停止する必要があります。 ワークシートの保護が有効で一時停止されていない場合、このメソッドはエラーをスロー `AccessDenied` し、タイトルの設定に失敗します。 同じ文字列を持つ既存の文字列が既にある場合、または文字列が空 ("") の場合、このメソッドはエラーをスローし、タイトルの設定 `AllowEditRange` `null` `InvalidArgument` に失敗します。'
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'title?: boolean;'
    return:
      type: boolean
