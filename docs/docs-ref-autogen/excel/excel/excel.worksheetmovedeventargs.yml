### YamlMime:TSType
name: Excel.WorksheetMovedEventArgs
uid: excel!Excel.WorksheetMovedEventArgs:interface
package: excel!
fullName: Excel.WorksheetMovedEventArgs
summary: >-
  ワークシートがブック内で移動された場合に通知します。


  ワークシートをブック内の 1 つの位置から別の UI 経由で移動Excel、この API によってイベントがトリガーされます。 別のワークシートを移動した結果、ワークシートの位置が変更された場合、このイベントは両方の位置の変更に対してトリガーされません。 このイベントは、プライマリ ワークシートの移動にのみトリガーされ、そのプライマリ移動の結果として発生するワークシート位置の変更はトリガーされません。
remarks: '\[[API セット: ExcelApiOnline 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: false
isDeprecated: false
type: interface
