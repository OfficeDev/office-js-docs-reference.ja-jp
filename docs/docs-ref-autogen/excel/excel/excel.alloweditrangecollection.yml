- name: add(title, rangeAddress, options)
  uid: excel!Excel.AllowEditRangeCollection#add:member(1)
  package: excel!
  fullName: add(title, rangeAddress, options)
  summary: コレクションに `AllowEditRange` オブジェクトを追加します。 このメソッドが正しく動作するには、ワークシート保護を無効または一時停止する必要があります。 ワークシートの保護が有効で一時停止されていない場合、このメソッドはエラーをスローし、追加 `AccessDenied` 操作は失敗します。
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'add(title: string, rangeAddress: string, options?: Excel.AllowEditRangeOptions): void;'
    parameters:
    - id: title
      description: 追加するオブジェクト `AllowEditRange` のタイトル文字列。
      type: string
    - id: rangeAddress
      description: 追加するオブジェクト `AllowEditRange` の範囲アドレス。
      type: string
    - id: options
      description: パスワードなど、オブジェクトに `AllowEditRange` 追加する追加オプション。
