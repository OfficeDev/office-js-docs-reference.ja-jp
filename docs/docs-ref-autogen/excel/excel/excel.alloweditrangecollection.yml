- name: pauseProtection(password)
  uid: excel!Excel.AllowEditRangeCollection#pauseProtection:member(1)
  package: excel!
  fullName: pauseProtection(password)
  summary: 特定のセッションでユーザーに対して指定されたパスワードを持つコレクション内のすべてのオブジェクトに対するワークシート保護 `AllowEditRange` を一時停止します。 このメソッドは、ワークシートの保護が有効で一時停止されていない場合にのみ、オブジェクトの `AllowEditRange` 保護を一時停止します。 ワークシートの保護を一時停止できない場合、このメソッドはエラーをスロー `UnsupportedOperation` し、範囲の保護を一時停止できません。 パスワードがコレクション内のオブジェクトと一致しない場合、このメソッドはエラーをスローし、コレクション内の任意の範囲の保護 `AllowEditRange` `BadPassword` を一時停止できません。
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'pauseProtection(password: string): void;'
    parameters:
    - id: password
      description: オブジェクトの保護を一時停止する `AllowEditRange` パスワード。
      type: string
    return:
      type: void
      description: ''
