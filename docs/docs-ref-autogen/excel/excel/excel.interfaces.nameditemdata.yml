- name: valueAsJson
  uid: excel!Excel.Interfaces.NamedItemData#valueAsJson:member
  package: excel!
  fullName: valueAsJson
  summary: この名前付きアイテムの値の JSON 表記。 異なり `NamedItem.value`<!-- -->は `NamedItem.valueAsJson` 、セル内に含め得るすべてのデータ型をサポートします。 たとえば、標準のブール値、数値、文字列値に加えて、書式設定された数値と Web イメージが含まれます。 この API から返されるデータは、常に en-US ロケールに合わせて配置されます。 ユーザーの表示ロケールのデータを取得するには、 `NamedItem.valueAsJsonLocal`<!-- -->.
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valueAsJson?: CellValue;'
    return:
      type: <xref uid="excel!Excel.CellValue:type" />
- name: valueAsJsonLocal
  uid: excel!Excel.Interfaces.NamedItemData#valueAsJsonLocal:member
  package: excel!
  fullName: valueAsJsonLocal
  summary: この名前付きアイテムの値の JSON 表記。 異なり `NamedItem.value`<!-- -->は `NamedItem.valueAsJsonLocal` 、セル内に含め得るすべてのデータ型をサポートします。 たとえば、標準のブール値、数値、文字列値に加えて、書式設定された数値と Web イメージが含まれます。 この API から返されるデータは、常にユーザーの表示ロケールに合わせて配置されます。 ロケールに依存しないデータを取得するには、 `NamedItem.valueAsJson`<!-- -->.
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valueAsJsonLocal?: CellValue[][];'
    return:
      type: <xref uid="excel!Excel.CellValue:type" />[][]
