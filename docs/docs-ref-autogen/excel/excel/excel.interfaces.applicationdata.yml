  uid: excel!Excel.Interfaces.ApplicationData#useSystemSeparators:member
  package: excel!
  fullName: useSystemSeparators
  summary: ユーザーのシステム区切り記号が有効Excel指定します。 システムの区切り記号には、小数点と桁区切り記号が含まれます。
  remarks: '\[[API セット: ExcelApi 1.11](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
