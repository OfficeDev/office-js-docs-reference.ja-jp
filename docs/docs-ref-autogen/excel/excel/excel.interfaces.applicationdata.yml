  uid: excel!Excel.Interfaces.ApplicationData#cultureInfo:member
  package: excel!
  fullName: cultureInfo
  summary: 現在のシステム カルチャ設定に基づく情報を提供します。 これには、カルチャ名、数値の書式設定、その他の文化的に依存する設定が含まれます。
  remarks: '\[[API セット: ExcelApi 1.11](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
