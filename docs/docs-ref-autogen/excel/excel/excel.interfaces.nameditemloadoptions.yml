    return:
      type: boolean
- name: scope
  uid: excel!Excel.Interfaces.NamedItemLoadOptions#scope:member
  package: excel!
  fullName: scope
  summary: 名前をブックまたは特定のワークシートの範囲に設定する場合に指定します。 使用できる値は、ワークシート、ブックです。
  remarks: '\[[API セット: ExcelApi 1.4](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'scope?: boolean;'
    return:
      type: boolean
- name: type
  uid: excel!Excel.Interfaces.NamedItemLoadOptions#type:member
  package: excel!
  fullName: type
  summary: 名前の数式によって返される値の種類を指定します。 詳細は「`Excel.NamedItemType`」をご覧ください。
  remarks: '\[[API セット: ExcelApi 1.1 for String,Integer,Double,Boolean,Range,Error; 1.7 for Array](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'type?: boolean;'
    return:
      type: boolean
- name: value
  uid: excel!Excel.Interfaces.NamedItemLoadOptions#value:member
  package: excel!
  fullName: value
  summary: 名前の数式で計算された値を表します。 名前付き範囲の場合は範囲のアドレスを返します。
  remarks: '\[[API セット: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'value?: boolean;'
    return:
      type: boolean
- name: valueAsJson
  uid: excel!Excel.Interfaces.NamedItemLoadOptions#valueAsJson:member
  package: excel!
  fullName: valueAsJson
  summary: この名前付きアイテムの値の JSON 表記。 異なり `NamedItem.value`<!-- -->は `NamedItem.valueAsJson` 、セル内に含め得るすべてのデータ型をサポートします。 たとえば、標準のブール値、数値、文字列値に加えて、書式設定された数値と Web イメージが含まれます。 この API から返されるデータは、常に en-US ロケールに合わせて配置されます。 ユーザーの表示ロケールのデータを取得するには、 `NamedItem.valueAsJsonLocal`<!-- -->.
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valueAsJson?: boolean;'
    return:
      type: boolean
- name: valueAsJsonLocal
  uid: excel!Excel.Interfaces.NamedItemLoadOptions#valueAsJsonLocal:member
  package: excel!
  fullName: valueAsJsonLocal
  summary: この名前付きアイテムの値の JSON 表記。 異なり `NamedItem.value`<!-- -->は `NamedItem.valueAsJsonLocal` 、セル内に含め得るすべてのデータ型をサポートします。 たとえば、標準のブール値、数値、文字列値に加えて、書式設定された数値と Web イメージが含まれます。 この API から返されるデータは、常にユーザーの表示ロケールに合わせて配置されます。 ロケールに依存しないデータを取得するには、 `NamedItem.valueAsJson`<!-- -->.
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valueAsJsonLocal?: boolean;'
    return:
      type: boolean
