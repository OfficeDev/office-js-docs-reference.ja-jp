  package: excel!
  fullName: comment
  summary: この名前に関連付けられたコメントを指定します。
  remarks: '\[[API セット: ExcelApi 1.4](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'comment?: boolean;'
    return:
      type: boolean
- name: formula
  uid: excel!Excel.Interfaces.NamedItemLoadOptions#formula:member
  package: excel!
  fullName: formula
  summary: 名前付きアイテムの数式。 数式は常に等号 ("=") で始まる。
  remarks: '\[[API セット: ExcelApi 1.7](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
