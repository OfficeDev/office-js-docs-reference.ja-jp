  summary: ユーザーのExcelに基づいて、指定した範囲の数値書式コードを表します。 Excelプロパティを取得または設定するときに、言語や形式の設定を実行しない場合`numberFormatLocal`。 返されるテキストは、システム設定で指定された言語に基づいてローカル形式の文字列を使用します。
