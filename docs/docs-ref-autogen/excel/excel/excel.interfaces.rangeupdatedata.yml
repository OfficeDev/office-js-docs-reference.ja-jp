  package: excel!
  fullName: dataValidation
  summary: dataValidation オブジェクトを返します。
  remarks: '\[[API セット: ExcelApi 1.8](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
