  fullName: rowHidden
  summary: 現在の範囲内のすべての行が非表示の場合を表します。 値は、 `true` 範囲内のすべての行が非表示の場合です。 値は、 `false` 範囲内の行が非表示の場合です。 値は、 `null` 範囲内の一部の行が非表示で、同じ範囲内の他の行が非表示ではない場合です。
