- name: valuesAsJson
  uid: excel!Excel.Interfaces.NamedItemArrayValuesData#valuesAsJson:member
  package: excel!
  fullName: valuesAsJson
  summary: この名前付きアイテム配列内の値の JSON 表記。 異なり `NamedItemArrayValues.values`<!-- -->は `NamedItemArrayValues.valuesAsJson` 、セル内に含め得るすべてのデータ型をサポートします。 たとえば、標準のブール値、数値、文字列値に加えて、書式設定された数値と Web イメージが含まれます。 この API から返されるデータは、常に en-US ロケールに合わせて配置されます。 ユーザーの表示ロケールのデータを取得するには、 `NamedItemArrayValues.valuesAsJsonLocal`<!-- -->.
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valuesAsJson?: CellValue[][];'
    return:
      type: <xref uid="excel!Excel.CellValue:type" />[][]
- name: valuesAsJsonLocal
  uid: excel!Excel.Interfaces.NamedItemArrayValuesData#valuesAsJsonLocal:member
  package: excel!
  fullName: valuesAsJsonLocal
  summary: この名前付きアイテム配列内の値の JSON 表記。 異なり `NamedItemArrayValues.values`<!-- -->は `NamedItemArrayValues.valuesAsJsonLocal` 、セル内に含め得るすべてのデータ型をサポートします。 たとえば、標準のブール値、数値、文字列値に加えて、書式設定された数値と Web イメージが含まれます。 この API から返されるデータは、常にユーザーの表示ロケールに合わせて配置されます。 ロケールに依存しないデータを取得するには、 `NamedItemArrayValues.valuesAsJson`<!-- -->.
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
