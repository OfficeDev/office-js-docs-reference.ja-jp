  uid: excel!Excel.Interfaces.NamedItemCollectionLoadOptions#worksheetOrNullObject:member
  package: excel!
  fullName: worksheetOrNullObject
  summary: コレクション内の各アイテムについて:名前付きアイテムのスコープを設定するワークシートを返します。 代わりに、アイテムのスコープがブックに `isNullObject` 設定されている場合、このメソッドはプロパティが次の値に設定されたオブジェクトを返します。 `true`<!-- -->. 詳細については、「 [*OrNullObject メソッドとプロパティ」を参照してください。](https://docs.microsoft.com/office/dev/add-ins/develop/application-specific-api-model#ornullobject-methods-and-properties)<!-- -->.
