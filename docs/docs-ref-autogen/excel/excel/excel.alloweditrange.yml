- name: pauseProtection(password)
  uid: excel!Excel.AllowEditRange#pauseProtection:member(1)
  package: excel!
  fullName: pauseProtection(password)
  summary: 特定のセッションのユーザーの特定 `AllowEditRange` のオブジェクトに対するワークシートの保護を一時停止します。 このメソッドは、ワークシートの保護が有効で一時停止されていない場合にのみ、オブジェクトの保護 `AllowEditRange` を一時停止します。 ワークシートの保護を一時停止できない場合、このメソッドはエラーをスロー `UnsupportedOperation` し、範囲の保護を一時停止できません。 パスワードが正しくない場合、このメソッドはエラーをスロー `InvalidArgument` し、範囲の保護を一時停止できません。
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
