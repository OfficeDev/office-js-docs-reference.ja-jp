name: Excel.Interfaces.TableColumnUpdateData
uid: excel!Excel.Interfaces.TableColumnUpdateData:interface
package: excel!
fullName: Excel.Interfaces.TableColumnUpdateData
summary: TableColumn オブジェクトのデータを更新するためのインターフェイスです。 `tableColumn.set({ ... })`<!-- -->.
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: name
  uid: excel!Excel.Interfaces.TableColumnUpdateData#name:member
  package: excel!
  fullName: name
  summary: テーブル列の名前を指定します。
  remarks: '\[[API セット: 名前を取得する場合は ExcelApi 1.1、設定には 1.4。](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'name?: string;'
    return:
      type: string
- name: values
  uid: excel!Excel.Interfaces.TableColumnUpdateData#values:member
  package: excel!
  fullName: values
  summary: 指定した範囲の Raw 値を表します。 返されるデータには、文字列、数値、またはブール値を指定できます。 エラーが含まれているセルは、エラー文字列を返します。 戻り値がプラス (+")、マイナス ("-")、または等号 ("=") で始まる場合、Excelは、この値を数式として解釈します。
  remarks: '\[[API セット: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'values?: any[][];'
    return:
      type: any[][]
- name: valuesAsJson
  uid: excel!Excel.Interfaces.TableColumnUpdateData#valuesAsJson:member
  package: excel!
  fullName: valuesAsJson
  summary: このテーブル列のセル内の値の JSON 表記。 異なり `TableColumn.values`<!-- -->は `TableColumn.valuesAsJson` 、セル内に含め得るすべてのデータ型をサポートします。 たとえば、標準のブール値、数値、文字列値に加えて、書式設定された数値と Web イメージが含まれます。 この API から返されるデータは、常に en-US ロケールに合わせて配置されます。 ユーザーの表示ロケールのデータを取得するには、 `TableColumn.valuesAsJsonLocal`<!-- -->.
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valuesAsJson?: CellValue[][];'
    return:
      type: <xref uid="excel!Excel.CellValue:type" />[][]
- name: valuesAsJsonLocal
  uid: excel!Excel.Interfaces.TableColumnUpdateData#valuesAsJsonLocal:member
  package: excel!
  fullName: valuesAsJsonLocal
  summary: このテーブル列のセル内の値の JSON 表記。 異なり `TableColumn.values`<!-- -->は `TableColumn.valuesAsJsonLocal` 、セル内に含め得るすべてのデータ型をサポートします。 たとえば、標準のブール値、数値、文字列値に加えて、書式設定された数値と Web イメージが含まれます。 この API から返されるデータは、常にユーザーの表示ロケールに合わせて配置されます。 ロケールに依存しないデータを取得するには、 `TableColumn.valuesAsJson`<!-- -->.
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valuesAsJsonLocal?: CellValue[][];'
    return:
      type: <xref uid="excel!Excel.CellValue:type" />[][]
