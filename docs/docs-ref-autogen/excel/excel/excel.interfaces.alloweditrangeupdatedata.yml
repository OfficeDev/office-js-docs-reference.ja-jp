properties:
- name: address
  uid: excel!Excel.Interfaces.AllowEditRangeUpdateData#address:member
  package: excel!
  fullName: address
  summary: オブジェクトに関連付けられている範囲を指定します。 このメソッドが正しく動作するには、ワークシート保護を無効または一時停止する必要があります。 ワークシートの保護が有効で一時停止されていない場合、このメソッドはエラーをスロー `AccessDenied` し、範囲の設定に失敗します。
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'address?: string;'
    return:
      type: string
- name: title
  uid: excel!Excel.Interfaces.AllowEditRangeUpdateData#title:member
  package: excel!
  fullName: title
  summary: オブジェクトのタイトルを指定します。 このメソッドが正しく動作するには、ワークシート保護を無効または一時停止する必要があります。 ワークシートの保護が有効で一時停止されていない場合、このメソッドはエラーをスロー `AccessDenied` し、タイトルの設定に失敗します。 同じ文字列を持つ既存の文字列が既にある場合、または文字列が空 ("") の場合、このメソッドはエラーをスローし、タイトルの設定 `AllowEditRange` `null` `InvalidArgument` に失敗します。
  remarks: '\[[API セット: ExcelApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'title?: string;'
    return:
      type: string
