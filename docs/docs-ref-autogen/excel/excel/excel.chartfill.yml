methods:
- name: clear()
  uid: excel!Excel.ChartFill#clear:member(1)
  package: excel!
  fullName: clear()
  summary: グラフ要素の塗りつぶしの色をクリアします。
  remarks: "\\[[API セット: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\n// Clear the line format of the major gridlines on the value axis of the chart named \"Chart1\".\nawait Excel.run(async (context) => { \n    var gridlines = context.workbook.worksheets.getItem(\"Sheet1\").charts.getItem(\"Chart1\").axes.valueAxis.majorGridlines;\n    gridlines.format.line.clear();\n    await context.sync();\n    \n    console.log(\"Chart Major Gridlines Format Cleared\");\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'clear(): void;'
    return:
      type: void
      description: ''
