### YamlMime:TSType
name: Word.ContentControlCollection
uid: word!Word.ContentControlCollection:class
package: word!
fullName: Word.ContentControlCollection
summary: '[Word.ContentControl オブジェクトのコレクションを格納](xref:word!Word.ContentControl:class)します。 コンテンツ コントロールは、特定の種類のコンテンツのコンテナーとして機能する、ラベルを付けることのできる、境界線で区切られたドキュメント内の領域です。 個々のコンテンツ コントロールには、画像、表、または書式設定されたテキストの段落などを内容として格納できます。 現在、リッチ テキストのコンテンツ コントロールのみがサポートされています。'
remarks: '\[[API セット: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
isPreview: false
isDeprecated: false
type: class
