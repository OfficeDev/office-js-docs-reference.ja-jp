name: Office.ReplyFormAttachment
uid: outlook!Office.ReplyFormAttachment:interface
package: outlook!
fullName: Office.ReplyFormAttachment
summary: ファイルまたはアイテムの添付ファイル。 返信フォームを表示するときに使用します。
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: inLine
  uid: outlook!Office.ReplyFormAttachment#inLine:member
  package: outlook!
  fullName: inLine
  summary: type が file に設定されている場合にのみ使用されます。 true の場合は、添付ファイルがメッセージ本文にインラインで表示され、添付ファイルの一覧には表示されません。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'inLine?: boolean;'
    return:
      type: boolean
- name: itemId
  uid: outlook!Office.ReplyFormAttachment#itemId:member
  package: outlook!
  fullName: itemId
  summary: type が item に設定されている場合にのみ使用されます。 添付ファイルの EWS アイテムの ID。 最大の長さが 100 文字の文字列です。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'itemId?: string;'
    return:
      type: string
- name: name
  uid: outlook!Office.ReplyFormAttachment#name:member
  package: outlook!
  fullName: name
  summary: 添付ファイル名を含む文字列。最大の長さは 255 文字です。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'name: string;'
    return:
      type: string
- name: type
  uid: outlook!Office.ReplyFormAttachment#type:member
  package: outlook!
  fullName: type
  summary: 添付ファイルの種類を示します。 アイテム添付ファイルのファイルまたはアイテムの添付ファイルである必要があります。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'type: string;'
    return:
      type: string
- name: url
  uid: outlook!Office.ReplyFormAttachment#url:member
  package: outlook!
  fullName: url
  summary: >-
    type が file に設定されている場合にのみ使用されます。 ファイルの場所の URI。


    **重要**: このリンクは、サーバーによる認証を必要とせずに、一般にアクセスExchange Onlineがあります。 ただし、オンプレミスのネットワークを使用Exchange、追加の認証が必要ない限り、プライベート ネットワーク上でリンクにアクセスできます。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'url?: string;'
    return:
      type: string
