- name: getItem(key)
  uid: powerpoint!PowerPoint.ShapeCollection#getItem:member(1)
  package: powerpoint!
  fullName: getItem(key)
  summary: 一意の ID を使用して図形を取得します。 図形が存在しない場合は、エラーがスローされます。
  remarks: '\[[API セット: PowerPointApi 1.3](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItem(key: string): PowerPoint.Shape;'
    parameters:
    - id: key
      description: 図形の ID。
      type: string
    return:
      type: <xref uid="powerpoint!PowerPoint.Shape:class" />
      description: 一意の ID を持つ図形。 このような図形が存在しない場合は、エラーがスローされます。
- name: getItemAt(index)
  uid: powerpoint!PowerPoint.ShapeCollection#getItemAt:member(1)
  package: powerpoint!
  fullName: getItemAt(index)
  summary: コレクション内の 0 から始るインデックスを使用して図形を取得します。 インデックスが範囲を外している場合は、エラーがスローされます。
  remarks: >-
    \[[API セット: PowerPointApi 1.3](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/powerpoint/tags/tags.yaml

    await PowerPoint.run(async function(context) {
      const slide = context.presentation.slides.getItemAt(0);
      const shape = slide.shapes.getItemAt(0);
      shape.tags.add("MOUNTAIN", "Denali");

      await context.sync();

      const myShapeTag = shape.tags.getItem("MOUNTAIN");
      myShapeTag.load("key, value");

      await context.sync();

      console.log("Added key " + JSON.stringify(myShapeTag.key) + " with value " + JSON.stringify(myShapeTag.value));
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItemAt(index: number): PowerPoint.Shape;'
    parameters:
    - id: index
      description: コレクション内の図形のインデックス。
      type: number
    return:
      type: <xref uid="powerpoint!PowerPoint.Shape:class" />
      description: 指定したインデックスの図形。 index が範囲を外している場合、エラーがスローされます。
