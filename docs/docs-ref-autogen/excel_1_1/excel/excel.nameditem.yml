  fullName: type
  summary: 名前の数式によって返される値の種類を指定します。 詳細は「`Excel.NamedItemType`」をご覧ください。
  remarks: '\[[API セット: ExcelApi 1.1 for String,Integer,Double,Boolean,Range,Error; 1.7 for Array](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
