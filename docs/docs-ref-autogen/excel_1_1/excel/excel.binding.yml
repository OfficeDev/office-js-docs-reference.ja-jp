### YamlMime:TSType
name: Excel.Binding
uid: excel!Excel.Binding:class
package: excel!
fullName: Excel.Binding
summary: ブックで定義されている Office.js のバインディングを表します。
remarks: '\[[API セット: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: false
isDeprecated: false
type: class
properties:
- name: context
  uid: excel!Excel.Binding#context:member
  package: excel!
  fullName: context
  summary: オブジェクトに関連付けられた要求コンテキスト。 これにより、アドインのプロセスがホスト アプリケーションのプロセスOfficeに接続されます。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'context: RequestContext;'
    return:
      type: <xref uid="excel!Excel.RequestContext:class" />
- name: id
  uid: excel!Excel.Binding#id:member
  package: excel!
  fullName: id
  summary: バインド識別子を表します。
  remarks: '\[[API セット: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly id: string;'
    return:
      type: string
- name: type
  uid: excel!Excel.Binding#type:member
  package: excel!
  fullName: type
  summary: バインドの種類を返します。 詳細は「`Excel.BindingType`」をご覧ください。
  remarks: '\[[API セット: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly type: Excel.BindingType | "Range" | "Table" | "Text";'
    return:
      type: <xref uid="excel!Excel.BindingType:enum" /> | "Range" | "Table" | "Text"
methods:
- name: getRange()
  uid: excel!Excel.Binding#getRange:member(1)
  package: excel!
  fullName: getRange()
  summary: バインディングによって表される範囲を返します。 バインドが正しい型ではない場合、エラーがスローされます。
  remarks: "\\[[API セット: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\nawait Excel.run(async (context) => { \n    var binding = context.workbook.bindings.getItemAt(0);\n    var range = binding.getRange();\n    range.load('cellCount');\n    await context.sync();\n\n    console.log(range.cellCount);\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getRange(): Excel.Range;'
    return:
      type: <xref uid="excel!Excel.Range:class" />
      description: ''
- name: getTable()
  uid: excel!Excel.Binding#getTable:member(1)
  package: excel!
  fullName: getTable()
  summary: バインドによって表されるテーブルを返します。 バインドが正しい型ではない場合、エラーがスローされます。
  remarks: "\\[[API セット: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\nawait Excel.run(async (context) => { \n    var binding = context.workbook.bindings.getItemAt(0);\n    var table = binding.getTable();\n    table.load('name');\n    await context.sync();\n\n    console.log(table.name);\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getTable(): Excel.Table;'
    return:
      type: <xref uid="excel!Excel.Table:class" />
      description: ''
- name: getText()
  uid: excel!Excel.Binding#getText:member(1)
  package: excel!
  fullName: getText()
  summary: バインドによって表されるテキストを返します。 バインドが正しい型ではない場合、エラーがスローされます。
  remarks: "\\[[API セット: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\nawait Excel.run(async (context) => { \n    var binding = context.workbook.bindings.getItemAt(0);\n    var text = binding.getText();\n    binding.load('text');\n    await context.sync();\n\n    console.log(text);\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getText(): OfficeExtension.ClientResult<string>;'
    return:
      type: <xref uid="office!OfficeExtension.ClientResult:class" />&lt;string&gt;
      description: ''
- name: load(options)
  uid: excel!Excel.Binding#load:member(1)
  package: excel!
  fullName: load(options)
  summary: オブジェクトの指定されたプロパティを読み込むコマンドを待ち行列に入れます。 プロパティを読み取る前に、`context.sync()` を呼び出す必要があります。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'load(options?: Excel.Interfaces.BindingLoadOptions): Excel.Binding;'
    parameters:
    - id: options
      description: 読み込むオブジェクトのプロパティのオプションを提供します。
      type: <xref uid="excel!Excel.Interfaces.BindingLoadOptions:interface" />
    return:
      type: <xref uid="excel!Excel.Binding:class" />
      description: ''
- name: load(propertyNames)
  uid: excel!Excel.Binding#load:member(2)
  package: excel!
  fullName: load(propertyNames)
  summary: オブジェクトの指定されたプロパティを読み込むコマンドを待ち行列に入れます。 プロパティを読み取る前に、`context.sync()` を呼び出す必要があります。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'load(propertyNames?: string | string[]): Excel.Binding;'
    parameters:
    - id: propertyNames
      description: 読み込むプロパティを指定するコンマ区切り文字列または文字列の配列。
      type: string | string[]
    return:
      type: <xref uid="excel!Excel.Binding:class" />
      description: "\n\n#### <a name=\"examples\"></a>例\n\n```typescript\nawait Excel.run(async (context) => { \n    var binding = context.workbook.bindings.getItemAt(0);\n    binding.load('type');\n    await context.sync();\n\n    console.log(binding.type);\n});\n```"
- name: load(propertyNamesAndPaths)
  uid: excel!Excel.Binding#load:member(3)
  package: excel!
  fullName: load(propertyNamesAndPaths)
  summary: オブジェクトの指定されたプロパティを読み込むコマンドを待ち行列に入れます。 プロパティを読み取る前に、`context.sync()` を呼び出す必要があります。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: >-
      load(propertyNamesAndPaths?: {
                  select?: string;
                  expand?: string;
              }): Excel.Binding;
    parameters:
    - id: propertyNamesAndPaths
      description: '`propertyNamesAndPaths.select` は、読 `propertyNamesAndPaths.expand` み込むプロパティを指定するコンマ区切りの文字列で、読み込むナビゲーション プロパティを指定するコンマ区切りの文字列です。'
      type: >-
        {
                    select?: string;
                    expand?: string;
                }
    return:
      type: <xref uid="excel!Excel.Binding:class" />
      description: ''
- name: toJSON()
  uid: excel!Excel.Binding#toJSON:member(1)
  package: excel!
  fullName: toJSON()
  summary: API オブジェクトを渡す際に、より有用な出力を提供するために JavaScript `toJSON()` メソッドをオーバーライドします。 `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->、順番に、渡される`toJSON`オブジェクトのメソッドを呼び出します。一方、元のExcel。Binding オブジェクトは API オブジェクトで、メソッド`toJSON`はプレーンな JavaScript オブジェクト (次のように入力) を返します。`Excel.Interfaces.BindingData`<!-- -->) は、元のオブジェクトから読み込まれた子プロパティの浅いコピーを含む。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'toJSON(): Excel.Interfaces.BindingData;'
    return:
      type: <xref uid="excel!Excel.Interfaces.BindingData:interface" />
      description: ''
