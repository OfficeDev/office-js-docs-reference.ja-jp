- name: setActivePage(PageName)
  uid: visio!Visio.Document#setActivePage:member(1)
  package: visio!
  fullName: setActivePage(PageName)
  summary: >-
    ドキュメントのアクティブ なページを設定します。


    \[[API セット: 1.1](/office/dev/add-ins/reference/overview/visio-javascript-reference-overview) \]
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'setActivePage(PageName: string): void;'
    parameters:
    - id: PageName
      description: ページの名前です。
      type: string
    return:
      type: void
      description: "\n\n#### <a name=\"examples\"></a>例\n\n```javascript\nVisio.run(session, function (ctx) {\n    var document = ctx.document;\n    var pageName = \"Page-1\";\n    document.setActivePage(pageName);\n    return ctx.sync();\n}).catch(function(error) {\n    console.log(\"Error: \" + error);\n    if (error instanceof OfficeExtension.Error) {\n        console.log(\"Debug info: \" + JSON.stringify(error.debugInfo));\n    }\n});\n```"
- name: showTaskPane(taskPaneType, initialProps, show)
  uid: visio!Visio.Document#showTaskPane:member(1)
  package: visio!
  fullName: showTaskPane(taskPaneType, initialProps, show)
  summary: >-
    TaskPane を表示または非表示にする。 これは、作業ウィンドウを表示/非表示Excel Visio 図面を埋め込む DV アプリやアドイン/その他のサード パーティ製アプリによって使用されます。


    \[[API セット: 1.1](/office/dev/add-ins/reference/overview/visio-javascript-reference-overview) \]
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'showTaskPane(taskPaneType: Visio.TaskPaneType, initialProps?: any, show?: boolean): void;'
    parameters:
    - id: taskPaneType
      description: 1st Party TaskPane の種類。 列挙型 TaskPaneType から値を取得できます。
      type: <xref uid="visio!Visio.TaskPaneType:enum" />
    - id: initialProps
      description: 省略可能なパラメーター。 これは、Taskpane のコンテンツを初期化するために必要な初期データで満たされる汎用データ構造です。
      type: any
    - id: show
      description: 省略可能なパラメーター。 false に設定すると、指定した taskpane が非表示になります。
      type: boolean
    return:
      type: void
      description: ''
- name: showTaskPane(taskPaneTypeString, initialProps, show)
  uid: visio!Visio.Document#showTaskPane:member(2)
  package: visio!
  fullName: showTaskPane(taskPaneTypeString, initialProps, show)
