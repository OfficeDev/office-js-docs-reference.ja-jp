- name: showTaskPane(taskPaneType, initialProps, show)
  uid: visio!Visio.Document#showTaskPane:member(1)
  package: visio!
  fullName: showTaskPane(taskPaneType, initialProps, show)
  summary: >-
    TaskPane を表示または非表示にする。 これは、作業ウィンドウを表示/非表示Excel Visio 図面を埋め込む DV アプリやアドイン/その他のサード パーティ製アプリによって使用されます。


    \[[API セット: 1.1](/office/dev/add-ins/reference/overview/visio-javascript-reference-overview) \]
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'showTaskPane(taskPaneType: Visio.TaskPaneType, initialProps?: any, show?: boolean): void;'
    parameters:
    - id: taskPaneType
      description: 1st Party TaskPane の種類。 列挙型 TaskPaneType から値を取得できます
      type: <xref uid="visio!Visio.TaskPaneType:enum" />
    - id: initialProps
      description: 省略可能なパラメーター。 これは、Taskpane のコンテンツを初期化するために必要な初期データで満たされる汎用データ構造です。
      type: any
    - id: show
      description: 省略可能なパラメーター。 false に設定すると、指定した taskpane が非表示になります。
      type: boolean
    return:
      type: void
      description: ''
