- name: load(options)
  uid: visio!Visio.CommentCollection#load:member(1)
  package: visio!
  fullName: load(options)
  summary: オブジェクトの指定されたプロパティを読み込むコマンドを待ち行列に入れます。 プロパティを読み取る前に、`context.sync()` を呼び出す必要があります。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'load(options?: Visio.Interfaces.CommentCollectionLoadOptions & Visio.Interfaces.CollectionLoadOptions): Visio.CommentCollection;'
    parameters:
    - id: options
      description: 読み込むオブジェクトのプロパティのオプションを提供します。
      type: <xref uid="visio!Visio.Interfaces.CommentCollectionLoadOptions:interface" /> & <xref uid="visio!Visio.Interfaces.CollectionLoadOptions:interface" />
    return:
      type: <xref uid="visio!Visio.CommentCollection:class" />
      description: "\n\n#### <a name=\"examples\"></a>例\n\n```javascript\nVisio.run(session, function (ctx) {\n    var activePage = ctx.document.getActivePage();\n    var shapeName = \"Position Belt.41\";\n    var shape = activePage.shapes.getItem(shapeName);\n    var shapeComments= shape.comments;\n    shapeComments.load([\"author\", \"text\"]);\n    return ctx.sync().then(function () {\n        for(var i = 0; i < shapeComments.items.length; i++)\n        {\n            var comment = shapeComments.items[i];\n            console.log(\"comment Author: \" + comment.author);\n            console.log(\"Comment Text: \" + comment.text);\n            console.log(\"Date \" + comment.date);\n        }\n    });\n}).catch(function(error) {\n    console.log(\"Error: \" + error);\n    if (error instanceof OfficeExtension.Error) {\n        console.log(\"Debug info: \" + JSON.stringify(error.debugInfo));\n    }\n});\n```"
