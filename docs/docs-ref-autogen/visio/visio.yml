functions:
- name: Visio.run(batch)
  uid: visio!Visio.run:function(1)
  package: visio!
  summary: 新しい要求コンテキストを使用して、Visioオブジェクト モデルに対してアクションを実行するバッチ スクリプトを実行します。 promise が解決されると、実行中に自動的に割り当てられた追跡対象オブジェクトが解放されます。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'export function run<T>(batch: (context: Visio.RequestContext) => Promise<T>): Promise<T>;'
    parameters:
    - id: batch
      description: オブジェクトを取り込むVisio。RequestContext と約束を返します (通常、"context.sync()"の結果だけです)。 context パラメーターは、アプリケーションへの要求を容易Visioします。 Office と Visio アプリケーションは 2 つの異なるプロセスで実行されますので、アドインから Visio オブジェクト モデルにアクセスするには、要求コンテキストが必要です。
      type: '(context: <xref uid="visio!Visio.RequestContext:class" />) =&gt; Promise&lt;T&gt;'
    return:
      type: Promise&lt;T&gt;
      description: ''
- name: Visio.run(object, batch)
  uid: visio!Visio.run:function(2)
  package: visio!
  summary: 以前に作成した API オブジェクトの要求コンテキストを使用して、Visio オブジェクト モデルに対してアクションを実行するバッチ スクリプトを実行します。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'export function run<T>(object: OfficeExtension.ClientObject | OfficeExtension.EmbeddedSession, batch: (context: Visio.RequestContext) => Promise<T>): Promise<T>;'
    parameters:
    - id: object
      description: 以前に作成された API オブジェクト。 バッチは、渡されたオブジェクトと同じ要求コンテキストを使用します。つまり、オブジェクトに適用された変更は "context.sync()" によって取得されます。
      type: <xref uid="office!OfficeExtension.ClientObject:class" /> | <xref uid="office!OfficeExtension.EmbeddedSession:class" />
    - id: batch
      description: オブジェクトを取り込むVisio。RequestContext と約束を返します (通常、"context.sync()"の結果だけです)。 promise が解決されると、実行中に自動的に割り当てられた追跡対象オブジェクトが解放されます。
      type: '(context: <xref uid="visio!Visio.RequestContext:class" />) =&gt; Promise&lt;T&gt;'
    return:
      type: Promise&lt;T&gt;
      description: ''
- name: Visio.run(objects, batch)
  uid: visio!Visio.run:function(3)
  package: visio!
  summary: 以前に作成した API オブジェクトの要求コンテキストを使用して、Visioオブジェクト モデルに対してアクションを実行するバッチ スクリプトを実行します。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'export function run<T>(objects: OfficeExtension.ClientObject[], batch: (context: Visio.RequestContext) => Promise<T>): Promise<T>;'
    parameters:
    - id: objects
      description: 以前に作成された API オブジェクトの配列。 配列が検証され、すべてのオブジェクトが同じコンテキストを共有します。 バッチは、この共有要求コンテキストを使用します。つまり、これらのオブジェクトに適用される変更は "context.sync()" によって取得されます。
      type: <xref uid="office!OfficeExtension.ClientObject:class" />[]
    - id: batch
      description: 1 つの関数を取り込Visio。RequestContext と約束を返します (通常、"context.sync()"の結果だけです)。 promise が解決されると、実行中に自動的に割り当てられた追跡対象オブジェクトが解放されます。
      type: '(context: <xref uid="visio!Visio.RequestContext:class" />) =&gt; Promise&lt;T&gt;'
    return:
      type: Promise&lt;T&gt;
      description: ''
- name: Visio.run(contextObject, batch)
  uid: visio!Visio.run:function(4)
  package: visio!
  summary: 以前に作成したオブジェクトの RequestContext を使用して、Visio オブジェクト モデルに対してアクションを実行するバッチ スクリプトを実行します。 promise が解決されると、実行中に自動的に割り当てられた追跡対象オブジェクトが解放されます。
  remarks: >-
    このシグネチャに加えて、メソッドには次の署名も含まれます。


    `run<T>(batch: (context: Visio.RequestContext) => Promise<T>): Promise<T>;`


    `run<T>(object: OfficeExtension.ClientObject | OfficeExtension.EmbeddedSession, batch: (context: Visio.RequestContext) => Promise<T>): Promise<T>;`


    `run<T>(objects: OfficeExtension.ClientObject[], batch: (context: Visio.RequestContext) => Promise<T>): Promise<T>;`
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'export function run<T>(contextObject: OfficeExtension.ClientRequestContext, batch: (context: Visio.RequestContext) => Promise<T>): Promise<T>;'
    parameters:
    - id: contextObject
      description: 以前に作成されたVisio。RequestContext。 このコンテキストは、(新しいコンテキストを作成する代わりに) バッチ関数によって再使用されます。 つまり、これらのオブジェクトが同じコンテキストから派生した場合、バッチは既存の API オブジェクトに加えた変更を取得できます。
      type: <xref uid="office!OfficeExtension.ClientRequestContext:class" />
    - id: batch
      description: RequestContext を取り込み、約束を返す関数 (通常、"context.sync()" の結果だけです)。 context パラメーターは、アプリケーションへの要求を容易Visioします。 Office と Visio アプリケーションは 2 つの異なるプロセスで実行されますので、アドインから Visio オブジェクト モデルにアクセスするには RequestContext が必要です。
      type: '(context: <xref uid="visio!Visio.RequestContext:class" />) =&gt; Promise&lt;T&gt;'
    return:
      type: Promise&lt;T&gt;
      description: ''
