### YamlMime:TSType
name: Office.BeforeDocumentCloseNotification
uid: office!Office.BeforeDocumentCloseNotification:interface
package: office!
fullName: Office.BeforeDocumentCloseNotification
summary: ユーザーがドキュメントを閉じるときに表示されるモーダル通知ダイアログを表します。 ドキュメントは、ユーザーが応答するまで閉じない。 通知ダイアログを使用すると、ユーザーは要求を確認してドキュメントを閉じるか、要求をキャンセルしてドキュメントを閉じできます。
remarks: '\[[API セット: SharedRuntime BETA (プレビューのみ)](/office/dev/add-ins/reference/javascript-api-for-office) \]'
isPreview: true
isDeprecated: false
type: interface
methods:
- name: disable()
  uid: office!Office.BeforeDocumentCloseNotification#disable:member(1)
  package: office!
  fullName: disable()
  summary: ユーザーがドキュメントを閉じしようとすると、通知ダイアログが表示されません。
  remarks: '\[[API セット: SharedRuntime BETA (プレビューのみ)](/office/dev/add-ins/reference/javascript-api-for-office) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'disable(): Promise<void>;'
    return:
      type: Promise&lt;void&gt;
      description: ''
- name: enable()
  uid: office!Office.BeforeDocumentCloseNotification#enable:member(1)
  package: office!
  fullName: enable()
  summary: ユーザーがドキュメントを閉じるときに表示されるモーダル通知ダイアログを有効にする。 ドキュメントは、ユーザーが応答するまで閉じない。 この通知ダイアログでは、ユーザーにドキュメントを閉じる要求を確認するか、要求をキャンセルしてドキュメントを閉じるかの確認を求めるメッセージが表示されます。
  remarks: '\[[API セット: SharedRuntime BETA (プレビューのみ)](/office/dev/add-ins/reference/javascript-api-for-office) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'enable(): Promise<void>;'
    return:
      type: Promise&lt;void&gt;
      description: ''
- name: onCloseActionCancelled(listener)
  uid: office!Office.BeforeDocumentCloseNotification#onCloseActionCancelled:member(1)
  package: office!
  fullName: onCloseActionCancelled(listener)
  summary: 閉じる操作がキャンセルされた場合を検出する `BeforeDocumentCloseNotification` イベント ハンドラーを追加します。 このイベント ハンドラーは、次のいずれかの条件が満たされた場合にトリガーされます。1。 通知ダイアログが開いていると、エンド ユーザーはダイアログ内の [閉じない] ボタンをクリックするか、ダイアログの右上隅にある [閉じる] ボタンをクリックするか、Esc キーを押します。 2. アドインがオブジェクトのメソッド `enable` を呼び出す `BeforeDocumentCloseNotification` 場合。
  remarks: '\[[API セット: SharedRuntime BETA (プレビューのみ)](/office/dev/add-ins/reference/javascript-api-for-office) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: >-
      onCloseActionCancelled(
                  listener: () => void
              ): Promise<() => Promise<void>>;
    parameters:
    - id: listener
      description: ダイアログが取り消された場合に呼び出されるイベント ハンドラー。
      type: () =&gt; void
    return:
      type: Promise&lt;() =&gt; Promise&lt;void&gt;&gt;
      description: イベント ハンドラーが追加された場合に解決される約束。
