### YamlMime:TSType
name: Office.DialogParentMessageReceivedEventArgs
uid: office!Office.DialogParentMessageReceivedEventArgs:interface
package: office!
fullName: Office.DialogParentMessageReceivedEventArgs
summary: >-
  イベントを発生した親ページからのメッセージに関する情報を提供 `DialogParentMessageReceived` します。


  イベントのイベント ハンドラーを追加するには`DialogParentMessageReceived`、イベント のメソッド`addHandlerAsync`を使用Office[。UI](xref:office!Office.UI:interface) オブジェクト。
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: message
  uid: office!Office.DialogParentMessageReceivedEventArgs#message:member
  package: office!
  fullName: message
  summary: 親ページから送信されるメッセージの内容を取得します。これは、任意の文字列または文字列化されたデータを指定できます。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'message: string;'
    return:
      type: string
- name: origin
  uid: office!Office.DialogParentMessageReceivedEventArgs#origin:member
  package: office!
  fullName: origin
  summary: 呼び出された親ページのドメインを取得します。 `Dialog.messageChild`<!-- -->.
  remarks: '**要件セット**: [DialogOrigin 1.1](https://docs.microsoft.com/javascript/api/requirement-sets/common/dialog-origin-requirement-sets)<!-- -->. このプロパティは、 `undefined` この要件セットをサポートしていないクライアント上にあります。'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'origin: string | undefined;'
    return:
      type: string | undefined
- name: type
  uid: office!Office.DialogParentMessageReceivedEventArgs#type:member
  package: office!
  fullName: type
  summary: プロパティを取得[Office。発生した](xref:office!Office.EventType:enum)イベントの種類を識別する EventType 列挙値。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'type: EventType;'
    return:
      type: <xref uid="office!Office.EventType:enum" />
