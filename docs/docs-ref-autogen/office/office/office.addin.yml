isDeprecated: false
type: interface
properties:
- name: beforeDocumentCloseNotification
  uid: office!Office.Addin#beforeDocumentCloseNotification:member
  package: office!
  fullName: beforeDocumentCloseNotification
  summary: ユーザーがドキュメントを閉じるときに表示されるモーダル通知ダイアログを表します。 ドキュメントは、ユーザーが応答するまで閉じない。
  remarks: '\[[API セット: SharedRuntime BETA (プレビューのみ)](/office/dev/add-ins/reference/javascript-api-for-office) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'beforeDocumentCloseNotification: BeforeDocumentCloseNotification;'
    return:
      type: <xref uid="office!Office.BeforeDocumentCloseNotification:interface" />
methods:
- name: getStartupBehavior()
  uid: office!Office.Addin#getStartupBehavior:member(1)
  package: office!
  fullName: getStartupBehavior()
  summary: アドインの現在の起動動作を取得します。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getStartupBehavior(): Promise<Office.StartupBehavior>;'
    return:
      type: Promise&lt;<xref uid="office!Office.StartupBehavior:enum" />&gt;
      description: ''
- name: hide()
  uid: office!Office.Addin#hide:member(1)
  package: office!
  fullName: hide()
  summary: 作業ウィンドウを非表示にします。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'hide(): Promise<void>;'
    return:
      type: Promise&lt;void&gt;
      description: UI が非表示のときに解決される約束。
- name: onVisibilityModeChanged(listener)
  uid: office!Office.Addin#onVisibilityModeChanged:member(1)
  package: office!
  fullName: onVisibilityModeChanged(listener)
  summary: イベントのリスナーを追加 `onVisibilityModeChanged` します。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: >-
      onVisibilityModeChanged(
                  listener: (message: VisibilityModeChangedMessage) => void,
              ): Promise<() => Promise<void>>;
    parameters:
    - id: listener
      description: イベントが出力される際に呼び出されるリスナー関数。 この関数は、受信コンポーネントのメッセージを受け取ります。
      type: '(message: <xref uid="office!Office.VisibilityModeChangedMessage:interface" />) =&gt; void'
    return:
      type: Promise&lt;() =&gt; Promise&lt;void&gt;&gt;
      description: リスナーが追加された場合に関数に解決される約束。 呼び出してリスナーを削除します。
- name: setStartupBehavior(behavior)
  uid: office!Office.Addin#setStartupBehavior:member(1)
  package: office!
  fullName: setStartupBehavior(behavior)
  summary: 次回ドキュメントを開く際のアドインの起動動作を設定します。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'setStartupBehavior(behavior: Office.StartupBehavior): Promise<void>;'
    parameters:
    - id: behavior
      description: アドインの起動動作を指定します。
      type: <xref uid="office!Office.StartupBehavior:enum" />
    return:
      type: Promise&lt;void&gt;
      description: ''
