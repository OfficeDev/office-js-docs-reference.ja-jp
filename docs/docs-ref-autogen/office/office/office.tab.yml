### YamlMime:TSType
name: Office.Tab
uid: office!Office.Tab:interface
package: office!
fullName: Office.Tab
summary: 個々のタブと、それが持つ必要がある状態を表します。 コード例については、「Enable [and Disable Add-in Commands](https://docs.microsoft.com/office/dev/add-ins/design/disable-add-in-commands) and [Create custom contextual tabs」を参照してください。](https://docs.microsoft.com/office/dev/add-ins/design/contextual-tabs)<!-- -->.
remarks: '**要件セット**: [RibbonAPI 1.1](https://docs.microsoft.com/javascript/api/requirement-sets/common/ribbon-api-requirement-sets)'
isPreview: false
isDeprecated: false
type: interface
properties:
- name: controls
  uid: office!Office.Tab#controls:member
  package: office!
  fullName: controls
  summary: メニュー項目、ボタンなど、タブ内の 1 つ以上のコントロールを指定します。
  remarks: オブジェクトが`Tab`オブジェクトの一部[Office。RibbonUpdaterData](xref:office!Office.RibbonUpdaterData:interface) オブジェクトは、オブジェクトのメソッド`requestUpdate`に[渡Office。リボン](xref:office!Office.Ribbon:interface)<!-- -->このプロパティは、有効な状態を変更するコントロールの ID を指定します。 ただし、タブにプロパティ `groups` がある `controls` 場合、このプロパティは無視され、指定したグループのプロパティを使用して有効な状態を変更する必要があります。
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'controls?: Control[];'
    return:
      type: <xref uid="office!Office.Control:interface" />[]
- name: groups
  uid: office!Office.Tab#groups:member
  package: office!
  fullName: groups
  summary: タブ上の 1 つ以上のコントロール グループを指定します。
  remarks: >-
    オブジェクトが`Tab`オブジェクトの一部[Office。RibbonUpdaterData](xref:office!Office.RibbonUpdaterData:interface) オブジェクトは、オブジェクトのメソッド`requestUpdate`に[渡Office。リボン](xref:office!Office.Ribbon:interface)<!-- -->、さまざまな`controls`プロパティのプロパティOffice[。グループ オブジェクト](xref:office!Office.Group:interface)は、有効な状態が変更されたコントロールを指定します。オブジェクト`controls`のプロパティは`Tab`無視されます。


    **要件セット**: [RibbonAPI 1.1](https://docs.microsoft.com/javascript/api/requirement-sets/common/ribbon-api-requirement-sets)
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'groups?: Group[];'
    return:
      type: <xref uid="office!Office.Group:interface" />[]
- name: id
  uid: office!Office.Tab#id:member
  package: office!
  fullName: id
  summary: マニフェストで指定されたタブの識別子。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'id: string;'
    return:
      type: string
- name: visible
  uid: office!Office.Tab#visible:member
  package: office!
  fullName: visible
  summary: タブをリボンに表示するかどうかを指定します。 コンテキスト タブでのみ使用されます。
  remarks: '**要件セット**: [RibbonAPI 1.2](https://docs.microsoft.com/javascript/api/requirement-sets/common/ribbon-api-requirement-sets)'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'visible?: boolean;'
    return:
      type: boolean
