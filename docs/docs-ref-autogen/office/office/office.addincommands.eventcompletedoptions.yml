- name: allowEvent
  uid: office!Office.AddinCommands.EventCompletedOptions#allowEvent:member
  package: office!
  fullName: allowEvent
  summary: ブール値。 completed メソッドを使用してイベント ハンドラーの完了を知る場合、この値は、処理されたイベントの実行を続行するか、取り消す必要があるかどうかを示します。 たとえば、イベントを処理する `ItemSend` `allowEvent` `false` アドインは、メッセージの送信をキャンセルするために設定できます。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'allowEvent: boolean;'
    return:
      type: boolean
- name: errorMessage
  uid: office!Office.AddinCommands.EventCompletedOptions#errorMessage:member
  package: office!
  fullName: errorMessage
  summary: >-
    文字列値。 completed メソッドを使用してイベント ハンドラーの完了 `allowEvent` を知る場合、およびオプションがに設定されている場合 `false`<!-- -->、この値は、ユーザーに表示されるエラー メッセージを設定します。 例については、「Smart Alerts の [チュートリアル」を参照してください。](https://docs.microsoft.com/office/dev/add-ins/outlook/smart-alerts-onmessagesend-walkthrough)<!-- -->.


    \[[API セット: メールボックス のプレビュー](/office/dev/add-ins/reference/javascript-api-for-office) \]
