### YamlMime:TSType
name: Office.Control
uid: office!Office.Control:interface
package: office!
fullName: Office.Control
summary: >-
  個々のコントロールまたはコマンドと、そのコントロールに必要な状態を表します。


  オブジェクトとそのプロパティを使用する方法を `Control` 示すコード サンプルについては、「 [Enable and Disable Add-in Commands and Create](https://docs.microsoft.com/office/dev/add-ins/design/disable-add-in-commands) custom contextual tabs」 [を参照してください。](https://docs.microsoft.com/office/dev/add-ins/design/contextual-tabs)<!-- -->.
remarks: '**要件セット**: [RibbonAPI 1.1](https://docs.microsoft.com/office/dev/add-ins/reference/requirement-sets/ribbon-api-requirement-sets)'
isPreview: false
isDeprecated: false
type: interface
properties:
- name: enabled
  uid: office!Office.Control#enabled:member
  package: office!
  fullName: enabled
  summary: コントロールを有効または無効にするかどうかを示します。 既定値は true です。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'enabled?: boolean;'
    return:
      type: boolean
- name: id
  uid: office!Office.Control#id:member
  package: office!
  fullName: id
  summary: マニフェストで指定されたコントロールの識別子。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'id: string;'
    return:
      type: string
