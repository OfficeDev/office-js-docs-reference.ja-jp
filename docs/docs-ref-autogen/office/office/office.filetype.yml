- name: 圧縮
  uid: office!Office.FileType.Compressed:member
  package: office!
  summary: >-
    文書全体 (.pptx、.docx、.xlsx、.xlsm) をバイト配列として Office Open XML (OOXML) 形式で返します。


    注: .xslm ファイルの種類は、Excel Mac Windowsサポートされています。 この機能は、Excel on the web。 このExcel、Windows`getFileAsync`のファイル スライスには、.xslm ファイルの種類の VBA 署名ファイルが含まれます。 VBA 署名ファイルは、vbaProjectSignature.bin、vbaProbjectSignatureAgile.bin、vbaProjectSignatureV3.bin です。 Mac Excelでは`getFileAsync`、このプラットフォームは VBA 署名機能をサポートしないので、メソッドのファイル スライスには VBA 署名ファイルは含めないので、
