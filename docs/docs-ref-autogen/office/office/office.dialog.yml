### YamlMime:TSType
name: Office.Dialog
uid: office!Office.Dialog:interface
package: office!
fullName: Office.Dialog
summary: 呼び出された場合に返される `UI.displayDialogAsync` オブジェクト。 イベント ハンドラーを登録し、ダイアログを閉じるメソッドを公開します。
remarks: '**要件セット**: [DialogAPI](https://docs.microsoft.com/javascript/api/requirement-sets/common/dialog-api-requirement-sets)'
isPreview: false
isDeprecated: false
type: interface
methods:
- name: addEventHandler(eventType, handler)
  uid: office!Office.Dialog#addEventHandler:member(1)
  package: office!
  fullName: addEventHandler(eventType, handler)
  summary: >-
    イベント ハンドラーを登録します。 サポートされているイベントは次の 2 つです。


    - DialogMessageReceived。 ダイアログ ボックスがメッセージを親に送信すると発生します。


    - DialogEventReceived。 ダイアログ ボックスが閉じられたとき、またはアンロードされたときに発生します。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'addEventHandler(eventType: Office.EventType, handler: (args: {message: string, origin: string | undefined} | {error: number}) => void): void;'
    parameters:
    - id: eventType
      description: DialogMessageReceived または DialogEventReceived のいずれかである必要があります。
      type: <xref uid="office!Office.EventType:enum" />
    - id: handler
      description: プロパティを持つオブジェクトを受け入`message``origin`れる関数 (if `eventType` is)`DialogMessageReceived`<!-- -->、またはプロパティを持つ `error` オブジェクト (if `eventType` is `DialogEventReceived`<!-- -->. このプロパティは`origin`、`undefined`[DialogOrigin 1.1](https://docs.microsoft.com/javascript/api/requirement-sets/common/dialog-origin-requirement-sets) をサポートしないクライアント上にあります。<!-- -->.
      type: '(args: {message: string, origin: string | undefined} | {error: number}) =&gt; void'
    return:
      type: void
      description: ''
- name: close()
  uid: office!Office.Dialog#close:member(1)
  package: office!
  fullName: close()
  summary: >-
    対応するダイアログ ボックスを閉じるために親ページから呼び出されます。


    このメソッドは非同期です。 コールバック パラメーターは受け取らないし、Promise `await` オブジェクトを返すので、キーワードまたは関数で待つ必要 `then` はありません。 詳細については、次のベスト プラクティスを参照してください。 1 つを閉じる [とすぐに別のダイアログを開く](https://docs.microsoft.com/office/dev/add-ins/develop/dialog-best-practices#opening-another-dialog-immediately-after-closing-one)
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'close(): void;'
    return:
      type: void
      description: ''
- name: messageChild(message, messageOptions)
  uid: office!Office.Dialog#messageChild:member(1)
  package: office!
  fullName: messageChild(message, messageOptions)
  summary: 作業ウィンドウや UI レス関数ファイルなどのホスト ページから、ページから開いたダイアログにメッセージを配信します。
  remarks: >-
    **ホスト**: Excel、Outlook (最小要件セット: メールボックス 1.9)、PowerPoint Word


    **要件セット**:


    - [DialogAPI 1.2](https://docs.microsoft.com/javascript/api/requirement-sets/common/dialog-api-requirement-sets)


    - [Mailbox 1.9](https://docs.microsoft.com/javascript/api/requirement-sets/outlook/outlook-api-requirement-sets)


    - パラメーターを `messageOptions` 使用する場合は [、DialogOrigin 1.1](https://docs.microsoft.com/javascript/api/requirement-sets/common/dialog-origin-requirement-sets) も必要です。
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'messageChild(message: string, messageOptions?: DialogMessageOptions): void;'
    parameters:
    - id: message
      description: ホスト ページからダイアログに配信するメッセージを受け入れる。 JSON や XML を含む文字列にシリアル化できる情報は、何でも送信できます。
      type: string
    - id: messageOptions
      description: 省略可能。 メッセージを送信する方法のオプションを提供します。
      type: <xref uid="office!Office.DialogMessageOptions:interface" />
    return:
      type: void
      description: ''
- name: sendMessage(name)
  uid: office!Office.Dialog#sendMessage:member(1)
  package: office!
  fullName: sendMessage(name)
  summary: 内部使用のみ。 コードを呼び出す必要はありません。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'sendMessage(name: string): void;'
    parameters:
    - id: name
      description: ''
      type: string
    return:
      type: void
      description: ''
