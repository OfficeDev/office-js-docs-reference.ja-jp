  - name: 'addHandlerAsync(eventType, handler, callback)'
    uid: 'office!Office.Binding#addHandlerAsync:member(2)'
    package: office!
    fullName: 'addHandlerAsync(eventType, handler, callback)'
    summary: '指定したオブジェクトのオブジェクトにイベント ハンドラーを追加[Office。EventType](xref:office!Office.EventType:enum)<!-- -->. サポートされている EventType は次 `Office.EventType.BindingDataChanged` のとおりです。 `Office.EventType.BindingSelectionChanged`<!-- -->.'
    remarks: |-
      **要件セット**: [BindingEvents](https://docs.microsoft.com/office/dev/add-ins/reference/requirement-sets/office-add-in-requirement-sets#bindingevents)

      各イベント ハンドラー関数の名前が一意である限り、指定した eventType に対して複数のイベント ハンドラーを追加できます。

      #### <a name="examples"></a>例

      ```javascript
      // The following code sample calls the select method of the Office object to access the binding
      // with ID "MyBinding", and then calls the addHandlerAsync method to add a handler function 
      // for the bindingDataChanged event of that binding.
      function addEventHandlerToBinding() {
          Office.select("bindings#MyBinding").addHandlerAsync(
              Office.EventType.BindingDataChanged, onBindingDataChanged);
      }

      function onBindingDataChanged(eventArgs) {
          write("Data has changed in binding: " + eventArgs.binding.id);
      }

      // Function that writes to a div with id='message' on the page.
      function write(message){
          document.getElementById('message').innerText += message; 
      }
      ```
      ```javascript
      // To add an event handler for the BindingSelectionChanged event of a binding, 
      // use the addHandlerAsync method of the Binding object.
      // The event handler receives an argument of type BindingSelectionChangedEventArgs.
      function addEventHandlerToBinding() {
          Office.select("bindings#MyBinding").addHandlerAsync(
              Office.EventType.BindingSelectionChanged, onBindingSelectionChanged);
      }

      function onBindingSelectionChanged(eventArgs) {
          write(eventArgs.binding.id + " has been selected.");
      }
      // Function that writes to a div with id='message' on the page.
      function write(message){
          document.getElementById('message').innerText += message; 
      }
      ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'addHandlerAsync(eventType: Office.EventType、 handler: any, callback?: (result: Office.AsyncResult <void> ) => void): void;'
      parameters:
        - id: eventType
          description: イベントの種類。 バインドの場合は、 `Office.EventType.BindingDataChanged``Office.EventType.BindingSelectionChanged`<!-- -->.
          type: '<xref uid="office!Office.EventType:enum" />'
        - id: handler
          description: '追加するイベント ハンドラー関数で、パラメーターの種類は[Office。BindingDataChangedEventArgs](xref:office!Office.BindingDataChangedEventArgs:interface)または[Office。BindingSelectionChangedEventArgs](xref:office!Office.BindingSelectionChangedEventArgs:interface)<!-- -->.'
          type: any
        - id: callback
          description: '省略可能です。 コールバックが返された場合に呼び出される関数で、そのパラメーターはパラメーターの種類[Office。AsyncResult](xref:office!Office.AsyncResult:interface)<!-- -->.'
          type: '(result: <xref uid="office!Office.AsyncResult:interface" />&lt;void&gt;) =&gt; void'
      return:
        type: void
        description: ''
  - name: 'getDataAsync(options, callback)'
    uid: 'office!Office.Binding#getDataAsync:member(1)'
    package: office!
    fullName: 'getDataAsync(options, callback)'
    summary: バインド内に含まれるデータを返します。
    remarks: |-
      **要件セット**:

      - [HtmlCoercion](https://docs.microsoft.com/office/dev/add-ins/reference/requirement-sets/office-add-in-requirement-sets#htmlcoercion) (使用する場合) `Office.CoercionType.Html`<!-- -->)

      - [MatrixBindings](https://docs.microsoft.com/office/dev/add-ins/reference/requirement-sets/office-add-in-requirement-sets#matrixbindings)

      - [MatrixCoercion](https://docs.microsoft.com/office/dev/add-ins/reference/requirement-sets/office-add-in-requirement-sets#matrixcoercion) (使用する場合) `Office.CoercionType.Matrix`<!-- -->)

      - [OoxmlCoercion](https://docs.microsoft.com/office/dev/add-ins/reference/requirement-sets/office-add-in-requirement-sets#ooxmlcoercion) (使用する場合) `Office.CoercionType.Ooxml`<!-- -->)

      - [TableBindings](https://docs.microsoft.com/office/dev/add-ins/reference/requirement-sets/office-add-in-requirement-sets#tablebindings)

      - [TableCoercion](https://docs.microsoft.com/office/dev/add-ins/reference/requirement-sets/office-add-in-requirement-sets#tablecoercion) (使用する場合) `Office.CoercionType.Table`<!-- -->)

      - [TextBindings](https://docs.microsoft.com/office/dev/add-ins/reference/requirement-sets/office-add-in-requirement-sets#textbindings)

      - [TextCoercion](https://docs.microsoft.com/office/dev/add-ins/reference/requirement-sets/office-add-in-requirement-sets#textcoercion) (使用する場合) `Office.CoercionType.Text`<!-- -->)

      MatrixBinding または TableBinding から呼び出された場合、オプションの startRow、startColumn、rowCount、および columnCount パラメーターが指定されている場合、getDataAsync メソッドはバインドされた値のサブセットを返します (および、連続した有効な範囲を指定します)。
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'getDataAsync <T> (options?: GetBindingDataOptions, callback?: (result: AsyncResult <T> ) => void): void;'
      parameters:
        - id: options
          description: バインド内のデータを取得する方法のオプションを提供します。
          type: '<xref uid="office!Office.GetBindingDataOptions:interface" />'
        - id: callback
          description: '省略可能です。 コールバックが返された場合に呼び出される関数で、そのパラメーターはパラメーターの種類[Office。AsyncResult](xref:office!Office.AsyncResult:interface)<!-- -->. 結果 `value` のプロパティは、指定されたバインドの値です。 パラメーターが指定されている場合 (呼び出しが成功した場合)、データは CoercionType 列挙のトピックで説明されている形式 `coercionType` で返されます。'
          type: '(result: <xref uid="office!Office.AsyncResult:interface" />&lt;T&gt;) =&gt; void'
      return:
        type: void
        description: ''
  - name: getDataAsync(callback)
    uid: 'office!Office.Binding#getDataAsync:member(2)'
    package: office!
    fullName: getDataAsync(callback)
    summary: バインド内に含まれるデータを返します。
    remarks: |-
      **要件セット**:

      - [HtmlCoercion](https://docs.microsoft.com/office/dev/add-ins/reference/requirement-sets/office-add-in-requirement-sets#htmlcoercion) (使用する場合) `Office.CoercionType.Html`<!-- -->)

      - [MatrixBindings](https://docs.microsoft.com/office/dev/add-ins/reference/requirement-sets/office-add-in-requirement-sets#matrixbindings)

      - [MatrixCoercion](https://docs.microsoft.com/office/dev/add-ins/reference/requirement-sets/office-add-in-requirement-sets#matrixcoercion) (使用する場合) `Office.CoercionType.Matrix`<!-- -->)

      - [OoxmlCoercion](https://docs.microsoft.com/office/dev/add-ins/reference/requirement-sets/office-add-in-requirement-sets#ooxmlcoercion) (使用する場合) `Office.CoercionType.Ooxml`<!-- -->)

      - [TableBindings](https://docs.microsoft.com/office/dev/add-ins/reference/requirement-sets/office-add-in-requirement-sets#tablebindings)

      - [TableCoercion](https://docs.microsoft.com/office/dev/add-ins/reference/requirement-sets/office-add-in-requirement-sets#tablecoercion) (使用する場合) `Office.CoercionType.Table`<!-- -->)

      - [TextBindings](https://docs.microsoft.com/office/dev/add-ins/reference/requirement-sets/office-add-in-requirement-sets#textbindings)

      - [TextCoercion](https://docs.microsoft.com/office/dev/add-ins/reference/requirement-sets/office-add-in-requirement-sets#textcoercion) (使用する場合) `Office.CoercionType.Text`<!-- -->)

      MatrixBinding または TableBinding から呼び出された場合、オプションの startRow、startColumn、rowCount、および columnCount パラメーターが指定されている場合、getDataAsync メソッドはバインドされた値のサブセットを返します (および、連続した有効な範囲を指定します)。

      #### <a name="examples"></a>例

      ```javascript
      function showBindingData() {
          Office.select("bindings#MyBinding").getDataAsync(function (asyncResult) {
              write(asyncResult.value)
          });
      }

      // Function that writes to a div with id='message' on the page.
      function write(message){
          document.getElementById('message').innerText += message; 
      }

      // There is an important difference in behavior between using the "table" and "matrix" coercionType with the
      // Binding.getDataAsync method, with respect to data formatted with header rows, as shown in the following
      // two examples. These code examples show event handler functions for the Binding.SelectionChanged event.

      // If you specify the "table" coercionType, the TableData.rows property ( result.value.rows in the following
      // code example) returns an array that contains only the body rows of the table. So, its 0th row will be the
      // first non-header row in the table.
      function selectionChanged(evtArgs) { 
          Office.select("bindings#TableTranslate").getDataAsync(
              { coercionType: 'table', 
                startRow: evtArgs.startRow, 
                startCol: 0, 
                rowCount: 1, 
                columnCount: 1 },  
              function (result) { 
                  if (result.status == 'succeeded') { 
                      write("Image to find: " + result.value.rows[0][0]); 
                  } 
                  else 
                      write(result.error.message); 
          }); 
      }     
      // Function that writes to a div with id='message' on the page. 
      function write(message){ 
          document.getElementById('message').innerText += message; 
      }

      // However, if you specify the "matrix" coercionType, result.value in the following code example returns an array
      // that contains the table header in the 0th row. If the table header contains multiple rows, then these are all
      // included in the result.value matrix as separate rows before the table body rows are included.
      function selectionChanged(evtArgs) { 
          Office.select("bindings#TableTranslate").getDataAsync(
              { coercionType: 'matrix', 
                startRow: evtArgs.startRow, 
                startCol: 0, 
                rowCount: 1, 
                columnCount: 1 },  
              function (result) { 
                  if (result.status == 'succeeded') { 
                      write("Image to find: " + result.value[1][0]); 
                  } 
                  else 
                      write(result.error.message); 
          }); 
      }     
      // Function that writes to a div with id='message' on the page. 
      function write(message){ 
          document.getElementById('message').innerText += message; 
      }
      ```
    isPreview: false
    isDeprecated: false
    syntax:
      content: 'getDataAsync <T> (callback?: (result: AsyncResult <T> ) => void;'
      parameters:
        - id: callback
          description: '省略可能です。 コールバックが返された場合に呼び出される関数で、そのパラメーターはパラメーターの種類[Office。AsyncResult](xref:office!Office.AsyncResult:interface)<!-- -->. 結果 `value` のプロパティは、指定されたバインドの値です。 パラメーターが指定されている場合 (呼び出しが成功した場合)、データは CoercionType 列挙のトピックで説明されている形式 `coercionType` で返されます。'
          type: '(result: <xref uid="office!Office.AsyncResult:interface" />&lt;T&gt;) =&gt; void'
      return:
        type: void
        description: ''
