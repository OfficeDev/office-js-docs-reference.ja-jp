methods:
- name: add(key, value)
  uid: excel!Excel.WorksheetCustomPropertyCollection#add:member(1)
  package: excel!
  fullName: add(key, value)
  summary: 指定されたキーにマップする新しいカスタム プロパティを追加します。 これにより、既存のカスタム プロパティをそのキーで上書きします。
  remarks: >-
    \[[API セット: ExcelApi 1.12](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/26-document/custom-properties.yaml

    await Excel.run(async (context) => {
      // Get the key/value pair from the task pane.
      const userKey = $("#key").text();
      const userValue = $("#value").text();

      // Add the custom property.
      const customWorksheetProperties = context.workbook.worksheets.getActiveWorksheet().customProperties;
      customWorksheetProperties.add(userKey, userValue);

      await context.sync();

      console.log(`Successfully set custom worksheet property ${userKey}:${userValue}.`);
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'add(key: string, value: string): Excel.WorksheetCustomProperty;'
    parameters:
    - id: key
      description: カスタム プロパティ オブジェクトを識別するキー。 大文字と小文字は区別されません。キーは 255 文字に制限されています (値を大きくすると、エラー `InvalidArgument` がスローされます)。
      type: string
    - id: value
      description: このカスタム プロパティの値。
      type: string
    return:
      type: <xref uid="excel!Excel.WorksheetCustomProperty:class" />
      description: ''
