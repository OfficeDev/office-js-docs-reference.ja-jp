    return:
      type: <xref uid="excel!Excel.DataChangeType:enum" /> | "Unknown" | "RangeEdited" | "RowInserted" | "RowDeleted" | "ColumnInserted" | "ColumnDeleted" | "CellInserted" | "CellDeleted"
- name: details
  uid: excel!Excel.WorksheetChangedEventArgs#details:member
  package: excel!
  fullName: details
  summary: 変更の詳細に関する情報を表します。 このプロパティは、変更されたイベントが 1 つのセルでトリガーされた場合に取得できます。 変更されたイベントが複数のセルでトリガーされる場合、このプロパティを取得できません。
  remarks: >-
    \[[API セット: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```typescript

    // This function would be used as an event handler for the Worksheet.onChanged event.

    async function onWorksheetChanged(eventArgs) {
        await Excel.run(async (context) => {
            var details = eventArgs.details;
            var address = eventArgs.address;

            // Print the before and after types and values to the console.
            console.log(`Change at ${address}: was ${details.valueBefore}(${details.valueTypeBefore}),`
                + ` now is ${details.valueAfter}(${details.valueTypeAfter})`);
            await context.sync();
        });
    }

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'details: Excel.ChangedEventDetail;'
    return:
      type: <xref uid="excel!Excel.ChangedEventDetail:interface" />
