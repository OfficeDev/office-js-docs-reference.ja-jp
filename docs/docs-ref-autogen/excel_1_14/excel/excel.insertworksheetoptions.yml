### YamlMime:TSType
name: Excel.InsertWorksheetOptions
uid: excel!Excel.InsertWorksheetOptions:interface
package: excel!
fullName: Excel.InsertWorksheetOptions
summary: 挿入するワークシートとブック内の新しいワークシートの挿入場所を定義するオプション。
remarks: '\[[API セット: ExcelApi 1.13](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: false
isDeprecated: false
type: interface
properties:
- name: positionType
  uid: excel!Excel.InsertWorksheetOptions#positionType:member
  package: excel!
  fullName: positionType
  summary: 新しいワークシートの現在のブック内の挿入位置。 詳細は「`Excel.WorksheetPositionType`」をご覧ください。 既定の位置は "End" です。
  remarks: '\[[API セット: ExcelApi 1.13](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'positionType?: Excel.WorksheetPositionType | "None" | "Before" | "After" | "Beginning" | "End";'
    return:
      type: <xref uid="excel!Excel.WorksheetPositionType:enum" /> | "None" | "Before" | "After" | "Beginning" | "End"
- name: relativeTo
  uid: excel!Excel.InsertWorksheetOptions#relativeTo:member
  package: excel!
  fullName: relativeTo
  summary: パラメーターに対して参照されている現在のブック内の `WorksheetPositionType` ワークシート。 既定値は次の値です。 `null`<!-- -->. パラメーターが `relativeTo` 設定されていない場合、ワークシートは次の値に基づいて挿入されます。 `positionType`<!-- -->、現在のブックの開始または終了位置です。
  remarks: '\[[API セット: ExcelApi 1.13](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'relativeTo?: Worksheet | string;'
    return:
      type: <xref uid="excel!Excel.Worksheet:class" /> | string
- name: sheetNamesToInsert
  uid: excel!Excel.InsertWorksheetOptions#sheetNamesToInsert:member
  package: excel!
  fullName: sheetNamesToInsert
  summary: 挿入する個々のワークシートの名前。 既定では、ソース ブックのすべてのワークシートが挿入されます。
  remarks: '\[[API セット: ExcelApi 1.13](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'sheetNamesToInsert?: string[];'
    return:
      type: string[]
