  summary: 別の最初のページヘッダー/フッターがあります。その後、奇数ページと偶数ページ用の個別のヘッダー/フッターがあります。
  value: "\"FirstOddAndEven\""
- name: oddAndEven
  uid: excel!Excel.HeaderFooterState.oddAndEven:member
  package: excel!
  summary: 奇数ページと偶数ページには異なるヘッダー/フッターがあります。
  value: "\"OddAndEven\""
