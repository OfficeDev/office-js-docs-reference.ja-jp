- name: pivotTables
  uid: excel!Excel.Worksheet#pivotTables:member
  package: excel!
  fullName: pivotTables
  summary: ワークシートの一部になっているピボットテーブルのコレクション。
  remarks: >-
    \[[API セット: ExcelApi 1.3](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/38-pivottable/pivottable-get-pivottables.yaml

    await Excel.run(async (context) => {
      // Get the names of all the PivotTables in the current worksheet.
      const pivotTables = context.workbook.worksheets.getActiveWorksheet().pivotTables;
      pivotTables.load("name");
      await context.sync();

      // Display the names in the console.
      console.log("PivotTables in the current worksheet:")
      pivotTables.items.forEach((pivotTable) => {
        console.log(`\t${pivotTable.name}`);
      });
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly pivotTables: Excel.PivotTableCollection;'
    return:
      type: <xref uid="excel!Excel.PivotTableCollection:class" />
- name: position
  uid: excel!Excel.Worksheet#position:member
  package: excel!
  fullName: position
  summary: 0 を起点とした、ブック内のワークシートの位置。
  remarks: "\\[[API セット: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\n// Set worksheet position.\nawait Excel.run(async (context) => { \n    var wSheetName = 'Sheet1';\n    var worksheet = context.workbook.worksheets.getItem(wSheetName);\n    worksheet.position = 2;\n    await context.sync(); \n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'position: number;'
    return:
      type: number
- name: protection
  uid: excel!Excel.Worksheet#protection:member
  package: excel!
  fullName: protection
  summary: ワークシートのシート保護オブジェクトを返します。
  remarks: "\\[[API セット: ExcelApi 1.2](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\n// Unprotecting a worksheet with unprotect() will remove all \n// WorksheetProtectionOptions options applied to a worksheet.\n// To remove only a subset of WorksheetProtectionOptions use the \n// protect() method and set the options you wish to remove to true.\nawait Excel.run(async (context) => {\n  var sheet = context.workbook.worksheets.getItem(\"Sheet1\");\n  sheet.protection.protect({\n    allowInsertRows: false, // Protect row insertion\n    allowDeleteRows: true // Unprotect row deletion\n  });\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly protection: Excel.WorksheetProtection;'
    return:
      type: <xref uid="excel!Excel.WorksheetProtection:class" />
