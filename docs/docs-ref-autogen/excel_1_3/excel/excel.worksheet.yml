name: Excel.Worksheet
uid: excel!Excel.Worksheet:class
package: excel!
fullName: Excel.Worksheet
summary: Excel のワークシートは、セルのグリッドです。 データ、テーブル、グラフなどを含む場合があります。ワークシート オブジェクト モデルの詳細については、「JavaScript API を使用してワークシートを使用して作業[する」をExcelしてください。](https://docs.microsoft.com/office/dev/add-ins/excel/excel-add-ins-worksheets)<!-- -->.
remarks: '\[[API セット: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: false
isDeprecated: false
type: class
