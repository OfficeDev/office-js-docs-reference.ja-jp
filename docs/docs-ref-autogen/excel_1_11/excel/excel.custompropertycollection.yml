methods:
- name: add(key, value)
  uid: excel!Excel.CustomPropertyCollection#add:member(1)
  package: excel!
  fullName: add(key, value)
  summary: 新しいカスタム プロパティを作成、または既存のカスタム プロパティを設定します。
  remarks: >-
    \[[API セット: ExcelApi 1.7](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/26-document/custom-properties.yaml

    await Excel.run(async (context) => {
      // Get the key/value pair from the task pane.
      const userKey = $("#key").text();
      const userValue = $("#value").text();

      // Add the custom property.
      const customDocProperties = context.workbook.properties.custom;
      customDocProperties.add(userKey, userValue);

      await context.sync();

      console.log(`Successfully set custom document property ${userKey}:${userValue}.`);
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'add(key: string, value: any): Excel.CustomProperty;'
    parameters:
    - id: key
      description: 必須。 大文字と小文字を区別しないカスタム プロパティのキー。 キーは 255 文字に制限されています (Excel on the webキーは他のプラットフォームでは自動的に 255 文字にトリミングされます)。
      type: string
    - id: value
      description: 必須。 カスタム プロパティの値。 この値は、Excel on the web 以外の 255 文字に制限されます (大きい値は、他のプラットフォームでは自動的に 255 文字にトリミングされます)。
      type: any
    return:
      type: <xref uid="excel!Excel.CustomProperty:class" />
      description: ''
