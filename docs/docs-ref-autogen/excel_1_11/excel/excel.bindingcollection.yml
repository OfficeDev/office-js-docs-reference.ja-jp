- name: getItem(id)
  uid: excel!Excel.BindingCollection#getItem:member(1)
  package: excel!
  fullName: getItem(id)
  summary: ID を使用してバインド オブジェクトを取得します。
  remarks: "\\[[API セット: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\nasync function onBindingDataChanged(eventArgs) {\n    await Excel.run(async (context) => { \n        // Highlight the table related to the binding in orange to indicate data has been changed.\n        context.workbook.bindings.getItem(eventArgs.binding.id).getTable().getDataBodyRange().format.fill.color = \"Orange\";\n        await context.sync();\n        \n        console.log(\"The value in this table got changed!\");\n    });\n}\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItem(id: string): Excel.Binding;'
    parameters:
    - id: id
      description: 取得するバインド オブジェクトの ID。
      type: string
    return:
      type: <xref uid="excel!Excel.Binding:class" />
      description: ''
- name: getItemAt(index)
  uid: excel!Excel.BindingCollection#getItemAt:member(1)
  package: excel!
  fullName: getItemAt(index)
  summary: 項目の配列内の位置に基づいて、バインド オブジェクトを取得します。
  remarks: "\\[[API セット: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\nawait Excel.run(async (context) => { \n    var lastPosition = context.workbook.bindings.count - 1;\n    var binding = context.workbook.bindings.getItemAt(lastPosition);\n    binding.load('type')\n    await context.sync();\n\n    console.log(binding.type);\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItemAt(index: number): Excel.Binding;'
    parameters:
    - id: index
      description: 取得するオブジェクトのインデックス値。0 を起点とする番号になります。
      type: number
    return:
      type: <xref uid="excel!Excel.Binding:class" />
      description: ''
