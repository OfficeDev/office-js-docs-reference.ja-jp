- name: navigateToPage(page)
  uid: onenote!OneNote.Application#navigateToPage:member(1)
  package: onenote!
  fullName: navigateToPage(page)
  summary: アプリケーション インスタンスで指定されたページを開きます。
  remarks: "\\[[API セット: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\nawait OneNote.run(async (context) => {\n        \n    // Get the pages in the current section.\n    var pages = context.application.getActiveSection().pages;\n            \n    // Queue a command to load the pages.\n    // For best performance, request specific properties.\n    pages.load('id');\n            \n    // Run the queued commands, and return a promise to indicate task completion.\n    await context.sync()\n                    \n    // This example loads the first page in the section.\n    var page = pages.items[0];\n                \n    // Open the page in the application.\n    context.application.navigateToPage(page);\n            \n    // Run the queued command.\n    await context.sync();\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'navigateToPage(page: OneNote.Page): void;'
    parameters:
    - id: page
      description: 開くページです。
      type: <xref uid="onenote!OneNote.Page:class" />
    return:
      type: void
      description: ''
- name: navigateToPageWithClientUrl(url)
  uid: onenote!OneNote.Application#navigateToPageWithClientUrl:member(1)
  package: onenote!
  fullName: navigateToPageWithClientUrl(url)
  summary: 指定されたページを取得し、アプリケーション インスタンスで開きます。 それでも、失敗しない場合はナビゲーションを実行できない場合があります。 必要に応じて、呼び出し元は返されたページを検証する必要があります。
  remarks: >-
    \[[API セット: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```typescript

    await OneNote.run(async (context) => {

        // Get the pages in the current section.
        var pages = context.application.getActiveSection().pages;

        // Queue a command to load the pages.
        // For best performance, request specific properties.
        pages.load('clientUrl');

        // Run the queued commands, and return a promise to indicate task completion.
        await context.sync()

        // This example loads the first page in the section.
        var page = pages.items[0];

        // Open the page in the application.
        context.application.navigateToPageWithClientUrl(page.clientUrl);

        // Run the queued command.
        await context.sync();
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'navigateToPageWithClientUrl(url: string): OneNote.Page;'
    parameters:
    - id: url
      description: 開くページのクライアント URL です。
      type: string
    return:
      type: <xref uid="onenote!OneNote.Page:class" />
      description: ''
