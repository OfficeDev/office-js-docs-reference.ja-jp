methods:
- name: getByTitle(title)
  uid: onenote!OneNote.PageCollection#getByTitle:member(1)
  package: onenote!
  fullName: getByTitle(title)
  summary: 指定したタイトルのページのコレクションを取得します。
  remarks: "\\[[API セット: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\nawait OneNote.run(async (context) => {\n\n    // Get all the pages in the current section.\n    var allPages = context.application.getActiveSection().pages;\n\n    // Queue a command to load the pages.\n    // For best performance, request specific properties.\n    allPages.load(\"id\"); \n\n    // Run the queued commands, and return a promise to indicate task completion.\n    await context.sync();\n\n    // Get the sections with the specified name.\n    var todoPages = allPages.getByTitle(\"Todo list\");\n\n    // Queue a command to load the section.\n    // For best performance, request specific properties.\n    todoPages.load(\"id,title\"); \n\n    await context.sync()\n\n    // Iterate through the collection or access items individually by index.\n    if (todoPages.items.length > 0) {\n        console.log(\"Page title: \" + todoPages.items[0].title);\n        console.log(\"Page ID: \" + todoPages.items[0].id);\n    }\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getByTitle(title: string): OneNote.PageCollection;'
    parameters:
    - id: title
      description: ページのタイトル。
      type: string
    return:
      type: <xref uid="onenote!OneNote.PageCollection:class" />
      description: ''
- name: getItem(index)
  uid: onenote!OneNote.PageCollection#getItem:member(1)
  package: onenote!
  fullName: getItem(index)
  summary: ID やコレクション内のインデックスで、ページを取得します。読み取り専用です。
  remarks: '\[[API セット: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItem(index: number | string): OneNote.Page;'
    parameters:
    - id: index
      description: ページの ID、またはコレクション内のページのインデックスの場所です。
      type: number | string
    return:
      type: <xref uid="onenote!OneNote.Page:class" />
      description: ''
- name: getItemAt(index)
  uid: onenote!OneNote.PageCollection#getItemAt:member(1)
  package: onenote!
  fullName: getItemAt(index)
  summary: コレクション内での位置を基にページを取得します。
  remarks: '\[[API セット: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItemAt(index: number): OneNote.Page;'
    parameters:
    - id: index
      description: 取得するオブジェクトのインデックス値。0 を起点とする番号になります。
      type: number
    return:
      type: <xref uid="onenote!OneNote.Page:class" />
      description: ''
- name: load(options)
  uid: onenote!OneNote.PageCollection#load:member(1)
  package: onenote!
  fullName: load(options)
  summary: オブジェクトの指定されたプロパティを読み込むコマンドを待ち行列に入れます。 プロパティを読み取る前に、`context.sync()` を呼び出す必要があります。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'load(options?: OneNote.Interfaces.PageCollectionLoadOptions & OneNote.Interfaces.CollectionLoadOptions): OneNote.PageCollection;'
    parameters:
    - id: options
      description: 読み込むオブジェクトのプロパティのオプションを提供します。
      type: <xref uid="onenote!OneNote.Interfaces.PageCollectionLoadOptions:interface" /> & <xref uid="onenote!OneNote.Interfaces.CollectionLoadOptions:interface" />
    return:
      type: <xref uid="onenote!OneNote.PageCollection:class" />
      description: ''
- name: load(propertyNames)
  uid: onenote!OneNote.PageCollection#load:member(2)
  package: onenote!
  fullName: load(propertyNames)
  summary: オブジェクトの指定されたプロパティを読み込むコマンドを待ち行列に入れます。 プロパティを読み取る前に、`context.sync()` を呼び出す必要があります。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'load(propertyNames?: string | string[]): OneNote.PageCollection;'
    parameters:
    - id: propertyNames
      description: 読み込むプロパティを指定するコンマ区切り文字列または文字列の配列。
      type: string | string[]
    return:
      type: <xref uid="onenote!OneNote.PageCollection:class" />
      description: "\n\n#### <a name=\"examples\"></a>例\n\n```typescript\nawait OneNote.run(async (context) => {\n    \n    // Get the pages in the current section.\n    var pages = context.application.getActiveSection().pages;\n    \n    // Queue a command to load the id and title for each page.\n    pages.load('id,title');\n    \n    // Run the queued commands, and return a promise to indicate task completion.\n    await context.sync();\n            \n    // Display the properties.\n    $.each(pages.items, function(index, page) {\n        console.log(page.title);\n        console.log(page.id);\n    });\n});\n```"
- name: load(propertyNamesAndPaths)
  uid: onenote!OneNote.PageCollection#load:member(3)
  package: onenote!
  fullName: load(propertyNamesAndPaths)
  summary: オブジェクトの指定されたプロパティを読み込むコマンドを待ち行列に入れます。 プロパティを読み取る前に、`context.sync()` を呼び出す必要があります。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'load(propertyNamesAndPaths?: OfficeExtension.LoadOption): OneNote.PageCollection;'
    parameters:
    - id: propertyNamesAndPaths
      description: '`propertyNamesAndPaths.select` は、読 `propertyNamesAndPaths.expand` み込むプロパティを指定するコンマ区切りの文字列で、読み込むナビゲーション プロパティを指定するコンマ区切りの文字列です。'
      type: <xref uid="office!OfficeExtension.LoadOption:interface" />
    return:
      type: <xref uid="onenote!OneNote.PageCollection:class" />
      description: ''
- name: toJSON()
  uid: onenote!OneNote.PageCollection#toJSON:member(1)
  package: onenote!
  fullName: toJSON()
  summary: API オブジェクトを渡す際に、より有用な出力を提供するために JavaScript `toJSON()` メソッドをオーバーライドします。 `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->、順番に、渡される `toJSON` オブジェクトのメソッドを呼び出します。元のオブジェクトが `OneNote.PageCollection` API `toJSON` オブジェクトであるのに対し、メソッドはプレーンな JavaScript オブジェクト (次のように入力) を返します。 `OneNote.Interfaces.PageCollectionData`<!-- -->) コレクションのアイテムから読み込まれたプロパティのコピーが浅い "items" 配列を含む。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'toJSON(): OneNote.Interfaces.PageCollectionData;'
    return:
      type: <xref uid="onenote!OneNote.Interfaces.PageCollectionData:interface" />
      description: ''
- name: track()
  uid: onenote!OneNote.PageCollection#track:member(1)
  package: onenote!
  fullName: track()
  summary: ドキュメントの環境変更に基づいて自動的に調整する目的でオブジェクトを追跡します。 この呼び出しは、 `context.trackedObjects.add(thisObject)`<!-- -->. `.sync`このオブジェクトを呼び出し間で使用し、.run バッチのシーケンシャル実行の外側で使用し、プロパティの設定またはオブジェクトのメソッドの呼び出し時に "InvalidObjectPath" エラーが発生する場合は、オブジェクトが最初に作成された時点で、追跡対象オブジェクト コレクションにオブジェクトを追加する必要がありました。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'track(): OneNote.PageCollection;'
    return:
      type: <xref uid="onenote!OneNote.PageCollection:class" />
      description: ''
- name: untrack()
  uid: onenote!OneNote.PageCollection#untrack:member(1)
  package: onenote!
  fullName: untrack()
  summary: 前に追跡されていた場合、このオブジェクトに関連付けられているメモリを解放します。 この呼び出しは、 `context.trackedObjects.remove(thisObject)`<!-- -->. 追跡対象オブジェクトが多いとホスト アプリケーションの動作が遅くなります。追加したオブジェクトが不要になったら、必ずそれを解放してください。 メモリ解放が有効にされる前 `context.sync()` に呼び出す必要があります。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'untrack(): OneNote.PageCollection;'
    return:
      type: <xref uid="onenote!OneNote.PageCollection:class" />
      description: ''
