- name: toJSON()
  uid: onenote!OneNote.InkAnalysisLine#toJSON:member(1)
  package: onenote!
  fullName: toJSON()
  summary: API オブジェクトを渡す際に、より有用な出力を提供するために `toJSON()` JavaScript メソッドをオーバーライドします。 `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->、順番に、渡 `toJSON` されるオブジェクトのメソッドを呼び出します。一方、元のOneNote。InkAnalysisLine オブジェクトは API オブジェクトで、メソッドはプレーンな JavaScript オブジェクト (次のように入力) `toJSON` を返します。`OneNote.Interfaces.InkAnalysisLineData`<!-- -->) は、元のオブジェクトから読み込まれた子プロパティの浅いコピーを含む。
