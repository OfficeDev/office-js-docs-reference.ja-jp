methods:
- name: addSection(title)
  uid: onenote!OneNote.SectionGroup#addSection:member(1)
  package: onenote!
  fullName: addSection(title)
  summary: セクション グループの末尾に新しいセクションを追加します。
  remarks: "\\[[API セット: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\nawait OneNote.run(async (context) => {\n\n    // Get the section groups that are direct children of the current notebook.\n    var sectionGroups = context.application.getActiveNotebook().sectionGroups;\n    \n    // Queue a command to load the section groups.\n    // For best performance, request specific properties.\n    sectionGroups.load(\"id\");\n\n    // Run the queued commands, and return a promise to indicate task completion.\n    await context.sync();\n            \n    // Add a section to each section group.\n    $.each(sectionGroups.items, function(index, sectionGroup) {\n        sectionGroup.addSection(\"Agenda\");\n    });\n    \n    // Run the queued commands.\n    await context.sync();\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'addSection(title: string): OneNote.Section;'
    parameters:
    - id: title
      description: 新しいセクションの名前を指定します。
      type: string
    return:
      type: <xref uid="onenote!OneNote.Section:class" />
      description: ''
- name: addSectionGroup(name)
  uid: onenote!OneNote.SectionGroup#addSectionGroup:member(1)
  package: onenote!
  fullName: addSectionGroup(name)
  summary: この sectionGroup の末尾に新しいセクション グループを追加します。
  remarks: "\\[[API セット: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\nawait OneNote.run(async (context) => {\n    var sectionGroup;\n    var nestedSectionGroup;\n\n    // Gets the active notebook.\n    var notebook = context.application.getActiveNotebook();\n\n    // Queue a command to add a new section group.\n    var sectionGroups = notebook.sectionGroups;\n\n    // Queue a command to load the new section group.\n    sectionGroups.load();\n\n    // Run the queued commands, and return a promise to indicate task completion.\n    await context.sync();\n\n    sectionGroup = sectionGroups.items[0];\n    sectionGroup.load();\n    await context.sync();\n\n    nestedSectionGroup = sectionGroup.addSectionGroup(\"Sample nested section group\");\n    nestedSectionGroup.load();\n    await context.sync();\n    \n    console.log(\"New nested section group name is \" + nestedSectionGroup.name);\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'addSectionGroup(name: string): OneNote.SectionGroup;'
    parameters:
    - id: name
      description: 新しいセクションの名前を指定します。
      type: string
    return:
      type: <xref uid="onenote!OneNote.SectionGroup:class" />
      description: ''
