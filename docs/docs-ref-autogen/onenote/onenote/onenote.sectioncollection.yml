  fullName: getItem(index)
  summary: ID やコレクション内のインデックスで、セクションを取得します。読み取り専用です。
  remarks: '\[[API セット: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItem(index: number | string): OneNote.Section;'
    parameters:
    - id: index
      description: セクションの ID、またはコレクション内のセクションのインデックスの場所です。
      type: number | string
    return:
      type: <xref uid="onenote!OneNote.Section:class" />
      description: ''
- name: getItemAt(index)
  uid: onenote!OneNote.SectionCollection#getItemAt:member(1)
  package: onenote!
  fullName: getItemAt(index)
  summary: コレクション内での位置を基にセクションを取得します。
  remarks: '\[[API セット: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
