- name: addOutline(left, top, html)
  uid: onenote!OneNote.Page#addOutline:member(1)
  package: onenote!
  fullName: addOutline(left, top, html)
  summary: Outline をページの指定した位置に追加します。
  remarks: "\\[[API セット: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\nawait OneNote.run(async (context) => {\n\n    // Gets the active page.\n    var page = context.application.getActivePage();\n\n    // Queue a command to add an outline with given html.\n    var outline = page.addOutline(200, 200,\n\"<p>Images and a table below:</p> \\\n <img src=\\\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUAAAAFCAYAAACNbyblAAAAHElEQVQI12P4//8/w38GIAXDIBKE0DHxgljNBAAO9TXL0Y4OHwAAAABJRU5ErkJggg==\\\"> \\\n <img src=\\\"http://imagenes.es.sftcdn.net/es/scrn/6653000/6653659/microsoft-onenote-2013-01-535x535.png\\\"> \\\n <table> \\\n   <tr> \\\n     <td>Jill</td> \\\n     <td>Smith</td> \\\n     <td>50</td> \\\n   </tr> \\\n   <tr> \\\n     <td>Eve</td> \\\n     <td>Jackson</td> \\\n     <td>94</td> \\\n   </tr> \\\n </table>\"     \n        );\n\n    // Run the queued commands, and return a promise to indicate task completion.\n    await context.sync();\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'addOutline(left: number, top: number, html: string): OneNote.Outline;'
    parameters:
    - id: left
      description: Outline の左上隅の左の位置です。
      type: number
    - id: top
      description: Outline の左上隅の上の位置です。
      type: number
    - id: html
      description: Outline の視覚表示を記述する HTML 文字列です。 JavaScript API [の](https://docs.microsoft.com/office/dev/add-ins/onenote/onenote-add-ins-page-content#supported-html)詳細については、「サポートOneNote HTML」を参照してください。
      type: string
    return:
      type: <xref uid="onenote!OneNote.Outline:class" />
      description: ''
