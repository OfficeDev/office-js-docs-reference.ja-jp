methods:
- name: addSection(name)
  uid: onenote!OneNote.Notebook#addSection:member(1)
  package: onenote!
  fullName: addSection(name)
  summary: ノートブックの末尾に新しいセクションを追加します。
  remarks: "\\[[API セット: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\nawait OneNote.run(async (context) => {\n\n    // Gets the active notebook.\n    var notebook = context.application.getActiveNotebook();\n\n    // Queue a command to add a new section.\n    var section = notebook.addSection(\"Sample section\");\n    \n    // Queue a command to load the new section. This example reads the name property later.\n    section.load(\"name\");\n\n    // Run the queued commands, and return a promise to indicate task completion.\n    await context.sync();\n    console.log(\"New section name is \" + section.name);\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'addSection(name: string): OneNote.Section;'
    parameters:
    - id: name
      description: 新しいセクションの名前を指定します。
      type: string
    return:
      type: <xref uid="onenote!OneNote.Section:class" />
      description: ''
- name: addSectionGroup(name)
  uid: onenote!OneNote.Notebook#addSectionGroup:member(1)
  package: onenote!
  fullName: addSectionGroup(name)
  summary: ノートブックの末尾に新しいセクション グループを追加します。
  remarks: >-
    \[[API セット: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```typescript

    await OneNote.run(async (context) => {

        // Gets the active notebook.
        var notebook = context.application.getActiveNotebook();

        // Queue a command to add a new section group.
        var sectionGroup = notebook.addSectionGroup("Sample section group");

        // Queue a command to load the new section group.
        sectionGroup.load();

        // Run the queued commands, and return a promise to indicate task completion.
        await context.sync();
        console.log("New section group name is " + sectionGroup.name);
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'addSectionGroup(name: string): OneNote.SectionGroup;'
    parameters:
    - id: name
      description: 新しいセクションの名前を指定します。
      type: string
    return:
      type: <xref uid="onenote!OneNote.SectionGroup:class" />
      description: ''
- name: getRestApiId()
  uid: onenote!OneNote.Notebook#getRestApiId:member(1)
  package: onenote!
  fullName: getRestApiId()
  summary: REST API ID を取得します。
  remarks: >-
    \[[API セット: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```typescript

    await OneNote.run(async (context) => {
        // Get the current notebook.
        var notebook = context.application.getActiveNotebook();
        var restApiId = notebook.getRestApiId();

        await context.sync();
        console.log("The REST API ID is " + restApiId.value);
        // Note that the REST API ID isn't all you need to interact with the OneNote REST API.
        // This is only required for SharePoint notebooks. baseUrl will be null for OneDrive notebooks.
        // For SharePoint notebooks, the notebook baseUrl should be used to talk to the OneNote REST API
        // according to the OneNote Development Blog.
        // https://docs.microsoft.com/archive/blogs/onenotedev/and-sharepoint-makes-three
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getRestApiId(): OfficeExtension.ClientResult<string>;'
    return:
      type: <xref uid="office!OfficeExtension.ClientResult:class" />&lt;string&gt;
      description: ''
