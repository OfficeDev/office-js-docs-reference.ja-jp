- name: toJSON()
  uid: onenote!OneNote.Notebook#toJSON:member(1)
  package: onenote!
  fullName: toJSON()
  summary: API オブジェクトを渡す際に、より有用な出力を提供するために JavaScript `toJSON()` メソッドをオーバーライドします。 `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->、順番に、渡される`toJSON`オブジェクトのメソッドを呼び出します。一方、元のOneNote。ノートブック オブジェクトは API オブジェクトで、`toJSON`メソッドはプレーンな JavaScript オブジェクト (次のように入力) を返します。`OneNote.Interfaces.NotebookData`<!-- -->) は、元のオブジェクトから読み込まれた子プロパティの浅いコピーを含む。
  remarks: ''
