### YamlMime:TSType
name: Word.CommentCollection
uid: word!Word.CommentCollection:class
package: word!
fullName: Word.CommentCollection
summary: '[Word.Comment オブジェクトのコレクションを格納](xref:word!Word.Comment:class)します。'
remarks: '\[[API セット: WordApiOnline BETA (PREVIEW のみ)](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
type: class
properties:
- name: context
  uid: word!Word.CommentCollection#context:member
  package: word!
  fullName: context
  summary: オブジェクトに関連付けられた要求コンテキスト。 これにより、アドインのプロセスがホスト アプリケーションのプロセスOfficeに接続されます。
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'context: RequestContext;'
    return:
      type: <xref uid="word!Word.RequestContext:class" />
- name: items
  uid: word!Word.CommentCollection#items:member
  package: word!
  fullName: items
  summary: このコレクション内に読み込まれた子アイテムを取得します。
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'readonly items: Word.Comment[];'
    return:
      type: <xref uid="word!Word.Comment:class" />[]
      description: "\n\n#### <a name=\"examples\"></a>例\n\n```typescript\n// Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/99-preview-apis/manage-comments.yaml\nawait Word.run(async (context) => {\n  let text = $(\"#reply-text\")\n    .val()\n    .toString();\n  let comments = context.document.getSelection().getComments();\n  comments.load(\"items\");\n  await context.sync();\n  let firstActiveComment = comments.items.find((item) => item.resolved !== true);\n  if (firstActiveComment) {\n    let reply = firstActiveComment.reply(text);\n    console.log(\"Reply added\");\n  } else {\n    console.log(\"No active comment was found in the selection so couldn't reply.\");\n  }\n});\n```"
methods:
- name: getFirst()
  uid: word!Word.CommentCollection#getFirst:member(1)
  package: word!
  fullName: getFirst()
  summary: コレクション内の最初のコメントを取得します。 このコレクションが空の場合、エラーをスローします。
  remarks: >-
    \[[API セット: WordApiOnline BETA (PREVIEW のみ)](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/99-preview-apis/manage-comments.yaml

    await Word.run(async (context) => {
      let range = context.document
        .getSelection()
        .getComments()
        .getFirst()
        .getRange();
      range.load("text");
      await context.sync();

      console.log(`Comment location: ${range.text}`);
    });

    ```
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'getFirst(): Word.Comment;'
    return:
      type: <xref uid="word!Word.Comment:class" />
      description: ''
