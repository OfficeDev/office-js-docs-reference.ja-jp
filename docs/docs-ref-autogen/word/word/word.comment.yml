  - name: reply(replyText)
    uid: 'word!Word.Comment#reply:member(1)'
    package: word!
    fullName: reply(replyText)
    summary: コメント スレッドの末尾に新しい返信を追加します。
    remarks: |-
      \[[API セット: WordApiOnline BETA (PREVIEW のみ)](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]

      #### <a name="examples"></a>例

      ```typescript
      // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/99-preview-apis/manage-comments.yaml
      await Word.run(async (context) => {
        let text = $("#reply-text")
          .val()
          .toString();
        let comments = context.document.getSelection().getComments();
        comments.load("items");
        await context.sync();
        let firstActiveComment = comments.items.find((item) => item.resolved !== true);
        if (firstActiveComment) {
          let reply = firstActiveComment.reply(text);
          console.log("Reply added");
        } else {
          console.log("No active comment was found in the selection so couldn't reply.");
        }
      });
      ```
    isPreview: true
    isDeprecated: false
    syntax:
      content: 'reply(replyText: string): Word.CommentReply;'
      parameters:
        - id: replyText
          description: 必須です。 返信テキスト。
          type: string
      return:
        type: '<xref uid="word!Word.CommentReply:class" />'
        description: ''
