- name: getFirst()
  uid: word!Word.NoteItemCollection#getFirst:member(1)
  package: word!
  fullName: getFirst()
  summary: このコレクションの最初のノート アイテムを取得します。 このコレクションが空の場合、エラーをスローします。
  remarks: >-
    \[[API セット: WordApiOnline BETA (PREVIEW のみ)](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/99-preview-apis/manage-footnotes.yaml

    await Word.run(async (context) => {
      let reference = context.document.body.footnotes.getFirst().reference;
      reference.select();
      console.log("The first footnote is selected.");
    });

    ```
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'getFirst(): Word.NoteItem;'
    return:
