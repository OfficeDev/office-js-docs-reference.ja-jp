- name: set(properties, options)
  uid: word!Word.ContentControl#set:member(1)
  package: word!
  fullName: set(properties, options)
  summary: オブジェクトの複数のプロパティを同時に設定します。 適切なプロパティを持つプレーン オブジェクト、または同じ種類の別の API オブジェクトを渡します。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'set(properties: Interfaces.ContentControlUpdateData, options?: OfficeExtension.UpdateOptions): void;'
    parameters:
    - id: properties
      description: メソッドが呼び出されるオブジェクトのプロパティと同型的に構造化されたプロパティを持つ JavaScript オブジェクト。
      type: <xref uid="word!Word.Interfaces.ContentControlUpdateData:interface" />
    - id: options
      description: properties オブジェクトが読み取り専用プロパティを設定しようとすると、エラーを抑制するオプションを提供します。
      type: <xref uid="office!OfficeExtension.UpdateOptions:interface" />
    return:
      type: void
      description: "\n\n#### <a name=\"examples\"></a>例\n\n```typescript\n// Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/10-content-controls/insert-and-change-content-controls.yaml\n// Adds title and colors to odd and even content controls and changes their appearance.\nawait Word.run(async (context) => {\n  // Gets the complete sentence (as range) associated with the insertion point.\n  let evenContentControls = context.document.contentControls.getByTag(\"even\");\n  let oddContentControls = context.document.contentControls.getByTag(\"odd\");\n  evenContentControls.load(\"length\");\n  oddContentControls.load(\"length\");\n\n  await context.sync();\n\n  for (let i = 0; i < evenContentControls.items.length; i++) {\n    // Change a few properties and append a paragraph\n    evenContentControls.items[i].set({\n      color: \"red\",\n      title: \"Odd ContentControl #\" + (i + 1),\n      appearance: \"Tags\"\n    });\n    evenContentControls.items[i].insertParagraph(\"This is an odd content control\", \"End\");\n  }\n\n  for (let j = 0; j < oddContentControls.items.length; j++) {\n    // Change a few properties and append a paragraph\n    oddContentControls.items[j].set({\n      color: \"green\",\n      title: \"Even ContentControl #\" + (j + 1),\n      appearance: \"Tags\"\n    });\n    oddContentControls.items[j].insertHtml(\"This is an <b>even</b> content control\", \"End\");\n  }\n\n  await context.sync();\n});\n```"
