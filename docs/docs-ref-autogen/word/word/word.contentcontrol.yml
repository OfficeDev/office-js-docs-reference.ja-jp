- name: split(delimiters, multiParagraphs, trimDelimiters, trimSpacing)
  uid: word!Word.ContentControl#split:member(1)
  package: word!
  fullName: split(delimiters, multiParagraphs, trimDelimiters, trimSpacing)
  summary: 区切り記号を使用して、コンテンツ コントロールを子の範囲に分割します。
  remarks: '\[[API セット: WordApi 1.3](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'split(delimiters: string[], multiParagraphs?: boolean, trimDelimiters?: boolean, trimSpacing?: boolean: Word.RangeCollection;'
    parameters:
    - id: delimiters
      description: 必須です。 文字列の配列としての区切り記号。
      type: string[]
    - id: multiParagraphs
      description: 省略可能。 返される子範囲が複数の段落をカバーできるかどうかを示します。 既定値は false で、段落の境界も区切り記号として使用されます。
      type: boolean
    - id: trimDelimiters
      description: 省略可能。 範囲コレクション内の範囲から区切り記号をトリミングするかどうかを示します。 既定値は false で、区切り記号が範囲コレクションに返される範囲に含まれるかどうかを示します。
      type: boolean
    - id: trimSpacing
      description: 省略可能。 範囲コレクションで返される範囲の開始および終了から間隔文字 (スペース、タブ、列区切り、段落の終了マーク) をトリミングするかどうかを示します。 既定値は false で、範囲の開始と終了の間隔の文字が範囲コレクションに含まれるかどうかを示します。
      type: boolean
    return:
      type: <xref uid="word!Word.RangeCollection:class" />
      description: ''
