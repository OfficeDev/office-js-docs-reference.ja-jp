### YamlMime:TSType
name: Word.ContentControl
uid: word!Word.ContentControl:class
package: word!
fullName: Word.ContentControl
summary: コンテンツ コントロールを表します。コンテンツ コントロールは、特定の種類のコンテンツのコンテナーとして機能し、ドキュメント内で境界線で区切られ、ラベルが付いた領域になる場合もあります。個々のコンテンツ コントロールには、画像、表、書式設定されたテキストの段落などの内容が含まれていることがあります。現時点では、リッチ テキスト コンテンツ コントロールのみがサポートされています。
remarks: '\[[API セット: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
isPreview: false
isDeprecated: false
type: class
properties:
- name: appearance
  uid: word!Word.ContentControl#appearance:member
  package: word!
  fullName: appearance
  summary: コンテンツ コントロールの外観を取得または設定します。 値には、'BoundingBox'、'Tags'、または 'Hidden' を指定できます。
  remarks: '\[[API セット: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: '外観: Word.ContentControlAppearance |"BoundingBox" |"Tags" |"Hidden";'
    return:
      type: <xref uid="word!Word.ContentControlAppearance:enum" /> | "BoundingBox" | "Tags" | "Hidden"
- name: cannotDelete
  uid: word!Word.ContentControl#cannotDelete:member
  package: word!
  fullName: cannotDelete
  summary: ユーザーがコンテンツ コントロールを削除できるかどうかを示す値を取得または設定します。removeWhenEdited と同時に使用することはできません。
  remarks: '\[[API セット: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'cannotDelete: boolean;'
    return:
      type: boolean
- name: cannotEdit
  uid: word!Word.ContentControl#cannotEdit:member
  package: word!
  fullName: cannotEdit
  summary: ユーザーがコンテンツ コントロールのコンテンツを編集できるかどうかを示す値を取得または設定します。
  remarks: '\[[API セット: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'cannotEdit: boolean;'
    return:
      type: boolean
- name: color
  uid: word!Word.ContentControl#color:member
  package: word!
  fullName: color
  summary: コンテンツ コントロールの色を取得または設定します。 色は'\#RRGGBB' 形式で、または色名を使用して指定します。
  remarks: '\[[API セット: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'color: string;'
    return:
      type: string
- name: contentControls
  uid: word!Word.ContentControl#contentControls:member
  package: word!
  fullName: contentControls
  summary: コンテンツ コントロールのコンテンツ コントロール オブジェクトのコレクションを取得します。読み取り専用です。
  remarks: '\[[API セット: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly contentControls: Word.ContentControlCollection;'
    return:
      type: <xref uid="word!Word.ContentControlCollection:class" />
- name: context
  uid: word!Word.ContentControl#context:member
  package: word!
  fullName: context
  summary: オブジェクトに関連付けられた要求コンテキスト。 これにより、アドインのプロセスがホスト アプリケーションのプロセスOfficeに接続されます。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'context: RequestContext;'
    return:
      type: <xref uid="word!Word.RequestContext:class" />
- name: endnotes
  uid: word!Word.ContentControl#endnotes:member
  package: word!
  fullName: endnotes
  summary: コンテンツ コントロール内の文末脚注のコレクションを取得します。 読み取り専用です。
  remarks: '\[[API セット: WordApiOnline BETA (PREVIEW のみ)](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'readonly endnotes: Word.NoteItemCollection;'
    return:
      type: <xref uid="word!Word.NoteItemCollection:class" />
- name: font
  uid: word!Word.ContentControl#font:member
  package: word!
  fullName: font
  summary: コンテンツ コントロールのテキストの書式設定を取得します。これを使用して、フォント名、サイズ、色、およびその他のプロパティを取得および設定します。読み取り専用です。
  remarks: '\[[API セット: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly font: Word.Font;'
    return:
      type: <xref uid="word!Word.Font:class" />
- name: footnotes
  uid: word!Word.ContentControl#footnotes:member
  package: word!
  fullName: footnotes
  summary: コンテンツ コントロール内の脚注のコレクションを取得します。 読み取り専用です。
  remarks: '\[[API セット: WordApiOnline BETA (PREVIEW のみ)](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'readonly 脚注: Word.NoteItemCollection;'
    return:
      type: <xref uid="word!Word.NoteItemCollection:class" />
- name: id
  uid: word!Word.ContentControl#id:member
  package: word!
  fullName: id
  summary: コンテンツ コントロールの識別子を表す整数値を取得します。読み取り専用です。
  remarks: '\[[API セット: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly id: number;'
    return:
      type: number
- name: inlinePictures
  uid: word!Word.ContentControl#inlinePictures:member
  package: word!
  fullName: inlinePictures
  summary: コンテンツ コントロールに含まれる inlinePicture オブジェクトのコレクションを取得します。コレクションに浮動イメージは含まれません。読み取り専用です。
  remarks: '\[[API セット: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly inlinePictures: Word.InlinePictureCollection;'
    return:
      type: <xref uid="word!Word.InlinePictureCollection:class" />
- name: lists
  uid: word!Word.ContentControl#lists:member
  package: word!
  fullName: lists
  summary: コンテンツ コントロールに含まれるリスト オブジェクトのコレクションを取得します。読み取り専用。
  remarks: '\[[API セット: WordApi 1.3](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly リスト: Word.ListCollection;'
    return:
      type: <xref uid="word!Word.ListCollection:class" />
- name: paragraphs
  uid: word!Word.ContentControl#paragraphs:member
  package: word!
  fullName: paragraphs
  summary: 'コンテンツ コントロールにある Paragraph オブジェクトのコレクションを取得します。 読み取り専用です。 **重要**: 要件セット 1.1 および 1.2 では、このコンテンツ コントロール内に完全に含まれるテーブル内の段落は返されません。 要件セット 1.3 から、そのような表の段落も返されます。'
  remarks: '\[[API セット: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly paragraphs: Word.ParagraphCollection;'
    return:
      type: <xref uid="word!Word.ParagraphCollection:class" />
- name: parentBody
  uid: word!Word.ContentControl#parentBody:member
  package: word!
  fullName: parentBody
  summary: コンテンツ コントロールの親の本文を取得します。読み取り専用。
  remarks: '\[[API セット: WordApi 1.3](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly parentBody: Word.Body;'
    return:
      type: <xref uid="word!Word.Body:class" />
- name: parentContentControl
  uid: word!Word.ContentControl#parentContentControl:member
  package: word!
  fullName: parentContentControl
  summary: コンテンツ コントロールを含むコンテンツ コントロールを取得します。 親コンテンツ コントロールが含めなかった場合は、エラーをスローします。 読み取り専用です。
  remarks: '\[[API セット: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly parentContentControl: Word.ContentControl;'
    return:
      type: <xref uid="word!Word.ContentControl:class" />
- name: parentContentControlOrNullObject
  uid: word!Word.ContentControl#parentContentControlOrNullObject:member
  package: word!
  fullName: parentContentControlOrNullObject
  summary: コンテンツ コントロールを含むコンテンツ コントロールを取得します。 親コンテンツ コントロールがない場合は、null オブジェクトを返します。 読み取り専用です。
  remarks: '\[[API セット: WordApi 1.3](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly parentContentControlOrNullObject: Word.ContentControl;'
    return:
      type: <xref uid="word!Word.ContentControl:class" />
- name: parentTable
  uid: word!Word.ContentControl#parentTable:member
  package: word!
  fullName: parentTable
  summary: コンテンツ コントロールを含むテーブルを取得します。 テーブルに含めされていない場合は、エラーをスローします。 読み取り専用です。
  remarks: '\[[API セット: WordApi 1.3](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly parentTable: Word.Table;'
    return:
      type: <xref uid="word!Word.Table:class" />
- name: parentTableCell
  uid: word!Word.ContentControl#parentTableCell:member
  package: word!
  fullName: parentTableCell
  summary: コンテンツ コントロールを含むテーブル セルを取得します。 テーブル セルに含めされていない場合は、エラーをスローします。 読み取り専用です。
  remarks: '\[[API セット: WordApi 1.3](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly parentTableCell: Word.TableCell;'
    return:
      type: <xref uid="word!Word.TableCell:class" />
- name: parentTableCellOrNullObject
  uid: word!Word.ContentControl#parentTableCellOrNullObject:member
  package: word!
  fullName: parentTableCellOrNullObject
  summary: コンテンツ コントロールを含むテーブル セルを取得します。テーブル セルに含まれていない場合は、null オブジェクトを返します。読み取り専用。
  remarks: '\[[API セット: WordApi 1.3](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly parentTableCellOrNullObject: Word.TableCell;'
    return:
      type: <xref uid="word!Word.TableCell:class" />
- name: parentTableOrNullObject
  uid: word!Word.ContentControl#parentTableOrNullObject:member
  package: word!
  fullName: parentTableOrNullObject
  summary: コンテンツ コントロールを含むテーブルを取得します。テーブルに含まれていない場合は、null オブジェクトを返します。読み取り専用。
  remarks: '\[[API セット: WordApi 1.3](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly parentTableOrNullObject: Word.Table;'
    return:
      type: <xref uid="word!Word.Table:class" />
- name: placeholderText
  uid: word!Word.ContentControl#placeholderText:member
  package: word!
  fullName: placeholderText
  summary: >-
    コンテンツ コントロールのプレースホルダー テキストを取得または設定します。コンテンツ コントロールが空の場合は、淡色のテキストが表示されます。


    **注**: このプロパティの set 操作は、このプロパティではWord on the web。
  remarks: '\[[API セット: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'placeholderText: string;'
    return:
      type: string
- name: removeWhenEdited
  uid: word!Word.ContentControl#removeWhenEdited:member
  package: word!
  fullName: removeWhenEdited
  summary: コンテンツ コントロールを編集後に削除できるかどうかを示す値を取得または設定します。cannotDelete と同時に使用することはできません。
  remarks: '\[[API セット: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'removeWhenEdited: boolean;'
    return:
      type: boolean
- name: style
  uid: word!Word.ContentControl#style:member
  package: word!
  fullName: style
  summary: コンテンツ コントロールのスタイル名を取得または設定します。 カスタム スタイルとローカライズされたスタイルの名前には、このプロパティを使用します。 ロケール間で移植可能な組み込みスタイルを使用するには、"styleBuiltIn" プロパティを参照してください。
  remarks: '\[[API セット: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'style: string;'
    return:
      type: string
