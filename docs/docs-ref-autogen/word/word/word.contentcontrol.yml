- name: clear()
  uid: word!Word.ContentControl#clear:member(1)
  package: word!
  fullName: clear()
  summary: コンテンツ コントロールの内容をクリアします。ユーザーは、消去された内容を元に戻す操作を実行できます。
  remarks: "\\[[API セット: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\n// Run a batch operation against the Word object model.\nawait Word.run(async (context) => {\n    \n    // Create a proxy object for the content controls collection.\n    var contentControls = context.document.contentControls;\n    \n    // Queue a command to load the content controls collection.\n    contentControls.load('text');\n     \n    // Synchronize the document state by executing the queued commands, \n    // and return a promise to indicate task completion.\n    await context.sync();\n        \n    if (contentControls.items.length === 0) {\n        console.log(\"There isn't a content control in this document.\");\n    } else {\n        // Queue a command to clear the contents of the first content control.\n        contentControls.items[0].clear();\n\n        // Synchronize the document state by executing the queued commands, \n        // and return a promise to indicate task completion.\n        await context.sync();\n        console.log('Content control cleared of contents.');\n    }\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'clear(): void;'
    return:
      type: void
      description: ''
- name: delete(keepContent)
  uid: word!Word.ContentControl#delete:member(1)
  package: word!
  fullName: delete(keepContent)
  summary: コンテンツ コントロールとそのコンテンツを削除します。keepContent が true の場合、コンテンツは削除されません。
  remarks: "\\[[API セット: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\n// Run a batch operation against the Word object model.\nawait Word.run(async (context) => {\n    \n    // Create a proxy object for the content controls collection.\n    var contentControls = context.document.contentControls;\n    \n    // Queue a command to load the content controls collection.\n    contentControls.load('text');\n     \n    // Synchronize the document state by executing the queued commands, \n    // and return a promise to indicate task completion.\n    await context.sync();\n        \n    if (contentControls.items.length === 0) {\n        console.log(\"There isn't a content control in this document.\");\n    } else {            \n        // Queue a command to delete the first content control. \n        // The contents will remain in the document.\n        contentControls.items[0].delete(true);\n\n        // Synchronize the document state by executing the queued commands, \n        // and return a promise to indicate task completion.\n        await context.sync();\n        console.log('Content control cleared of contents.'); \n    }\n});\n```\n```typescript\n// Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/99-preview-apis/content-control-ondeleted-event.yaml\nawait Word.run(async (context) => {\n  let contentControls = context.document.contentControls.getByTag(\"forTesting\");\n  contentControls.load(\"items\");\n  await context.sync();\n\n  if (contentControls.items.length === 0) {\n    console.log(\"There are no content controls in this document.\");\n  } else {\n    console.log(\"Control to be deleted:\");\n    console.log(contentControls.items[0]);\n    contentControls.items[0].delete(false);\n    await context.sync();\n  }\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'delete(keepContent: boolean): void;'
    parameters:
    - id: keepContent
      description: 必須。コンテンツ コントロールを使用してコンテンツを削除する必要があるかどうかを示します。keepContent が true の場合、コンテンツは削除されません。
      type: boolean
    return:
      type: void
      description: ''
