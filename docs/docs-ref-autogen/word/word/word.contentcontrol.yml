- name: onDeleted
  uid: word!Word.ContentControl#onDeleted:member
  package: word!
  fullName: onDeleted
  summary: コンテンツ コントロールが削除された場合に発生します。 このコンテンツ コントロールをハンドラーに読み込めなければ、元のプロパティを取得できない。
  remarks: >-
    \[[API セット: WordApi BETA (プレビューのみ)](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/99-preview-apis/content-control-ondeleted-event.yaml

    await Word.run(async (context) => {
      let contentControls = context.document.contentControls;
      contentControls.load("items");
      await context.sync();

      // Register the onDeleted event handler on each content control.
      if (contentControls.items.length === 0) {
        console.log("There aren't any content controls in this document so can't register event handlers.");
      } else {
        for (let i = 0; i < contentControls.items.length; i++) {
          contentControls.items[i].onDeleted.add(contentControlDeleted);
          contentControls.items[i].track();
        }

        await context.sync();

        console.log("Added event handlers for when content controls are deleted.");
      }
    });

    ```

    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/99-preview-apis/content-control-ondeleted-event.yaml

    async function contentControlDeleted(event: Word.ContentControlEventArgs) {
      await Word.run(async (context) => {
        // Display the deleted content control's ID.
        console.log(`ID of content control that was deleted: ${event.contentControl.id}`);
      });
    }

    ```
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'readonly onDeleted: OfficeExtension.EventHandlers<Word.ContentControlEventArgs>。'
    return:
      type: <xref uid="office!OfficeExtension.EventHandlers:class" />&lt;<xref uid="word!Word.ContentControlEventArgs:interface" />&gt;
