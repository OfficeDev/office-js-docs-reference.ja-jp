- name: load(options)
  uid: word!Word.ContentControl#load:member(1)
  package: word!
  fullName: load(options)
  summary: オブジェクトの指定されたプロパティを読み込むコマンドを待ち行列に入れます。 プロパティを読み取る前に、`context.sync()` を呼び出す必要があります。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'load(options?: Word.Interfaces.ContentControlLoadOptions): Word.ContentControl;'
    parameters:
    - id: options
      description: 読み込むオブジェクトのプロパティのオプションを提供します。
      type: <xref uid="word!Word.Interfaces.ContentControlLoadOptions:interface" />
    return:
      type: <xref uid="word!Word.ContentControl:class" />
      description: "\n\n#### <a name=\"examples\"></a>例\n\n```typescript\n// Load all of the content control properties\n// Run a batch operation against the Word object model.\nawait Word.run(async (context) => {\n    \n    // Create a proxy object for the content controls collection.\n    var contentControls = context.document.contentControls;\n    \n    // Queue a command to load the id property for all of the content controls.\n    context.load(contentControls, 'id');\n     \n    // Synchronize the document state by executing the queued commands, \n    // and return a promise to indicate task completion.\n    await context.sync();\n    if (contentControls.items.length === 0) {\n        console.log('No content control found.');\n    } else {\n        // Queue a command to load the properties on the first content control.\n        contentControls.items[0].load(  'appearance,' +\n                                        'cannotDelete,' +\n                                        'cannotEdit,' +\n                                        'id,' +\n                                        'placeHolderText,' +\n                                        'removeWhenEdited,' +\n                                        'title,' +\n                                        'text,' +\n                                        'type,' +\n                                        'style,' +\n                                        'tag,' +\n                                        'font/size,' +\n                                        'font/name,' +\n                                        'font/color');             \n    \n        // Synchronize the document state by executing the queued commands, \n        // and return a promise to indicate task completion.\n        await context.sync();\n        console.log('Property values of the first content control:' + \n            '   ----- appearance: ' + contentControls.items[0].appearance + \n            '   ----- cannotDelete: ' + contentControls.items[0].cannotDelete +\n            '   ----- cannotEdit: ' + contentControls.items[0].cannotEdit +\n            '   ----- color: ' + contentControls.items[0].color +\n            '   ----- id: ' + contentControls.items[0].id +\n            '   ----- placeHolderText: ' + contentControls.items[0].placeholderText +\n            '   ----- removeWhenEdited: ' + contentControls.items[0].removeWhenEdited +\n            '   ----- title: ' + contentControls.items[0].title +\n            '   ----- text: ' + contentControls.items[0].text +\n            '   ----- type: ' + contentControls.items[0].type +\n            '   ----- style: ' + contentControls.items[0].style +\n            '   ----- tag: ' + contentControls.items[0].tag +\n            '   ----- font size: ' + contentControls.items[0].font.size +\n            '   ----- font name: ' + contentControls.items[0].font.name +\n            '   ----- font color: ' + contentControls.items[0].font.color);\n    }\n});  \n```"
