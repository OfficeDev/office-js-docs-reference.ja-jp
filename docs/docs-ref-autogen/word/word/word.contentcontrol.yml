- name: insertBreak(breakTypeString, insertLocation)
  uid: word!Word.ContentControl#insertBreak:member(2)
  package: word!
  fullName: insertBreak(breakTypeString, insertLocation)
  summary: メイン文書の指定した位置に、区切りを挿入します。 このメソッドは、'RichTextTable'、'RichTextTableRow' および 'RichTextTableCell' コンテンツ コントロールでは使用できません。
  remarks: "\\[[API セット: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\n// Run a batch operation against the Word object model.\nawait Word.run(async (context) => {\n    \n    // Create a proxy object for the content controls collection.\n    var contentControls = context.document.contentControls;\n    \n    // Queue a command to load the id property for all of content controls.\n    context.load(contentControls, 'id');\n    \n    // Synchronize the document state by executing the queued commands, \n    // and return a promise to indicate task completion.\n    // We now will have access to the content control collection.\n    await context.sync();\n    if (contentControls.items.length === 0) {\n        console.log('No content control found.');\n    }\n    else {\n        // Queue a command to insert a page break after the first content control.\n        contentControls.items[0].insertBreak(Word.BreakType.page, Word.InsertLocation.after);\n        \n        // Synchronize the document state by executing the queued commands, \n        // and return a promise to indicate task completion.\n        await context.sync();\n        console.log('Inserted a page break after the first content control.');    \n    }\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'insertBreak(breakTypeString: "Page" |"Next" |"SectionNext" |"SectionContinuous" |"SectionEven" |"SectionOdd" |"Line", insertLocation: "Before" |"After" |"Start" |"End" |"Replace"): void;'
