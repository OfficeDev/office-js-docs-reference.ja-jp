  fullName: search(searchText, searchOptions)
  summary: コンテンツ コントロール オブジェクトのスコープで、指定した SearchOptions を使用して検索を実行します。 検索結果は、範囲オブジェクトのコレクションです。
  remarks: "\\[[API セット: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\n// Run a batch operation against the Word object model.\nawait Word.run(async (context) => {\n    \n    // Create a proxy object for the content controls collection.\n    var contentControls = context.document.contentControls;\n    \n    // Queue a command to load the id property for all of the content controls.\n    context.load(contentControls, 'id');\n     \n    // Synchronize the document state by executing the queued commands, \n    // and return a promise to indicate task completion.\n    await context.sync();\n    if (contentControls.items.length === 0) {\n        console.log('No content control found.');\n    }\n    else {\n        // Queue a command to select the first content control.\n        contentControls.items[0].select();\n    \n        // Synchronize the document state by executing the queued commands, \n        // and return a promise to indicate task completion.\n        await context.sync();\n        console.log('Selected the first content control.');\n    }\n});  \n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'search(searchText: string, searchOptions?: Word.SearchOptions |{ ignorePunct?: boolean; ignoreSpace?: boolean; matchCase?: boolean; matchPrefix?: boolean; matchSuffix?: boolean; matchWholeWord?: boolean; matchWildcards?: boolean; matchWildcards?: boolean; }): Word.RangeCollection;'
    parameters:
    - id: searchText
      description: 必須。検索テキスト。
      type: string
    - id: searchOptions
      description: 省略可能。検索のオプション。
      type: >-
        <xref uid="word!Word.SearchOptions:class" /> | {
                    ignorePunct?: boolean;
                    ignoreSpace?: boolean;
                    matchCase?: boolean;
                    matchPrefix?: boolean;
                    matchSuffix?: boolean;
                    matchWholeWord?: boolean;
                    matchWildcards?: boolean;
                }
    return:
      type: <xref uid="word!Word.RangeCollection:class" />
      description: ''
