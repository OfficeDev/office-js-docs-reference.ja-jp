- name: getHtml()
  uid: word!Word.ContentControl#getHtml:member(1)
  package: word!
  fullName: getHtml()
  summary: コンテンツ コントロール オブジェクトの HTML 表記を取得します。 Web ページまたは HTML ビューアーでレンダリングされる場合、書式設定は文書の書式設定と完全に一致しませんが、閉じます。 このメソッドは、異なるプラットフォーム上の同じドキュメント (Windows Mac、Word on the webなど) に対してまったく同じ HTML を返す必要があります。 正確な忠実度、または `ContentControl.getOoxml()` プラットフォーム間の一貫性が必要な場合は、返される XML を HTML に使用して変換します。
  remarks: "\\[[API セット: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\n// Run a batch operation against the Word object model.\nawait Word.run(async (context) => {\n    \n    // Create a proxy object for the content controls collection that contains a specific tag.\n    var contentControlsWithTag = context.document.contentControls.getByTag('Customer-Address');\n    \n    // Queue a command to load the tag property for all of content controls.\n    context.load(contentControlsWithTag, 'tag');\n     \n    // Synchronize the document state by executing the queued commands, \n    // and return a promise to indicate task completion.\n    await context.sync();\n    if (contentControlsWithTag.items.length === 0) {\n        console.log('No content control found.');\n    }\n    else {\n        // Queue a command to get the HTML contents of the first content control.\n        var html = contentControlsWithTag.items[0].getHtml();\n    \n        // Synchronize the document state by executing the queued commands, \n        // and return a promise to indicate task completion.\n        await context.sync();\n        console.log('Content control HTML: ' + html.value);\n    }\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getHtml(): OfficeExtension.ClientResult<string>;'
    return:
      type: <xref uid="office!OfficeExtension.ClientResult:class" />&lt;string&gt;
      description: ''
- name: getOoxml()
  uid: word!Word.ContentControl#getOoxml:member(1)
  package: word!
  fullName: getOoxml()
  summary: コンテンツ コントロール オブジェクトの Office Open XML (OOXML) 表記を取得します。
  remarks: "\\[[API セット: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>例\n\n```typescript\n// Run a batch operation against the Word object model.\nawait Word.run(async (context) => {\n    \n    // Create a proxy object for the content controls collection.\n    var contentControls = context.document.contentControls;\n    \n    // Queue a command to load the id property for all of the content controls.\n    context.load(contentControls, 'id');\n     \n    // Synchronize the document state by executing the queued commands, \n    // and return a promise to indicate task completion.\n    await context.sync();\n    if (contentControls.items.length === 0) {\n        console.log('No content control found.');\n    }\n    else {\n        // Queue a command to get the OOXML contents of the first content control.\n        var ooxml = contentControls.items[0].getOoxml();\n    \n        // Synchronize the document state by executing the queued commands, \n        // and return a promise to indicate task completion.\n        await context.sync();\n        console.log('Content control OOXML: ' + ooxml.value);\n    }\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getOoxml(): OfficeExtension.ClientResult<string>;'
    return:
      type: <xref uid="office!OfficeExtension.ClientResult:class" />&lt;string&gt;
      description: ''
