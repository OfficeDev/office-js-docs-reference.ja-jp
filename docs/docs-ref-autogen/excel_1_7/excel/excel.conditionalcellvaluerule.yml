name: Excel.ConditionalCellValueRule
uid: excel!Excel.ConditionalCellValueRule:interface
package: excel!
fullName: Excel.ConditionalCellValueRule
summary: セル値の条件付き書式ルールを表します。
remarks: '\[[API セット: ExcelApi 1.6](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: false
isDeprecated: false
type: interface
properties:
- name: formula1
  uid: excel!Excel.ConditionalCellValueRule#formula1:member
  package: excel!
  fullName: formula1
  summary: 必要に応じて、条件付き書式ルールを評価する数式。
  remarks: >-
    \[[API セット: ExcelApi 1.6](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/14-conditional-formatting/conditional-formatting-basic.yaml

    await Excel.run(async (context) => {
        const sheet = context.workbook.worksheets.getItem("Sample");
        const range = sheet.getRange("B21:E23");
        const conditionalFormat = range.conditionalFormats
            .add(Excel.ConditionalFormatType.cellValue);
        conditionalFormat.cellValue.format.font.color = "red";
        conditionalFormat.cellValue.rule = { formula1: "=0", operator: "LessThan" };

        await context.sync();
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'formula1: string;'
    return:
      type: string
