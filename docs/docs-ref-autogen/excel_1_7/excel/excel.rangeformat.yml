- name: textOrientation
  uid: excel!Excel.RangeFormat#textOrientation:member
  package: excel!
  fullName: textOrientation
  summary: 範囲内のすべてのセルのテキストの向き。 テキストの向きは、-90 ~ 90 の整数、または垂直方向のテキストの場合は 180 です。 範囲内の方向が一様ではない場合は `null` 、返されます。
  remarks: >-
    \[[API セット: ExcelApi 1.7](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>例


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/42-range/range-text-orientation.yaml

    await Excel.run(async (context) => {
        const sheet = context.workbook.worksheets.getItem("Sample");
        const range = sheet.getRange("B2:E2");

        // Set textOrientation to either an integer between -90 and 90
        // or to 180 for vertically-oriented text.
        range.format.textOrientation = 90;

        await context.sync();
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'textOrientation: number;'
    return:
      type: number
- name: useStandardHeight
  uid: excel!Excel.RangeFormat#useStandardHeight:member
  package: excel!
  fullName: useStandardHeight
  summary: 'オブジェクトの行の高さが `Range` シートの標準の高さと等しいかどうかを指定します。 オブジェクトの `true` 行の高さが `Range` シートの標準の高さと等しい場合に返します。 範囲に `null` 複数の行が含まれている場合に、行が同じ高さではない場合に返します。 それ以外の場合 `false` は返します。 注: このプロパティは、 `true`<!-- -->. 設定は `false` 無効です。'
  remarks: '\[[API セット: ExcelApi 1.7](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'useStandardHeight: boolean;'
    return:
      type: boolean
- name: useStandardWidth
  uid: excel!Excel.RangeFormat#useStandardWidth:member
  package: excel!
  fullName: useStandardWidth
  summary: 'オブジェクトの列幅が `Range` シートの標準幅と等しい場合に指定します。 オブジェクトの `true` 列幅が `Range` シートの標準幅と等しい場合に返します。 範囲に `null` 複数の列が含まれている場合に、列の高さが同じでない場合に返します。 それ以外の場合 `false` は返します。 注: このプロパティは、 `true`<!-- -->. 設定は `false` 無効です。'
  remarks: '\[[API セット: ExcelApi 1.7](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
