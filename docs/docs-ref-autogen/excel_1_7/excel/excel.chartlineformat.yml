- name: load(propertyNames)
  uid: excel!Excel.ChartLineFormat#load:member(2)
  package: excel!
  fullName: load(propertyNames)
  summary: オブジェクトの指定されたプロパティを読み込むコマンドを待ち行列に入れます。 プロパティを読み取る前に、`context.sync()` を呼び出す必要があります。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'load(propertyNames?: string | string[]): Excel.ChartLineFormat;'
    parameters:
    - id: propertyNames
      description: 読み込むプロパティを指定するコンマ区切り文字列または文字列の配列。
      type: string | string[]
    return:
      type: <xref uid="excel!Excel.ChartLineFormat:class" />
      description: "\n\n#### <a name=\"examples\"></a>例\n\n```typescript\n// Set chart major gridlines on value axis to be red.\nawait Excel.run(async (context) => {\n    var gridlines = context.workbook.worksheets.getItem(\"Sheet1\").charts.getItem(\"Chart1\").axes.valueAxis.majorGridlines;\n    gridlines.format.line.color = \"#FF0000\";\n    await context.sync()\n    \n    console.log(\"Chart Gridlines Color Updated\");\n});\n```"
