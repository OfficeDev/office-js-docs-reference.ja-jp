  isPreview: false
  isDeprecated: false
  syntax:
    content: 'isInline: boolean;'
    return:
      type: boolean
- name: name
  uid: outlook!Office.AttachmentDetailsCompose#name:member
  package: outlook!
  fullName: name
  summary: >-
    添付ファイルの名前を取得します。


    **重要**: ドラッグ アンド ドロップまたは "アイテムの添付" によって添付されたメッセージまたは予定アイテムの場合、Mac 上の Outlook にはファイル拡張子が含まれますが、Web または Windows の内線番号 `name` は除外されます。
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'name: string;'
    return:
      type: string
